ain{padding:12px 12px 28px}\nh1{font-size:1.4rem}\n.tabs{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 0 8px;padding:8px 0}\n.opt{padding:13px 14px;min-height:48px;line-height:1.45}\n.btn{min-height:46px}\n.card{overflow-wrap:anywhere}\n@media(max-width:640px){\n table{min-width:0;font-size:.9rem}th,td{padding:6px 7px}\n #box .btn,#res .btn{width:100%}\n .tabs button{padding:9px 6px;font-size:.92rem}\n}\n@media(min-width:800px){\n main{max-width:1100px;padding:20px 28px 40px}\n h1{font-size:1.8rem}\n #sum{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;align-items:start}\n #sum>*{grid-column:1/-1;margin-top:0;margin-bottom:0}\n #sum>details.card{grid-column:auto}\n #sum>h2{margin-top:.6em}\n #quiz{max-width:900px;margin:0 auto}\n #box{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}\n #box>.q,#box>#ex,#box>.btn,#box>select.opt{grid-column:1/-1}\n #box>.btn{justify-self:start}\n #box .opt{margin:0}\n}\n@media(min-width:1080px){\n main{max-width:1760px;padding:20px 32px 40px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(380px,.9fr);column-gap:32px;align-content:start}\n main>h1,main>.sub,main>footer{grid-column:1/-1}\n .tabs{display:none}\n #sum,#sum.hide{display:grid!important;grid-column:1;grid-template-columns:1fr}\n #quiz,#quiz.hide{display:block!important;grid-column:2;position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;max-width:none;margin:0}\n #box{grid-template-columns:1fr}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003ch1>Thông tư 32/2023/TT-BYT\u003c/h1>\n\u003cp class=\"sub\">Quy định chi tiết một số điều của Luật Khám bệnh, chữa bệnh · Ban hành 31/12/2023 · Hiệu lực 01/01/2024 · 11 chương, 56 điều\u003c/p>\n\u003cdiv class=\"tabs\">\u003cbutton id=\"t1\" class=\"on\">📘 Tóm tắt\u003c/button>\u003cbutton id=\"t2\">📝 Trắc nghiệm (83 câu · xáo trộn)\u003c/button>\u003c/div>\n\n\u003csection id=\"sum\">\n\u003cdiv class=\"note\">Thông tư hướng dẫn Luật KBCB số 15/2023/QH15, cùng Nghị định 96/2023/NĐ-CP. Người ký: Thứ trưởng Trần Văn Thuấn. Văn bản đã có thông tư sửa đổi, bổ sung một số điều được đăng trên chinhphu.vn năm 2026; hãy đối chiếu bản hợp nhất mới nhất khi áp dụng thực tế.\u003c/div>\n\n\u003ch2>Con số cần nhớ\u003c/h2>\n\u003cdiv class=\"card tw\">\u003ctable>\n\u003ctr>\u003cth>Nội dung\u003c/th>\u003cth>Quy định\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Cập nhật kiến thức y khoa\u003c/td>\u003ctd>Tối thiểu 120 giờ tín chỉ / 05 năm liên tục; 1 giờ tín chỉ = 1 tiết học (khóa ngắn hạn)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Thừa nhận tiêu chuẩn chất lượng\u003c/td>\u003ctd>Hội đồng thẩm định; 20 ngày kể từ khi nhận đủ hồ sơ hợp lệ; công bố trong 05 ngày làm việc\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Đánh giá GCP\u003c/td>\u003ctd>Định kỳ 03 năm/lần; nộp hồ sơ duy trì trước hạn tối thiểu 60 ngày; 3 mức độ tuân thủ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Giấy khám sức khỏe\u003c/td>\u003ctd>Hiệu lực 12 tháng; trả trong 24 giờ (khám đơn lẻ); ảnh 4×6 cm chụp không quá 06 tháng\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Giấy KSK nước ngoài\u003c/td>\u003ctd>Có điều ước/thỏa thuận thừa nhận lẫn nhau; dùng không quá 06 tháng; dịch và chứng thực\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lịch trực\u003c/td>\u003ctd>Phân công theo tháng, công bố trước ít nhất 01 tuần\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hội đồng chuyên môn (tai biến y khoa)\u003c/td>\u003ctd>1 Chủ tịch, 1–2 Phó, tối thiểu 3 thành viên, tối thiểu 1 thư ký; tổng số lẻ; họp khi có ≥ 2/3 thành viên\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hồ sơ bệnh án\u003c/td>\u003ctd>82 mẫu bệnh án, giấy, phiếu y (Phụ lục XXVIII, XXIX)\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\n\u003ch2>Nội dung theo chương\u003c/h2>\n\u003cdetails class=\"card\" open>\u003csummary>Chương I – Quy định chung (Điều 1–2)\u003c/summary>\u003cul>\n\u003cli>Điều chỉnh 10 nhóm nội dung: cập nhật kiến thức y khoa liên tục; phạm vi hành nghề; mẫu giấy phép hành nghề; thừa nhận tiêu chuẩn chất lượng; hồ sơ bệnh án; trực KBCB; khám sức khỏe; GCP; hội đồng chuyên môn/tai biến y khoa; huy động nhân lực khi thiên tai, dịch nhóm A, tình trạng khẩn cấp.\u003c/li>\n\u003cli>Giải thích từ ngữ: cơ sở cập nhật kiến thức, giờ tín chỉ, thử nghiệm lâm sàng, GCP, IB, CRF, ICD.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Chương II – Cập nhật kiến thức y khoa liên tục (Điều 3–9)\u003c/summary>\u003cul>\n\u003cli>Nghĩa vụ tối thiểu 120 giờ tín chỉ trong 5 năm; các hình thức được cộng dồn sau khi quy đổi (Phụ lục I).\u003c/li>\n\u003cli>Bốn nhóm hình thức: (1) khóa ngắn hạn, hội nghị, hội thảo; (2) biên soạn giáo trình, tài liệu; (3) nghiên cứu khoa học, giảng dạy; (4) tự cập nhật và hình thức khác (hướng dẫn luận văn, tham gia hội đồng, hội chẩn, đào tạo cấp văn bằng/chứng chỉ).\u003c/li>\n\u003cli>Khóa ngắn hạn: trực tiếp hoặc trực tiếp kết hợp trực tuyến; công khai kế hoạch trên website trước khi tổ chức; chương trình theo Phụ lục III; cấp giấy chứng nhận theo Phụ lục II.\u003c/li>\n\u003cli>Hội nghị, hội thảo: trực tiếp hoặc trực tuyến; báo cáo viên có phạm vi hành nghề phù hợp.\u003c/li>\n\u003cli>Cơ sở tổ chức khóa ngắn hạn phải gửi thông báo (Phụ lục IV) về Bộ Y tế (Cục KHCN&ĐT), hoặc về Bộ Y tế và Sở Y tế nếu thuộc Sở Y tế quản lý.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Chương III – Phạm vi hành nghề và mẫu giấy phép (Điều 10–12)\u003c/summary>\u003cul>\n\u003cli>Nguyên tắc: phù hợp văn bằng, chứng chỉ và năng lực; bảo đảm chất lượng, an toàn người bệnh; phù hợp thực tiễn, nhất là vùng khó khăn; không phân biệt cấp chuyên môn kỹ thuật và thời gian hành nghề.\u003c/li>\n\u003cli>Phạm vi theo chức danh: bác sỹ y khoa (PL V), YHCT (VI), YHDP (VII), RHM (VIII), bác sỹ chuyên khoa (V + IX), y sỹ đa khoa (X), y sỹ YHCT (XI), điều dưỡng (XII), hộ sinh (XIII), kỹ thuật y (XIV), dinh dưỡng lâm sàng (XV), tâm lý lâm sàng (XVI), cấp cứu viên ngoại viện (XVII), lương y (XVIII).\u003c/li>\n\u003cli>Bài thuốc gia truyền / phương pháp chữa bệnh gia truyền: chỉ dùng đúng nội dung đã được cấp giấy chứng nhận; không kê đơn thuốc hóa dược, dược liệu, không dùng kỹ thuật y học hiện đại.\u003c/li>\n\u003cli>Mẫu giấy phép theo Phụ lục XIX.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Chương IV – Thừa nhận tiêu chuẩn quản lý chất lượng (Điều 13–16)\u003c/summary>\u003cul>\n\u003cli>Thừa nhận các tiêu chuẩn đã được ISQua công nhận; Cục Quản lý KCB rà soát và công bố.\u003c/li>\n\u003cli>Tiêu chuẩn khác phải đáp ứng tiêu chí chung (tự nguyện, khoa học, đánh giá đủ các đặc tính an toàn – hiệu quả – kịp thời – công bằng – hướng đến người bệnh; đủ 3 thành tố đầu vào, quy trình, kết quả).\u003c/li>\n\u003cli>Tổ chức chứng nhận nộp 01 bộ hồ sơ tại Cục Quản lý KCB; Hội đồng thẩm định do Bộ trưởng thành lập; có kết quả trong 20 ngày; nếu không đồng ý, thông báo lý do trong 05 ngày làm việc.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Chương V – Thực hành tốt thử lâm sàng GCP (Điều 17–29)\u003c/summary>\u003cul>\n\u003cli>Cơ quan đầu mối: Cục Khoa học công nghệ và Đào tạo. Đánh giá: lần đầu, định kỳ (3 năm), đột xuất, kiểm tra.\u003c/li>\n\u003cli>Mức độ 1: đáp ứng, không cần khắc phục. Mức độ 2: có nội dung cần khắc phục nhưng không ảnh hưởng dữ liệu/an toàn người tham gia. Mức độ 3: không đáp ứng (sai lệch nguy cơ cao hoặc gian lận, giả mạo dữ liệu).\u003c/li>\n\u003cli>Lần đầu: Cục kiểm tra hồ sơ trong 10 ngày làm việc, đánh giá thực tế trong 15 ngày làm việc; mức 1 được cấp giấy chứng nhận trong 10 ngày làm việc.\u003c/li>\n\u003cli>Khắc phục mức 2: 45 ngày; không nộp báo cáo khắc phục trong 06 tháng thì hồ sơ mất giá trị (đánh giá lần đầu).\u003c/li>\n\u003cli>Đoàn đánh giá do Bộ trưởng thành lập; xung đột lợi ích gồm từng làm việc/tư vấn cho cơ sở trong 05 năm gần đây, có lợi ích tài chính hoặc người thân làm việc tại cơ sở.\u003c/li>\n\u003cli>Kiểm soát thay đổi: thay đổi phạm vi, địa điểm phải đánh giá lại; thay đổi phòng kỹ thuật cùng địa điểm, thông tin hành chính chỉ báo cáo.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Chương VI – Tiêu chuẩn và việc khám sức khỏe (Điều 30–38)\u003c/summary>\u003cul>\n\u003cli>Khám tại cơ sở có giấy phép; không áp dụng cho khám bệnh nội/ngoại trú, giám định y khoa/pháp y, giấy chứng thương, bệnh nghề nghiệp, đối tượng của Bộ Quốc phòng, Bộ Công an, ngành nghề đặc thù.\u003c/li>\n\u003cli>Hồ sơ: người ≥ 18 tuổi dùng Mẫu 01; chưa đủ 18 tuổi dùng Mẫu 02; khám định kỳ dùng Mẫu 03 (Phụ lục XXIV). Người mất hoặc hạn chế năng lực hành vi dân sự cần văn bản đồng ý của thân nhân.\u003c/li>\n\u003cli>Quy trình: đối chiếu ảnh, đóng dấu giáp lai vào ảnh, hướng dẫn quy trình, trả kết quả và lưu hồ sơ.\u003c/li>\n\u003cli>Khám theo yêu cầu không đủ chuyên khoa: chỉ khám và kết luận từng chuyên khoa, không phân loại sức khỏe. Lao động nữ khám định kỳ được khám phụ sản (Phụ lục XXV).\u003c/li>\n\u003cli>Giấy KSK cấp 01 bản cho người khám, 01 bản lưu; giá trị 12 tháng; trả trong 24 giờ (khám đơn lẻ), khám tập thể theo hợp đồng.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Chương VII – Huy động nhân lực khi thiên tai, dịch nhóm A, khẩn cấp (Điều 39–41)\u003c/summary>\u003cul>\n\u003cli>Được huy động: người hành nghề làm việc ngoài phạm vi trong giấy phép; người nước ngoài/Việt kiều có giấy phép nước ngoài (không cần giấy phép Việt Nam); sinh viên, học sinh khối ngành sức khỏe và người chưa được cấp giấy phép.\u003c/li>\n\u003cli>Thẩm quyền điều động: Bộ trưởng Bộ Y tế (toàn quốc, trừ lực lượng Quốc phòng, Công an); Chủ tịch UBND tỉnh hoặc đơn vị được ủy quyền; Thủ trưởng cơ sở KBCB, cơ sở y tế dự phòng, cơ sở đào tạo khối ngành sức khỏe.\u003c/li>\n\u003cli>Giám đốc Sở Y tế tiếp nhận, phân công lực lượng đến từng cơ sở; Thủ trưởng cơ sở phân công chi tiết từng vị trí.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Chương VIII – Trực khám bệnh, chữa bệnh (Điều 42–47)\u003c/summary>\u003cul>\n\u003cli>Áp dụng cho cơ sở có giường bệnh nội trú, giường lưu, cơ sở cấp cứu ngoại viện. Bảo đảm liên tục 24/24 giờ, đủ nhân lực, phương tiện, thuốc; người trực có mặt trước giờ nhận trực, không rời vị trí.\u003c/li>\n\u003cli>Lịch trực phân công theo tháng, công bố trước ≥ 01 tuần, lãnh đạo bệnh viện ký duyệt; đổi trực ngang cấp phải được lãnh đạo phê duyệt.\u003c/li>\n\u003cli>Các vị trí trực trong bệnh viện: lãnh đạo; lâm sàng (trưởng phiên trực là trưởng/phó khoa hoặc bác sĩ sau đại học); cận lâm sàng; hậu cần – quản trị; thường trú ngoại viện.\u003c/li>\n\u003cli>Báo cáo phiên trực: tử vong, cấp cứu, diễn biến nặng của người bệnh nội trú, thuốc sử dụng; giao ban sau phiên trực.\u003c/li>\n\u003cli>Cơ sở không phải bệnh viện nhưng có giường nội trú/giường lưu: tối thiểu 01 bác sĩ hoặc y sỹ + 01 điều dưỡng, hộ sinh hoặc kỹ thuật y. Trạm y tế xã: tối thiểu 01 người (bác sĩ, y sỹ, điều dưỡng, hộ sinh, kỹ thuật y).\u003c/li>\n\u003cli>Cấp cứu ngoại viện 24/24: tối thiểu 01 bác sĩ/y sỹ + 01 điều dưỡng/hộ sinh/kỹ thuật y + 01 lái xe cấp cứu; bố trí độc lập với phiên trực khác.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Chương IX – Hội đồng chuyên môn và giải quyết tranh chấp tai biến y khoa (Điều 48–50)\u003c/summary>\u003cul>\n\u003cli>Hội đồng độc lập, khách quan, không xung đột lợi ích; thành viên có phạm vi hành nghề/chuyên môn liên quan; tổng số thành viên là số lẻ.\u003c/li>\n\u003cli>Họp khi có ít nhất 2/3 thành viên; kết luận theo đa số, lập biên bản có chữ ký; có thể mời thêm chuyên gia mà không cần sửa quyết định thành lập.\u003c/li>\n\u003cli>Kết luận phải xác định nguyên nhân: nếu thuộc khoản 2 Điều 100 Luật thì người hành nghề không có sai sót chuyên môn; nếu có sai sót phải nêu vi phạm, mức độ và hình thức xử lý.\u003c/li>\n\u003cli>Các cấp giải quyết (bệnh viện thuộc Sở Y tế): hội đồng cấp cơ sở → hội đồng Sở Y tế → hội đồng Bộ Y tế (kết luận cuối cùng) → khởi kiện tại tòa án.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Chương X – Hồ sơ bệnh án (Điều 51–52)\u003c/summary>\u003cul>\n\u003cli>82 mẫu bệnh án, giấy, phiếu y; được dùng bệnh án giấy hoặc bệnh án điện tử (phải đủ các trường thông tin).\u003c/li>\n\u003cli>Ghi chép chính xác, trung thực, đầy đủ, rõ ràng; ghi rõ thời gian và người ghi.\u003c/li>\n\u003cli>Không dùng chữ viết tắt trong tài liệu cung cấp cho người bệnh: bản tóm tắt hồ sơ bệnh án, tài liệu bàn giao cho cơ sở khác, giấy chuyển tuyến BHYT, giấy hẹn khám lại.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Chương XI – Điều khoản thi hành (Điều 53–56)\u003c/summary>\u003cul>\n\u003cli>Hiệu lực từ 01/01/2024; thay thế nhiều văn bản cũ, trong đó có Thông tư 35/2019, 55/2015, 14/2013, 09/2023, 41/2011, 41/2015 và các quy định về đào tạo liên tục tại Thông tư 22/2013, 26/2020.\u003c/li>\n\u003cli>Chuyển tiếp: người đã có chứng chỉ hành nghề theo Luật 40/2009 áp dụng phạm vi hành nghề theo Thông tư này; cơ sở đã có giấy chứng nhận GCP thử thuốc phải rà soát và nộp hồ sơ theo Điều 20; Cục có 20 ngày làm việc để cấp giấy chứng nhận nếu hồ sơ đầy đủ.\u003c/li>\u003c/ul>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"quiz\" class=\"hide\">\n\u003cdiv class=\"bar\">\u003ci id=\"pb\">\u003c/i>\u003c/div>\n\u003cdiv class=\"sub\" id=\"pg\">\u003c/div>\n\u003cdiv class=\"card\" id=\"box\">\u003c/div>\n\u003cdiv id=\"res\" class=\"card hide\">\u003c/div>\n\u003c/section>\n\n\u003cfooter>Nguồn: toàn văn Thông tư 32/2023/TT-BYT (Bộ Y tế). Nội dung tóm tắt chỉ phục vụ ôn tập, không thay thế văn bản gốc.\u003c/footer>\n\u003c/main>\n\u003cscript>\nvar Q=[\n[\"Thông tư 32/2023/TT-BYT được ban hành và có hiệu lực vào ngày nào?\",[\"Ban hành 31/12/2023, hiệu lực 01/01/2024\",\"Ban hành 09/01/2023, hiệu lực 01/01/2024\",\"Ban hành 30/12/2023, hiệu lực 01/07/2024\",\"Ban hành 31/12/2023, hiệu lực 01/07/2024\"],0,\"Thông tư ký ngày 31/12/2023 và có hiệu lực từ 01/01/2024 (Điều 53).\"],\n[\"Người hành nghề phải cập nhật kiến thức y khoa liên tục tối thiểu bao nhiêu?\",[\"48 giờ tín chỉ trong 02 năm\",\"120 giờ tín chỉ trong 05 năm liên tục\",\"60 giờ tín chỉ trong 03 năm\",\"200 giờ tín chỉ trong 05 năm\"],1,\"Điều 3: tối thiểu 120 giờ tín chỉ trong 05 năm liên tục.\"],\n[\"01 giờ tín chỉ đối với khóa đào tạo, bồi dưỡng ngắn hạn tương đương với:\",[\"1 ngày học\",\"1 buổi học\",\"1 tiết học\",\"1 tuần học\"],2,\"Điều 3 khoản 1: 01 giờ tín chỉ tương đương 01 tiết học.\"],\n[\"Hội nghị, hội thảo y khoa dùng để cập nhật kiến thức được tổ chức theo hình thức nào?\",[\"Chỉ trực tiếp\",\"Chỉ trực tuyến\",\"Chỉ trực tiếp kết hợp trực tuyến\",\"Trực tiếp hoặc trực tuyến\"],3,\"Điều 4 khoản 2 điểm đ. (Khóa ngắn hạn thì là trực tiếp hoặc trực tiếp kết hợp trực tuyến.)\"],\n[\"Cơ sở thuộc thẩm quyền Sở Y tế tổ chức khóa ngắn hạn cập nhật kiến thức phải gửi thông báo (Phụ lục IV) về đâu?\",[\"Bộ Y tế và Sở Y tế\",\"Chỉ Sở Y tế\",\"Chỉ UBND tỉnh\",\"Cục Quản lý KCB\"],0,\"Điều 9 khoản 5: gửi về Bộ Y tế và Sở Y tế đối với cơ sở thuộc thẩm quyền Sở Y tế.\"],\n[\"Phạm vi hành nghề của y sỹ đa khoa được quy định tại Phụ lục nào?\",[\"Phụ lục V\",\"Phụ lục VIII\",\"Phụ lục XII\",\"Phụ lục X\"],3,\"Điều 11 khoản 6 điểm a: Phụ lục số X.\"],\n[\"Người có bài thuốc gia truyền KHÔNG được:\",[\"Dùng nhiều bài thuốc được cấp giấy chứng nhận cho một người bệnh\",\"Kê đơn, dùng thuốc hóa dược, dược liệu và kỹ thuật y học hiện đại để khám, chữa bệnh\",\"Khám bệnh bằng bài thuốc đã được chứng nhận\",\"Dùng đồng thời bài thuốc và phương pháp gia truyền\"],1,\"Điều 11 khoản 14 điểm đ.\"],\n[\"Thông tư thừa nhận các tiêu chuẩn quản lý chất lượng cơ sở KBCB đã được tổ chức quốc tế nào công nhận?\",[\"WHO\",\"JCI\",\"ICH\",\"ISQua\"],3,\"Điều 13 khoản 1: Hiệp hội quốc tế về chất lượng y tế (ISQua).\"],\n[\"Thời hạn xử lý hồ sơ thừa nhận tiêu chuẩn quản lý chất lượng (kể từ khi nhận đủ hồ sơ hợp lệ) là:\",[\"10 ngày\",\"20 ngày\",\"30 ngày\",\"45 ngày\"],1,\"Điều 16 khoản 3 điểm c: trong thời hạn 20 ngày.\"],\n[\"Đánh giá định kỳ việc đáp ứng GCP được thực hiện bao lâu một lần?\",[\"01 năm\",\"02 năm\",\"03 năm\",\"05 năm\"],2,\"Điều 18 khoản 2: 03 năm một lần kể từ ngày cấp giấy chứng nhận.\"],\n[\"Cơ sở nhận thử có hành vi gian lận, giả mạo, sửa chữa số liệu thuộc mức độ tuân thủ GCP nào?\",[\"Mức độ 3 (không đáp ứng GCP)\",\"Mức độ 1\",\"Mức độ 2\",\"Không xếp mức độ\"],0,\"Điều 19 khoản 3 điểm b.\"],\n[\"Cơ sở được kết luận đáp ứng GCP ở mức độ 1 sẽ được cấp giấy chứng nhận trong thời hạn nào?\",[\"05 ngày làm việc\",\"20 ngày làm việc\",\"10 ngày làm việc\",\"45 ngày\"],2,\"Điều 23 khoản 1: trong 10 ngày làm việc kể từ ngày ký biên bản đánh giá.\"],\n[\"Giấy khám sức khỏe có giá trị trong thời hạn bao lâu kể từ ngày ký kết luận?\",[\"06 tháng\",\"12 tháng\",\"24 tháng\",\"36 tháng\"],1,\"Điều 38 khoản 4 điểm a: 12 tháng.\"],\n[\"Với khám sức khỏe đơn lẻ, cơ sở trả giấy khám sức khỏe trong vòng:\",[\"48 giờ\",\"72 giờ\",\"12 giờ\",\"24 giờ\"],3,\"Điều 38 khoản 3 điểm a: 24 giờ kể từ khi kết thúc khám (trừ trường hợp cần khám/xét nghiệm bổ sung).\"],\n[\"Ảnh dán trong hồ sơ khám sức khỏe có quy cách nào?\",[\"3×4 cm, chụp không quá 03 tháng\",\"4×6 cm, chụp không quá 12 tháng\",\"4×6 cm, chụp không quá 06 tháng\",\"3×4 cm, chụp không quá 06 tháng\"],2,\"Điều 34: ảnh 04cm x 06cm, nền trắng, chụp không quá 06 tháng.\"],\n[\"Giấy khám sức khỏe do cơ sở nước ngoài cấp được sử dụng khi:\",[\"Có điều ước/thỏa thuận thừa nhận lẫn nhau, dùng không quá 06 tháng, dịch và chứng thực bản dịch\",\"Được Sở Y tế xác nhận, dùng không quá 12 tháng\",\"Chỉ cần dịch sang tiếng Việt, dùng không quá 24 tháng\",\"Không được sử dụng trong mọi trường hợp\"],0,\"Điều 31 khoản 3.\"],\n[\"Trường hợp khám sức khỏe theo yêu cầu nhưng không khám đầy đủ chuyên khoa, cơ sở:\",[\"Phân loại sức khỏe loại I\",\"Chỉ khám, kết luận từng chuyên khoa theo yêu cầu và không phân loại sức khỏe\",\"Từ chối khám\",\"Phân loại sức khỏe theo chuyên khoa có kết quả xấu nhất\"],1,\"Điều 32 khoản 3 và Điều 36 khoản 6.\"],\n[\"Lịch trực khám bệnh, chữa bệnh phải được công bố trước thời điểm trực ít nhất:\",[\"24 giờ\",\"03 ngày\",\"01 tháng\",\"01 tuần\"],3,\"Điều 43 khoản 5: công bố trước ít nhất một tuần; phân công theo tháng.\"],\n[\"Mỗi phiên trực tại trạm y tế cấp xã phải bố trí tối thiểu:\",[\"01 bác sĩ và 01 điều dưỡng\",\"02 người hành nghề bất kỳ\",\"01 người hành nghề thuộc một trong các chức danh: bác sĩ, y sỹ, điều dưỡng, hộ sinh, kỹ thuật y\",\"01 bác sĩ và 01 y sỹ\"],2,\"Điều 46 khoản 2.\"],\n[\"Nhân lực tối thiểu cho một phiên trực cấp cứu ngoại viện gồm:\",[\"01 bác sĩ/y sỹ + 01 điều dưỡng/hộ sinh/kỹ thuật y + 01 lái xe cấp cứu\",\"02 bác sĩ + 01 lái xe\",\"01 bác sĩ + 01 lái xe\",\"01 điều dưỡng + 01 lái xe\"],0,\"Điều 47 khoản 2 điểm b.\"],\n[\"Điều kiện để tổ chức họp hội đồng chuyên môn (tai biến y khoa) là:\",[\"Có mặt toàn bộ thành viên\",\"Có mặt ít nhất 2/3 số thành viên\",\"Có mặt quá nửa số thành viên\",\"Có mặt Chủ tịch và Thư ký\"],1,\"Điều 49 khoản 1: ít nhất 2/3 số thành viên có mặt; số lượng thành viên phải là số lẻ.\"],\n[\"Trong giải quyết tranh chấp tai biến y khoa, kết luận của hội đồng nào là kết luận cuối cùng (trước khi các bên khởi kiện tại tòa)?\",[\"Hội đồng cấp cơ sở\",\"Hội đồng của Sở Y tế\",\"Hội đồng của UBND tỉnh\",\"Hội đồng của Bộ Y tế\"],3,\"Điều 50: kết luận của hội đồng chuyên môn của Bộ Y tế là kết luận cuối cùng.\"],\n[\"Nguyên tắc xác định phạm vi hành nghề của người hành nghề KHÔNG phân biệt yếu tố nào sau đây?\",[\"Văn bằng, chứng chỉ chuyên môn\",\"Chuyên khoa đăng ký hành nghề\",\"Chức danh nghề nghiệp\",\"Cấp chuyên môn kỹ thuật nơi làm việc và thời gian hành nghề\"],3,\"Điều 10 khoản 5: không phân biệt người hành nghề làm việc ở các cấp chuyên môn kỹ thuật và thời gian hành nghề.\"],\n[\"Phạm vi hành nghề của bác sỹ chuyên khoa hồi sức cấp cứu được quy định tại:\",[\"Phụ lục V và Phụ lục IX phần Nội khoa và Hồi sức cấp cứu\",\"Chỉ Phụ lục V\",\"Phụ lục X và Phụ lục XII\",\"Phụ lục VII và Phụ lục XV\"],0,\"Điều 11 khoản 5 điểm a.\"],\n[\"Trong Hội đồng thẩm định thừa nhận tiêu chuẩn quản lý chất lượng, ai là Chủ tịch Hội đồng?\",[\"Cục trưởng Cục Quản lý KCB\",\"Lãnh đạo Bộ Y tế\",\"Vụ trưởng Vụ Pháp chế\",\"Giám đốc Sở Y tế\"],1,\"Điều 16 khoản 2: Lãnh đạo Bộ Y tế là Chủ tịch; lãnh đạo Cục Quản lý KCB là Phó Chủ tịch thường trực.\"],\n[\"Cơ sở nhận thử nộp hồ sơ đề nghị đánh giá GCP lần đầu đến đơn vị nào?\",[\"Sở Y tế\",\"Cục Quản lý KCB\",\"Bộ Y tế (Cục Khoa học công nghệ và Đào tạo)\",\"Hội đồng đạo đức quốc gia\"],2,\"Điều 21 khoản 1.\"],\n[\"Cục KHCN&ĐT kiểm tra tính đầy đủ, hợp lệ của hồ sơ đánh giá GCP lần đầu trong thời hạn:\",[\"05 ngày làm việc\",\"07 ngày làm việc\",\"15 ngày làm việc\",\"10 ngày làm việc\"],3,\"Điều 21 khoản 2: 10 ngày làm việc; sau đó đánh giá thực tế trong 15 ngày làm việc.\"],\n[\"Cơ sở nhận thử phải nộp hồ sơ đề nghị đánh giá duy trì GCP trước thời điểm hết hạn giấy chứng nhận tối thiểu:\",[\"30 ngày\",\"45 ngày\",\"60 ngày\",\"90 ngày\"],2,\"Điều 24 khoản 2: tối thiểu 60 ngày.\"],\n[\"Cục KHCN&ĐT công bố danh sách cơ sở nhận thử phải đánh giá duy trì GCP trong năm tiếp theo vào thời điểm nào?\",[\"Tháng 12 hằng năm\",\"Tháng 1 hằng năm\",\"Tháng 6 hằng năm\",\"Quý III hằng năm\"],0,\"Điều 24 khoản 1.\"],\n[\"Sau đánh giá định kỳ GCP mức độ 2, cơ sở phải hoàn thành khắc phục và báo cáo trong thời hạn:\",[\"20 ngày\",\"45 ngày\",\"60 ngày\",\"06 tháng\"],1,\"Điều 25 khoản 2 điểm b: 45 ngày kể từ ngày có văn bản yêu cầu.\"],\n[\"Ai làm Trưởng đoàn đánh giá việc đáp ứng GCP?\",[\"Lãnh đạo Vụ Pháp chế\",\"Lãnh đạo Cục Quản lý KCB\",\"Chuyên viên Cục KHCN&ĐT\",\"Đại diện Lãnh đạo Cục Khoa học công nghệ và Đào tạo\"],3,\"Điều 28 khoản 1 điểm a; Bộ trưởng Bộ Y tế thành lập đoàn.\"],\n[\"Thành viên Đoàn đánh giá được coi là có xung đột lợi ích nếu:\",[\"Từng làm việc cho cơ sở được đánh giá trong vòng 05 năm gần đây\",\"Từng học cùng trường với lãnh đạo cơ sở\",\"Từng tham gia hội nghị do cơ sở tổ chức\",\"Cùng địa phương với cơ sở\"],0,\"Điều 28 khoản 4: làm việc hoặc tư vấn trong 05 năm gần đây, có lợi ích tài chính, hoặc có người thân làm việc tại cơ sở.\"],\n[\"Hồ sơ khám sức khỏe của người chưa đủ 18 tuổi dùng mẫu nào?\",[\"Mẫu số 01 Phụ lục XXIV\",\"Mẫu số 02 Phụ lục XXIV\",\"Mẫu số 03 Phụ lục XXIV\",\"Mẫu số 02 Phụ lục XXV\"],1,\"Điều 34 khoản 2: Mẫu số 02 Phụ lục XXIV. Người từ đủ 18 tuổi dùng Mẫu 01; khám định kỳ dùng Sổ Mẫu 03.\"],\n[\"Người được khám sức khỏe định kỳ sử dụng loại hồ sơ nào?\",[\"Giấy khám sức khỏe Mẫu 01\",\"Giấy khám sức khỏe Mẫu 02\",\"Sổ khám sức khỏe định kỳ Mẫu 03\",\"Bệnh án ngoại trú\"],2,\"Điều 34 khoản 4 điểm a.\"],\n[\"Trường hợp nào sau đây KHÔNG thuộc phạm vi áp dụng quy định về khám sức khỏe tại Chương VI?\",[\"Khám sức khỏe định kỳ\",\"Khám sức khỏe cho học sinh, sinh viên\",\"Khám sức khỏe cho người đi làm việc ở nước ngoài theo hợp đồng\",\"Khám giám định y khoa\"],3,\"Điều 30 khoản 2: loại trừ khám bệnh nội/ngoại trú, giám định y khoa, pháp y, giấy chứng thương, bệnh nghề nghiệp, đối tượng Bộ Quốc phòng, Bộ Công an, ngành nghề đặc thù.\"],\n[\"Lao động nữ khi khám sức khỏe định kỳ được khám thêm chuyên khoa nào theo Phụ lục XXV?\",[\"Phụ sản\",\"Tim mạch\",\"Nội tiết\",\"Ung bướu\"],0,\"Điều 36 khoản 4.\"],\n[\"Người nước ngoài, người Việt Nam định cư ở nước ngoài có giấy phép hành nghề do nước ngoài cấp, khi tham gia chống dịch nhóm A hoặc thiên tai, thảm họa:\",[\"Phải xin giấy phép hành nghề tại Việt Nam trước\",\"Không cần giấy phép hành nghề do Việt Nam cấp, nếu làm tại cơ sở y tế được thành lập hoặc giao nhiệm vụ\",\"Chỉ được phụ giúp, không được sơ cứu\",\"Chỉ được hành nghề tại bệnh viện tư\"],1,\"Điều 39 khoản 1 điểm b.\"],\n[\"Ai có thẩm quyền điều động, huy động lực lượng tham gia phòng, chống dịch nhóm A, thiên tai trong phạm vi toàn quốc (trừ lực lượng do Bộ Quốc phòng, Bộ Công an quản lý)?\",[\"Chủ tịch UBND tỉnh\",\"Giám đốc Sở Y tế\",\"Bộ trưởng Bộ Y tế\",\"Thủ trưởng cơ sở KBCB\"],2,\"Điều 40 khoản 2 điểm a.\"],\n[\"Trưởng phiên trực lâm sàng là:\",[\"Điều dưỡng trưởng\",\"Người hành nghề giữ vị trí trưởng khoa, phó khoa hoặc bác sĩ có trình độ sau đại học\",\"Bác sĩ mới nhận việc\",\"Giám đốc bệnh viện\"],1,\"Điều 44 khoản 2 điểm a.\"],\n[\"Cơ cấu hội đồng chuyên môn giải quyết tai biến y khoa gồm:\",[\"01 Chủ tịch, 01 Phó Chủ tịch, ít nhất 02 thành viên\",\"01 Chủ tịch, 01–02 Phó Chủ tịch, ít nhất 03 thành viên, ít nhất 01 thư ký\",\"02 Chủ tịch, 01 Phó Chủ tịch, ít nhất 05 thành viên\",\"01 Chủ tịch, ít nhất 05 thành viên, không cần thư ký\"],1,\"Điều 48 khoản 1; tổng số thành viên (kể cả Chủ tịch) phải là số lẻ.\"],\n[\"Tài liệu nào sau đây KHÔNG được sử dụng chữ viết tắt?\",[\"Sổ trực của khoa\",\"Phiếu theo dõi nội bộ\",\"Giấy hẹn khám lại\",\"Bản nháp ghi chép cá nhân\"],2,\"Điều 52 khoản 2 điểm c: không dùng chữ viết tắt trong tóm tắt hồ sơ bệnh án, tài liệu bàn giao, giấy chuyển tuyến BHYT, giấy hẹn khám lại.\"],\n[\"Người hành nghề đã được cấp chứng chỉ hành nghề theo Luật KBCB 40/2009/QH12 thì phạm vi hành nghề được xác định:\",[\"Theo Thông tư 35/2019/TT-BYT\",\"Giữ nguyên theo chứng chỉ cũ vô thời hạn\",\"Phải thi lại để được cấp phạm vi mới\",\"Theo quy định tại Thông tư 32/2023/TT-BYT\"],3,\"Điều 55 khoản 1 (điều khoản chuyển tiếp).\"],\n[\"Tình huống: Bác sĩ B trong 5 năm liên tục có 70 giờ tín chỉ từ khóa ngắn hạn, 30 giờ từ hội thảo và 25 giờ từ nghiên cứu khoa học (đều có giấy chứng nhận). Bác sĩ B đã đủ nghĩa vụ cập nhật kiến thức chưa?\",[\"Chưa, vì chỉ được tính khóa ngắn hạn\",\"Chưa, vì mỗi hình thức phải đủ 120 giờ\",\"Đủ, vì các hình thức được quy đổi sang giờ tín chỉ và cộng dồn (tổng 125 giờ ≥ 120)\",\"Chưa, vì nghiên cứu khoa học không được tính\"],2,\"Điều 3 khoản 2: các hình thức tại Điều 4, 5, 6, 7 sau khi quy đổi được cộng lại; Điều 6 cho phép tính nghiên cứu khoa học.\"],\n[\"Tình huống: Anh C khám sức khỏe đơn lẻ, khám xong người khám yêu cầu làm thêm xét nghiệm bổ sung. Cơ sở có bắt buộc trả giấy khám sức khỏe trong 24 giờ không?\",[\"Có, không có ngoại lệ\",\"Không bắt buộc, vì quy định 24 giờ trừ trường hợp phải khám hoặc xét nghiệm bổ sung theo yêu cầu\",\"Không, cơ sở được trả sau 7 ngày\",\"Có, nhưng được thu thêm phí\"],1,\"Điều 38 khoản 3 điểm a.\"],\n[\"Tình huống: Giấy khám sức khỏe của chị D được người kết luận ký ngày 15/03/2026. Giấy này có giá trị đến hết ngày nào?\",[\"15/09/2026\",\"15/03/2028\",\"15/03/2027\",\"31/12/2026\"],2,\"Điều 38 khoản 4 điểm a: 12 tháng kể từ ngày ký kết luận sức khỏe.\"],\n[\"Tình huống: Xảy ra tai biến y khoa tại bệnh viện thuộc Sở Y tế quản lý. Người bệnh không đồng ý với kết luận của hội đồng chuyên môn cấp cơ sở. Bước tiếp theo là gì?\",[\"Khởi kiện ngay tại tòa án\",\"Gửi văn bản đề nghị Sở Y tế thành lập hội đồng chuyên môn\",\"Gửi văn bản đề nghị Bộ Y tế thành lập hội đồng ngay\",\"Bệnh viện tự thành lập hội đồng lần hai\"],1,\"Điều 50 khoản 1 điểm b. Nếu vẫn không đồng ý thì đề nghị Bộ Y tế (kết luận cuối cùng), sau đó mới khởi kiện tại tòa án.\"],\n[\"Tình huống: Có dịch bệnh truyền nhiễm nhóm A, một sinh viên năm cuối ngành y tình nguyện tham gia. Sinh viên này có được tham gia sơ cứu, cấp cứu, tiêm chủng và xét nghiệm không?\",[\"Không, bắt buộc phải có giấy phép hành nghề\",\"Chỉ được làm công việc hành chính\",\"Chỉ được tham gia khi có người nhà là bác sĩ\",\"Được, nếu được cơ quan, người có thẩm quyền huy động theo Điều 39\"],3,\"Điều 39 khoản 1 điểm c: sinh viên, học sinh, học viên khối ngành sức khỏe được tham gia.\"],\n[\"Tình huống: Ông E có bài thuốc gia truyền được cấp giấy chứng nhận, muốn kê thêm thuốc kháng sinh cho người bệnh. Quy định cho phép không?\",[\"Không được kê đơn thuốc hóa dược và dùng kỹ thuật y học hiện đại\",\"Được, nếu người bệnh đồng ý\",\"Được, nếu có bác sĩ xác nhận\",\"Được, nhưng chỉ với thuốc dược liệu\"],0,\"Điều 11 khoản 14 điểm đ.\"],\n[\"Tình huống: Một phiên trực tại trạm y tế cấp xã chỉ có 01 điều dưỡng có giấy phép hành nghề. Phiên trực có đáp ứng mức tối thiểu không?\",[\"Không, bắt buộc có bác sĩ\",\"Không, bắt buộc có bác sĩ hoặc y sỹ cùng 01 điều dưỡng\",\"Không, phải có tối thiểu 02 người\",\"Có, vì trạm y tế xã chỉ cần tối thiểu 01 người hành nghề thuộc nhóm chức danh được nêu\"],3,\"Điều 46 khoản 2.\"],\n[\"Tình huống: Phòng khám có giường lưu bố trí phiên trực gồm 01 điều dưỡng và 01 hộ sinh. Phiên trực này:\",[\"Đạt yêu cầu\",\"Không đạt, vì thiếu 01 bác sĩ hoặc y sỹ\",\"Đạt nếu có thêm 01 lái xe\",\"Không đạt, vì thiếu 01 kỹ thuật y\"],1,\"Điều 46 khoản 1: tối thiểu 01 bác sĩ hoặc y sỹ và 01 điều dưỡng, hộ sinh hoặc kỹ thuật y.\"],\n[\"Tình huống: Qua đánh giá định kỳ, Đoàn phát hiện cơ sở nhận thử có hành vi giả mạo dữ liệu nghiên cứu. Cục KHCN&ĐT có thể áp dụng biện pháp nào?\",[\"Chỉ nhắc nhở bằng miệng\",\"Cấp giấy chứng nhận mức độ 2\",\"Cho khắc phục 06 tháng rồi cấp lại\",\"Ban hành văn bản không đáp ứng GCP, kiến nghị xử phạt vi phạm hành chính và/hoặc thu hồi giấy chứng nhận\"],3,\"Điều 19 khoản 3 và Điều 25 khoản 3.\"],\n[\"Thông tư 32/2023/TT-BYT quy định chi tiết bao nhiêu nhóm nội dung của Luật Khám bệnh, chữa bệnh (theo Điều 1)?\",[\"07 nhóm\",\"08 nhóm\",\"12 nhóm\",\"10 nhóm\"],3,\"Điều 1: Thông tư quy định về 10 nội dung (khoản 1 đến khoản 10).\"],\n[\"Loại đơn vị nào sau đây KHÔNG phải là “cơ sở cập nhật kiến thức y khoa liên tục” theo Điều 2?\",[\"Cơ sở khám bệnh, chữa bệnh\",\"Cơ sở giáo dục tham gia đào tạo nhân lực y tế\",\"Tổ chức xã hội - nghề nghiệp về khám bệnh, chữa bệnh\",\"Doanh nghiệp kinh doanh dược phẩm\"],3,\"Điều 2 khoản 1: gồm cơ sở KBCB, cơ sở giáo dục tham gia đào tạo nhân lực y tế, tổ chức xã hội - nghề nghiệp về KBCB đáp ứng yêu cầu.\"],\n[\"“Hồ sơ sản phẩm dành cho nghiên cứu viên” (Investigator’s Brochure - IB) là:\",[\"Công cụ thu thập dữ liệu của người tham gia thử nghiệm\",\"Tài liệu có thông tin chung về kỹ thuật mới, phương pháp mới, thiết bị y tế nghiên cứu lâm sàng và các tài liệu nghiên cứu liên quan\",\"Phân loại quốc tế về bệnh tật\",\"Bộ nguyên tắc, tiêu chuẩn thử lâm sàng\"],1,\"Điều 2 khoản 5. (CRF là phiếu thu thập thông tin/bệnh án nghiên cứu; ICD là phân loại quốc tế về bệnh tật; GCP là bộ nguyên tắc, tiêu chuẩn.)\"],\n[\"Nội dung huy động, điều động đối tượng tham gia KBCB khi có thiên tai, dịch nhóm A, tình trạng khẩn cấp trong Thông tư hướng dẫn khoản 4 Điều nào của Luật KBCB?\",[\"Điều 70\",\"Điều 99\",\"Điều 101\",\"Điều 115\"],3,\"Điều 1 khoản 10: khoản 4 Điều 115 của Luật KBCB.\"],\n[\"Người hành nghề tham gia biên soạn giáo trình, tài liệu chuyên môn được ai tính giờ tín chỉ và cấp giấy chứng nhận?\",[\"Giám đốc Sở Y tế\",\"Thủ trưởng đơn vị chủ trì soạn thảo\",\"Cục trưởng Cục Quản lý KCB\",\"Hội đồng nghiệm thu cấp trường\"],1,\"Điều 5 khoản 3: Thủ trưởng đơn vị chủ trì soạn thảo tính giờ tín chỉ và cấp giấy chứng nhận theo Phụ lục II.\"],\n[\"Nghiên cứu khoa học được tính để cập nhật kiến thức y khoa liên tục phải đáp ứng điều kiện nào?\",[\"Chỉ cần đăng ký đề tài\",\"Chỉ tính đề tài cấp Nhà nước\",\"Đã có quyết định nghiệm thu (nhiệm vụ KH&CN), sáng kiến được công nhận, bài báo đã được công bố\",\"Chỉ tính bài báo đăng tạp chí nước ngoài\"],2,\"Điều 6 khoản 1 điểm a: nhiệm vụ KH&CN cấp cơ sở, bộ, tỉnh, Nhà nước, sáng kiến, bài báo trong và ngoài nước đều được tính khi đáp ứng điều kiện.\"],\n[\"Việc cập nhật kiến thức y khoa liên tục do cơ sở nước ngoài tổ chức được xác nhận như thế nào?\",[\"Do Thủ trưởng đơn vị quản lý trực tiếp người hành nghề tính giờ tín chỉ và cấp giấy chứng nhận\",\"Không được tính\",\"Do Bộ Y tế xác nhận từng trường hợp\",\"Do cơ sở nước ngoài tự cấp và công nhận mặc định\"],0,\"Điều 8 khoản 2.\"],\n[\"Theo Điều 11, lương y được khám bệnh, chữa bệnh bằng phương pháp, kỹ thuật nào?\",[\"Y học hiện đại theo Phụ lục V\",\"Y học cổ truyền theo danh mục kỹ thuật tại Phụ lục XVIII\",\"Y học dự phòng theo Phụ lục VII\",\"Chỉ bài thuốc gia truyền\"],1,\"Điều 11 khoản 13.\"],\n[\"Phạm vi hành nghề của người hành nghề có chức danh hộ sinh được quy định tại:\",[\"Phụ lục XII\",\"Phụ lục XIV\",\"Phụ lục XV\",\"Phụ lục XIII\"],3,\"Điều 11 khoản 8: hộ sinh - Phụ lục XIII (điều dưỡng - XII; kỹ thuật y - XIV; dinh dưỡng lâm sàng - XV).\"],\n[\"Người có phương pháp chữa bệnh gia truyền KHÔNG được:\",[\"Dùng nhiều phương pháp gia truyền đã được cấp giấy chứng nhận cho cùng một người bệnh\",\"Kết hợp phương pháp với bài thuốc gia truyền để chữa các bệnh, chứng khác nhau\",\"Sử dụng phương pháp, kỹ thuật chuyên môn của y học hiện đại ngoài phạm vi hành nghề gia truyền\",\"Khám bệnh, chữa bệnh theo đúng quy trình đã được phê duyệt\"],2,\"Điều 11 khoản 15 điểm d.\"],\n[\"Tiêu chuẩn quản lý chất lượng cơ sở KBCB đề nghị thừa nhận phải bao gồm đủ 3 thành tố chất lượng nào?\",[\"Đầu vào, quy trình và kết quả thực hiện\",\"Nhân lực, tài chính và cơ sở vật chất\",\"An toàn, hiệu quả và công bằng\",\"Pháp lý, chuyên môn và quản trị\"],0,\"Điều 14 khoản 1 điểm đ. (An toàn, hiệu quả, kịp thời, công bằng, hướng đến người bệnh và nhân viên y tế là các đặc tính chất lượng tại điểm d.)\"],\n[\"Giấy tờ nào sau đây KHÔNG nằm trong hồ sơ đề nghị thừa nhận tiêu chuẩn quản lý chất lượng cơ sở KBCB?\",[\"Đơn đề nghị thừa nhận\",\"Bản đầy đủ của tiêu chuẩn đề nghị thừa nhận\",\"Tài liệu chứng minh tiêu chuẩn đã được áp dụng thử nghiệm tại các cơ sở KBCB tại Việt Nam\",\"Báo cáo tài chính 03 năm gần nhất của tổ chức chứng nhận\"],3,\"Điều 15 liệt kê 6 thành phần hồ sơ; không có báo cáo tài chính.\"],\n[\"Quyết định thừa nhận tiêu chuẩn của tổ chức chứng nhận chất lượng được công bố trên Trang thông tin điện tử của Cục Quản lý KCB trong thời hạn:\",[\"03 ngày làm việc\",\"05 ngày làm việc kể từ ngày ban hành quyết định\",\"10 ngày làm việc\",\"15 ngày làm việc\"],1,\"Điều 16 khoản 3 điểm d.\"],\n[\"Cơ sở nhận thử không nộp hồ sơ đánh giá định kỳ GCP; sau khi Cục có văn bản yêu cầu, quá 45 ngày vẫn không nộp báo cáo thì Cục KHCN&ĐT:\",[\"Miễn đánh giá\",\"Tự động gia hạn giấy chứng nhận 03 năm\",\"Tiến hành đánh giá đột xuất, kiểm tra việc duy trì đáp ứng GCP\",\"Chỉ gửi văn bản nhắc nhở lần nữa\"],2,\"Điều 24 khoản 3, 4: sau khi có văn bản yêu cầu, 45 ngày phải nộp báo cáo kèm giải trình; quá hạn thì đánh giá đột xuất theo Điều 27.\"],\n[\"Trong quá trình đánh giá, Đoàn phát hiện vi phạm ảnh hưởng nghiêm trọng đến tính chính xác, trung thực của dữ liệu hoặc an toàn của người tham gia. Đoàn có quyền:\",[\"Thu hồi ngay giấy chứng nhận tại chỗ\",\"Lập biên bản và yêu cầu cơ sở tạm dừng hoạt động thử nghiệm, đồng thời báo cáo người có thẩm quyền\",\"Phạt tiền trực tiếp cơ sở\",\"Không có quyền yêu cầu tạm dừng\"],1,\"Điều 29 khoản 2 điểm d.\"],\n[\"Người khám sức khỏe yêu cầu cấp từ hai giấy khám sức khỏe trở lên thì:\",[\"Không được cấp thêm\",\"Phải khám lại từng lần\",\"Phải nộp thêm phí cấp giấy khám sức khỏe theo quy định của cơ sở\",\"Được cấp miễn phí\"],2,\"Điều 33 khoản 2. (Cơ sở thực hiện nhân bản giấy khám sức khỏe theo Điều 38 khoản 2.)\"],\n[\"Sau khi nhận hồ sơ khám sức khỏe và đối chiếu ảnh với người đến khám, cơ sở phải:\",[\"Đóng dấu giáp lai vào ảnh (với các trường hợp theo quy định)\",\"Chụp lại ảnh mới\",\"Thu giữ bản gốc CCCD\",\"Đóng dấu vào góc trái giấy khám\"],0,\"Điều 35 khoản 2 điểm a, b.\"],\n[\"Ai có thẩm quyền điều động, huy động lực lượng tham gia chống dịch nhóm A, cấp cứu trong thiên tai trên địa bàn tỉnh?\",[\"Giám đốc bệnh viện tư\",\"Cục trưởng Cục Quản lý KCB\",\"Thủ tướng Chính phủ\",\"Chủ tịch UBND tỉnh, thành phố trực thuộc trung ương hoặc đơn vị được ủy quyền\"],3,\"Điều 40 khoản 2 điểm b.\"],\n[\"Ai tiếp nhận và phân công lực lượng do cơ quan có thẩm quyền điều động, huy động đến từng cơ sở để thực hiện nhiệm vụ?\",[\"Giám đốc Sở Y tế\",\"Chủ tịch UBND xã\",\"Bộ trưởng Bộ Y tế\",\"Trưởng khoa tại nơi làm việc\"],0,\"Điều 41 khoản 1: Giám đốc Sở Y tế; sau đó Thủ trưởng cơ sở phân công chi tiết từng vị trí (khoản 2).\"],\n[\"Căn cứ nào sau đây để điều động, huy động người tham gia KBCB khi có dịch nhóm A, thiên tai, khẩn cấp?\",[\"Yêu cầu của người bệnh\",\"Thỏa thuận cá nhân của người hành nghề\",\"Đề nghị của hiệp hội nghề nghiệp\",\"Đề nghị của Thủ trưởng cơ sở KBCB, cơ sở thu dung điều trị, cơ sở y tế dự phòng có nhu cầu hỗ trợ nhân lực\"],3,\"Điều 40 khoản 1: theo đề nghị của Chủ tịch UBND, Giám đốc Sở Y tế; đề nghị của Thủ trưởng cơ sở; hoặc theo điều động của Bộ trưởng Bộ Y tế.\"],\n[\"Đối tượng trực lãnh đạo trong bệnh viện gồm:\",[\"Bác sĩ trực bất kỳ\",\"Giám đốc, phó giám đốc và trưởng khoa, trưởng phòng được giám đốc chỉ định, ủy quyền bằng văn bản\",\"Chỉ giám đốc bệnh viện\",\"Điều dưỡng trưởng các khoa\"],1,\"Điều 44 khoản 1 điểm a.\"],\n[\"Nội dung nào sau đây KHÔNG thuộc báo cáo trực lâm sàng sau phiên trực?\",[\"Tử vong\",\"Cấp cứu\",\"Thuốc đã sử dụng\",\"Doanh thu viện phí\"],3,\"Điều 45 khoản 2: báo cáo trực lâm sàng gồm tử vong, cấp cứu, diễn biến nặng của người bệnh nội trú và thuốc. Thu viện phí là nhiệm vụ trực tài chính - kế toán.\"],\n[\"Theo nguyên tắc trực KBCB, người trực phải:\",[\"Đến đúng giờ nhận trực là được\",\"Có mặt trước giờ nhận trực để nhận bàn giao, không được rời bỏ vị trí và bàn giao cho phiên sau khi hết giờ\",\"Tự đổi trực với người khác không cần phê duyệt\",\"Rời vị trí khi hết giờ dù chưa bàn giao\"],1,\"Điều 43 khoản 4. (Đổi trực ngang cấp phải được lãnh đạo phê duyệt - khoản 5.)\"],\n[\"Văn bản kết luận của hội đồng chuyên môn do Chủ tịch hội đồng ký được lập thành mấy bản?\",[\"01 bản\",\"03 bản\",\"04 bản\",\"02 bản\"],3,\"Điều 49 khoản 4: 02 bản; 01 bản lưu tại cơ quan thành lập hội đồng, 01 bản gửi cơ quan đề nghị (trừ khi cơ quan thành lập là cơ sở nơi xảy ra tai biến).\"],\n[\"Nếu tai biến y khoa xảy ra do các nguyên nhân quy định tại khoản 2 Điều 100 Luật KBCB thì hội đồng chuyên môn kết luận như thế nào?\",[\"Người hành nghề không có sai sót chuyên môn kỹ thuật\",\"Người hành nghề có sai sót nhẹ\",\"Cơ sở KBCB chịu toàn bộ trách nhiệm\",\"Chuyển hồ sơ cho cơ quan điều tra\"],0,\"Điều 49 khoản 3 điểm a.\"],\n[\"Bệnh viện thuộc Bộ Quốc phòng/Bộ Công an: nếu các bên không đồng ý với kết luận hội đồng chuyên môn cấp cơ sở thì gửi văn bản đề nghị đơn vị nào thành lập hội đồng tiếp theo?\",[\"Sở Y tế\",\"Cục Quân y - Bộ Quốc phòng, Cục Y tế - Bộ Công an\",\"Bộ Y tế luôn\",\"Tòa án nhân dân\"],1,\"Điều 50 khoản 3 điểm b; sau đó nếu vẫn không đồng ý thì đề nghị Bộ Y tế (kết luận cuối cùng).\"],\n[\"Thông tư ban hành kèm theo bao nhiêu mẫu bệnh án, mẫu giấy, phiếu y?\",[\"52 mẫu\",\"64 mẫu\",\"82 mẫu\",\"100 mẫu\"],2,\"Điều 51: 82 mẫu (mẫu bệnh án - Phụ lục XXVIII; mẫu giấy, phiếu y - Phụ lục XXIX).\"],\n[\"Về hình thức hồ sơ bệnh án, cơ sở KBCB được:\",[\"Chỉ được dùng bệnh án giấy\",\"Chỉ được dùng bệnh án điện tử\",\"Dùng bệnh án giấy hoặc bệnh án điện tử; bệnh án điện tử phải có đầy đủ các trường thông tin của hồ sơ bệnh án\",\"Tự do thiết kế mẫu, không cần đủ trường thông tin\"],2,\"Điều 52 khoản 1.\"],\n[\"Theo quy định ghi chép hồ sơ bệnh án, thông tin trong hồ sơ cần thể hiện rõ:\",[\"Thời gian và người ghi chép\",\"Chỉ tên khoa\",\"Chỉ ngày tháng\",\"Chỉ chữ ký giám đốc\"],0,\"Điều 52 khoản 2 điểm d. (Ghi chép chính xác, trung thực, đầy đủ - điểm a.)\"],\n[\"Văn bản nào sau đây hết hiệu lực kể từ ngày Thông tư 32/2023/TT-BYT có hiệu lực?\",[\"Nghị định 96/2023/NĐ-CP\",\"Luật KBCB số 15/2023/QH15\",\"Thông tư 35/2019/TT-BYT quy định phạm vi hoạt động chuyên môn đối với người hành nghề\",\"Thông tư 53/2017/TT-BYT về thời hạn bảo quản hồ sơ\"],2,\"Điều 53 khoản 2 điểm a. (Thông tư 53/2017/TT-BYT được viện dẫn tại Điều 38, không bị bãi bỏ.)\"],\n[\"Nếu văn bản được dẫn chiếu trong Thông tư được thay thế, sửa đổi, bổ sung thì:\",[\"Vẫn áp dụng văn bản gốc như ban đầu\",\"Phải chờ Bộ Y tế hướng dẫn riêng\",\"Không áp dụng nội dung dẫn chiếu đó\",\"Áp dụng theo văn bản đã được thay thế, sửa đổi, bổ sung\"],3,\"Điều 54 (điều khoản tham chiếu).\"],\n[\"Theo điều khoản chuyển tiếp, Cục KHCN&ĐT cấp giấy chứng nhận đáp ứng GCP (phạm vi thử kỹ thuật mới, phương pháp mới, thiết bị y tế) cho cơ sở đã có giấy chứng nhận GCP thử thuốc khi hồ sơ đầy đủ, đáp ứng điều kiện trong thời hạn:\",[\"10 ngày làm việc\",\"20 ngày làm việc
