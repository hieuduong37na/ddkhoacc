p:32px;align-content:start}\n main>h1,main>.sub,main>footer{grid-column:1/-1}\n .tabs{display:none}\n #sum,#sum.hide{display:grid!important;grid-column:1;grid-template-columns:1fr}\n #quiz,#quiz.hide{display:block!important;grid-column:2;position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;max-width:none;margin:0}\n #box{grid-template-columns:1fr}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003ch1>Thông tư 31/2021/TT-BYT\u003c/h1>\n\u003cp class=\"sub\">Quy định hoạt động điều dưỡng trong bệnh viện · Ban hành 28/12/2021 · Hiệu lực 27/02/2022 · 4 chương, 22 điều · Thay thế Thông tư 07/2011/TT-BYT\u003c/p>\n\u003cdiv class=\"tabs\">\u003cbutton id=\"t1\" class=\"on\">📘 Tóm tắt\u003c/button>\u003cbutton id=\"t2\">📝 Trắc nghiệm (124 câu · xáo trộn)\u003c/button>\u003c/div>\n\n\u003csection id=\"sum\">\n\u003cdiv class=\"note\">Phạm vi: bệnh viện, trung tâm y tế huyện, quận, thị xã, thành phố thuộc tỉnh… có giấy phép KBCB và đủ điều kiện cung cấp dịch vụ KBCB; cơ sở KBCB khác căn cứ Thông tư để triển khai phù hợp. Tôi chưa xác nhận được tình trạng hiệu lực hiện nay; một số văn bản được dẫn chiếu (như Thông tư liên tịch 26/2015/TTLT-BYT-BNV) có thể đã được thay thế, khi đó áp dụng theo Điều 21. Hãy đối chiếu bản mới nhất.\u003c/div>\n\n\u003ch2>Nhớ nhanh\u003c/h2>\n\u003cdiv class=\"card tw\">\u003ctable>\n\u003ctr>\u003cth>Nội dung\u003c/th>\u003cth>Quy định\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Nguyên tắc chăm sóc\u003c/td>\u003ctd>Đúng chuyên môn, toàn diện, liên tục, an toàn, chất lượng, công bằng, phù hợp nhu cầu mỗi người bệnh; có phối hợp các đơn vị, chức danh khác\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Chăm sóc cấp I\u003c/td>\u003ctd>Nặng, nguy kịch, không tự thực hiện hoạt động cá nhân hoặc không được vận động; phụ thuộc hoàn toàn vào điều dưỡng\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Chăm sóc cấp II\u003c/td>\u003ctd>Nặng, hạn chế vận động một phần; phụ thuộc phần nhiều vào điều dưỡng\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Chăm sóc cấp III\u003c/td>\u003ctd>Đi lại không hạn chế, tự làm tất cả hoặc hầu hết hoạt động cá nhân dưới hướng dẫn của điều dưỡng\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Điều dưỡng, 3 bước\u003c/td>\u003ctd>Tiếp nhận và nhận định (Đ5) → xác định và thực hiện can thiệp (Đ6) → đánh giá kết quả (Đ7)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hệ thống điều dưỡng\u003c/td>\u003ctd>Hội đồng điều dưỡng; Phòng điều dưỡng; Điều dưỡng khoa\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hội đồng điều dưỡng\u003c/td>\u003ctd>Giám đốc ra quyết định thành lập; Chủ tịch là lãnh đạo bệnh viện; Phó chủ tịch thường trực là trưởng phòng điều dưỡng; trên 50% thành viên là điều dưỡng, hộ sinh\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Mô hình chăm sóc\u003c/td>\u003ctd>Điều dưỡng chăm sóc chính; theo đội; theo nhóm; theo công việc\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hiệu lực\u003c/td>\u003ctd>27/02/2022; thay Thông tư 07/2011/TT-BYT\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\n\u003ch2>Nội dung theo chương\u003c/h2>\n\u003cdetails class=\"card\" open>\u003csummary>Chương I – Quy định chung (Điều 1–4)\u003c/summary>\u003cul>\n\u003cli>\u003cb>Điều 1:\u003c/b> quy định nhiệm vụ chuyên môn chăm sóc điều dưỡng, tổ chức hoạt động điều dưỡng, nhiệm vụ các chức danh chuyên môn trong chăm sóc người bệnh.\u003c/li>\n\u003cli>\u003cb>Điều 2:\u003c/b> \u003ci>chăm sóc điều dưỡng\u003c/i> là nhận định, can thiệp chăm sóc, theo dõi để đáp ứng nhu cầu cơ bản (hô hấp, tuần hoàn, dinh dưỡng, bài tiết, vận động và tư thế, ngủ và nghỉ ngơi, mặc và thay đồ vải, thân nhiệt, vệ sinh cá nhân, môi trường an toàn, giao tiếp, tín ngưỡng, hoạt động giải trí, kiến thức bảo vệ sức khỏe). \u003ci>Chẩn đoán điều dưỡng\u003c/i> là nhận định về đáp ứng của cơ thể với tình trạng sức khỏe, làm cơ sở chọn can thiệp.\u003c/li>\n\u003cli>\u003cb>Điều 3:\u003c/b> nguyên tắc như bảng nhớ nhanh.\u003c/li>\n\u003cli>\u003cb>Điều 4:\u003c/b> phân 3 cấp chăm sóc (I, II, III).\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Điều 5 – Tiếp nhận và nhận định người bệnh\u003c/summary>\u003cul>\n\u003cli>\u003cb>Tiếp nhận:\u003c/b> phối hợp bác sĩ phân loại, sàng lọc, cấp cứu ban đầu; sắp xếp khám theo thứ tự ưu tiên bệnh lý, đối tượng (người cao tuổi, thương binh, phụ nữ có thai, trẻ em, đối tượng chính sách) và thứ tự đến; hướng dẫn, hỗ trợ khám và cận lâm sàng; hỗ trợ thủ tục, sắp xếp vào điều trị nội trú.\u003c/li>\n\u003cli>\u003cb>Nhận định lâm sàng:\u003c/b> khám, nhận định tình trạng và nhu cầu cơ bản; xác định nguy cơ; xác định chẩn đoán điều dưỡng (ưu tiên chẩn đoán tác động trực tiếp đến sức khỏe, tính mạng); phân cấp chăm sóc (dựa nhận định của điều dưỡng và đánh giá nguy kịch, tiên lượng của bác sĩ); dự báo yếu tố ảnh hưởng và sự cố y khoa.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Điều 6 – Xác định và thực hiện các can thiệp chăm sóc điều dưỡng\u003c/summary>\u003cul>\n\u003cli>\u003cb>9 nhóm can thiệp:\u003c/b> (a) hô hấp, tuần hoàn, thân nhiệt; (b) dinh dưỡng (theo TT 18/2020/TT-BYT); (c) giấc ngủ và nghỉ ngơi; (d) vệ sinh cá nhân theo phân cấp; (đ) tinh thần, tôn trọng tín ngưỡng; (e) thực hiện quy trình chuyên môn kỹ thuật, thuốc theo chỉ định; (g) phục hồi chức năng; (h) quản lý người bệnh (hồ sơ cập nhật hằng ngày, bàn giao giữa các ca trực); (i) truyền thông, giáo dục sức khỏe.\u003c/li>\n\u003cli>\u003cb>Xác định can thiệp:\u003c/b> dựa trên can thiệp quy định, chẩn đoán điều dưỡng, phân cấp, nguồn lực; xác định mục tiêu, kết quả mong muốn.\u003c/li>\n\u003cli>\u003cb>Thực hiện:\u003c/b> phù hợp từng người bệnh; phối hợp theo mô hình chăm sóc; đáp ứng kịp thời tình huống khẩn cấp, dự phòng và báo cáo sự cố; tư vấn thay đổi hành vi sức khỏe, tự chăm sóc.\u003c/li>\n\u003cli>\u003cb>Ghi chép:\u003c/b> ghi toàn bộ can thiệp vào phiếu chăm sóc (giấy hoặc điện tử) đầy đủ, chính xác, kịp thời, rõ ràng, dễ đọc; bảo quản, lưu trữ theo quy định.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Điều 7 – Đánh giá kết quả can thiệp\u003c/summary>\u003cul>\n\u003cli>Đánh giá đáp ứng và hiệu quả theo mục tiêu, liên tục, chính xác, toàn diện.\u003c/li>\n\u003cli>Điều chỉnh kịp thời can thiệp theo kết quả đánh giá, trong phạm vi chuyên môn điều dưỡng.\u003c/li>\n\u003cli>Trao đổi với thành viên liên quan về ưu tiên, mục tiêu chăm sóc; tham gia cải thiện chất lượng.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Điều 8–9 – Hệ thống điều dưỡng và Hội đồng điều dưỡng\u003c/summary>\u003cul>\n\u003cli>Hệ thống: Hội đồng điều dưỡng; Phòng điều dưỡng; Điều dưỡng khoa.\u003c/li>\n\u003cli>Hội đồng do giám đốc quyết định thành lập, quy định nhiệm vụ và quy chế. Cơ cấu: Chủ tịch là lãnh đạo bệnh viện; Phó chủ tịch là phó trưởng phòng và điều dưỡng trong phòng điều dưỡng; Phó chủ tịch thường trực là trưởng phòng điều dưỡng; thành viên gồm điều dưỡng trưởng, hộ sinh trưởng, kỹ thuật y trưởng khoa và đại diện lãnh đạo một số khoa, phòng, bảo đảm trên 50% là điều dưỡng, hộ sinh.\u003c/li>\n\u003cli>Nhiệm vụ: tham mưu giám đốc về chiến lược, định hướng, kế hoạch hằng năm và định kỳ; cập nhật quy định, hướng dẫn, quy trình, tài liệu chuyên môn.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Điều 10–12 – Phòng điều dưỡng, trưởng phòng, điều dưỡng trong phòng\u003c/summary>\u003cul>\n\u003cli>\u003cb>Phòng điều dưỡng (Đ10):\u003c/b> chủ trì kế hoạch, quy định, quy trình; xây dựng mô hình chăm sóc; tổ chức, kiểm tra, giám sát, sơ kết tổng kết; nhân sự (phối hợp tuyển dụng, bố trí, điều động; mô tả công việc; đánh giá năng lực hằng năm và trước tuyển dụng; tham gia đề xuất bổ nhiệm, miễn nhiệm điều dưỡng, hộ sinh, kỹ thuật y trưởng khoa; đề xuất khen thưởng, kỷ luật); đào tạo, nghiên cứu khoa học (đào tạo tuyến dưới, đề xuất học tập, thi nâng hạng, đào tạo liên tục, thực hành dựa vào bằng chứng); tham gia đề xuất mua sắm, giám sát sử dụng, bảo quản.\u003c/li>\n\u003cli>\u003cb>Trưởng phòng (Đ11):\u003c/b> tham mưu giám đốc; kế hoạch, báo cáo; kiểm tra, yêu cầu khoa, phòng, nhân viên, học viên, người bệnh, người nhà, khách thăm; chủ trì họp điều dưỡng trưởng; phối hợp trình giám đốc điều động tạm thời; tham gia hội đồng KSNK và hội đồng khác.\u003c/li>\n\u003cli>\u003cb>Điều dưỡng trong phòng (Đ12):\u003c/b> làm theo phân công; kiểm tra, giám sát chăm sóc tại đơn vị được giao; tham gia quản lý nhân sự, đào tạo, nghiên cứu, cải tiến chất lượng, xây dựng quy trình, hội đồng, mạng lưới.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Điều 13–14 – Điều dưỡng trưởng khoa, điều dưỡng khoa lâm sàng\u003c/summary>\u003cul>\n\u003cli>\u003cb>Điều dưỡng trưởng khoa:\u003c/b> chịu trách nhiệm trước trưởng khoa và trưởng phòng điều dưỡng; lập và thực hiện kế hoạch; mô tả vị trí việc làm, phân công theo chỉ đạo trưởng khoa; quản lý người bệnh để điều phối nhân lực; đi buồng hằng ngày; chủ trì họp điều dưỡng và họp người bệnh, người nhà; quản lý, đào tạo nhân lực; đề xuất tuyển dụng, thuyên chuyển, đào tạo; tham gia nghiên cứu, chỉ đạo tuyến; trực và chăm sóc khi cần; đề xuất, giám sát cơ sở hạ tầng, thuốc, vật tư; nhận xét, đề xuất khen thưởng, kỷ luật, tăng lương, học tập.\u003c/li>\n\u003cli>\u003cb>Điều dưỡng khoa lâm sàng:\u003c/b> làm theo phân công của trưởng khoa và điều dưỡng trưởng khoa; tuân thủ quy định, quy trình, đạo đức nghề nghiệp, pháp luật; ứng dụng nghiên cứu và thực hành dựa vào bằng chứng; đào tạo, giám sát điều dưỡng mới, học viên, hộ lý; học tập liên tục; tham gia xây dựng kế hoạch, quy trình.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Điều 15–19 – Các chức danh phối hợp\u003c/summary>\u003cul>\n\u003cli>\u003cb>Trưởng khoa lâm sàng (Đ15):\u003c/b> chịu trách nhiệm trước giám đốc; phối hợp phòng điều dưỡng.\u003c/li>\n\u003cli>\u003cb>Khoa khác (Đ16):\u003c/b> khoa dược (cung ứng thuốc, giám sát điều dưỡng quản lý, sử dụng thuốc); khoa KSNK (giám sát KSNK, cung cấp, thu gom dụng cụ, đồ vải); khoa dinh dưỡng (chế độ dinh dưỡng phù hợp, giám sát, cải tiến).\u003c/li>\n\u003cli>\u003cb>Phòng chức năng (Đ17):\u003c/b> tổ chức cán bộ (tuyển dụng, điều động); quản lý chất lượng (tiêu chí, đánh giá, cải tiến); kế hoạch tổng hợp (quy trình, giám sát chất lượng); vật tư - thiết bị y tế (cung cấp, sửa chữa thiết bị, vật tư); hành chính - quản trị (sửa chữa hạ tầng, phương tiện); công tác xã hội (tiếp đón, hướng dẫn, hỗ trợ người bệnh khó khăn); tài chính kế toán (thanh quyết toán vào, ra viện); công nghệ thông tin (phần mềm, bệnh án điện tử).\u003c/li>\n\u003cli>\u003cb>Bác sĩ điều trị (Đ18):\u003c/b> phối hợp khám, nhận định, phân cấp chăm sóc; phối hợp thực hiện nhiệm vụ chăm sóc; kiểm tra, giám sát việc thực hiện chỉ định điều trị của điều dưỡng.\u003c/li>\n\u003cli>\u003cb>Giáo viên, học sinh, sinh viên thực tập (Đ19):\u003c/b> thực hiện nhiệm vụ theo Thông tư, nội quy; chỉ làm kỹ thuật trên người bệnh khi được cho phép, có giám sát và được người bệnh đồng ý.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Chương IV – Điều 20–22: hiệu lực, tham chiếu, trách nhiệm\u003c/summary>\u003cul>\n\u003cli>\u003cb>Điều 20:\u003c/b> hiệu lực 27/02/2022; Thông tư 07/2011/TT-BYT hết hiệu lực.\u003c/li>\n\u003cli>\u003cb>Điều 21:\u003c/b> văn bản dẫn chiếu được thay thế, sửa đổi thì áp dụng văn bản mới.\u003c/li>\n\u003cli>\u003cb>Điều 22:\u003c/b> Cục QLKCB tổ chức triển khai, kiểm tra toàn quốc; Cục Khoa học công nghệ và đào tạo chỉ đạo đổi mới chương trình đào tạo điều dưỡng; Sở Y tế triển khai, kiểm tra, báo cáo; Y tế bộ, ngành triển khai tại bệnh viện trực thuộc; người đứng đầu bệnh viện chịu trách nhiệm toàn diện (ban hành văn bản, quy trình; tổ chức triển khai, giám sát; bố trí nhân lực; đầu tư hạ tầng, trang thiết bị; phân bổ kinh phí; đào tạo; khen thưởng).\u003c/li>\u003c/ul>\u003c/details>\n\u003cdetails class=\"card\">\u003csummary>Chi tiết bổ sung (các khoản trước đây chưa nêu)\u003c/summary>\u003cul>\n\u003cli>\u003cb>Điều 4:\u003c/b> cấp II gồm cả trường hợp do yêu cầu chuyên môn phải hạn chế vận động.\u003c/li>\n\u003cli>\u003cb>Điều 5:\u003c/b> nhận định lâm sàng gồm khám, nhận định tình trạng hiện tại và nhu cầu cơ bản; tiếp nhận gồm hỗ trợ thủ tục, sắp xếp vào nội trú.\u003c/li>\n\u003cli>\u003cb>Điều 6 khoản 1:\u003c/b> (a) báo bác sĩ khi hô hấp, tuần hoàn, thân nhiệt bất thường; (c) giấc ngủ: môi trường yên tĩnh, ánh sáng phù hợp, hướng dẫn thư giãn, tránh kích thích, báo bác sĩ khi rối loạn; (d) vệ sinh răng miệng, thân thể, kiểm soát chất tiết, thay đồ vải theo phân cấp; (đ) môi trường an toàn, thân thiện, phát hiện nguy cơ, tâm lý tiêu cực; (g) phối hợp lượng giá, chỉ định, hướng dẫn, thực hiện một số kỹ thuật PHCN. \u003cb>Khoản 2 b:\u003c/b> xác định mục tiêu, kết quả mong muốn. \u003cb>Khoản 3 d:\u003c/b> tư vấn thay đổi hành vi sức khỏe, tự chăm sóc.\u003c/li>\n\u003cli>\u003cb>Điều 7:\u003c/b> khoản 3 trao đổi, điều chỉnh can thiệp theo khả năng đáp ứng của người bệnh; khoản 4 tham gia cải thiện chất lượng.\u003c/li>\n\u003cli>\u003cb>Điều 9:\u003c/b> Phó chủ tịch gồm phó trưởng phòng và điều dưỡng trong phòng điều dưỡng.\u003c/li>\n\u003cli>\u003cb>Điều 10:\u003c/b> mô tả công việc theo Thông tư này và TTLT 26/2015/TTLT-BYT-BNV; khoản 4: khảo sát, phát hiện nội dung cần cải thiện, đề xuất và thử nghiệm giải pháp, xây dựng chương trình đào tạo mới và liên tục, nghiên cứu khoa học, thực hành dựa vào bằng chứng; khoản 6: nhiệm vụ khác do giám đốc phân công.\u003c/li>\n\u003cli>\u003cb>Điều 11:\u003c/b> thực hiện nhiệm vụ chung của trưởng phòng; tham mưu giám đốc; xây dựng kế hoạch của phòng, sơ kết, tổng kết, báo cáo; nhiệm vụ khác do giám đốc phân công.\u003c/li>\n\u003cli>\u003cb>Điều 13:\u003c/b> thêm: lập kế hoạch khoa; giám sát, kiểm tra, đánh giá kế hoạch; sơ kết, tổng kết, báo cáo; nhiệm vụ khác do trưởng khoa và trưởng phòng điều dưỡng phân công.\u003c/li>\n\u003cli>\u003cb>Điều 14:\u003c/b> làm theo phân công của trưởng khoa, điều dưỡng trưởng khoa theo Thông tư này và TTLT 26/2015; học tập liên tục.\u003c/li>\n\u003cli>\u003cb>Điều 22:\u003c/b> khi có vướng mắc, các cơ quan, tổ chức, cá nhân phản ánh về Bộ Y tế (Cục Quản lý Khám, chữa bệnh).\u003c/li>\n\u003c/ul>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"quiz\" class=\"hide\">\n\u003cdiv class=\"bar\">\u003ci id=\"pb\">\u003c/i>\u003c/div>\n\u003cdiv class=\"sub\" id=\"pg\">\u003c/div>\n\u003cdiv class=\"card\" id=\"box\">\u003c/div>\n\u003cdiv id=\"res\" class=\"card hide\">\u003c/div>\n\u003c/section>\n\n\u003cfooter>Nguồn: toàn văn Thông tư 31/2021/TT-BYT (Bộ Y tế). Nội dung tóm tắt chỉ phục vụ ôn tập, không thay thế văn bản gốc.\u003c/footer>\n\u003c/main>\n\u003cscript>\nvar Q=[\n[\"Thông tư 31/2021/TT-BYT quy định nội dung nào?\", [\"Nhiệm vụ chuyên môn chăm sóc điều dưỡng, tổ chức hoạt động điều dưỡng và nhiệm vụ của các chức danh chuyên môn trong chăm sóc người bệnh\", \"Tiêu chuẩn chức danh nghề nghiệp, mã số và bảng lương của điều dưỡng, hộ sinh\", \"Điều kiện cấp, gia hạn chứng chỉ hành nghề và phạm vi hành nghề của điều dưỡng\", \"Danh mục kỹ thuật chuyên môn và quy trình thực hiện từng thủ thuật điều dưỡng\"], 0, \"Điều 1.\"],\n[\"“Bệnh viện” theo phạm vi của Thông tư này bao gồm:\", [\"Chỉ bệnh viện công lập tuyến tỉnh trở lên có giường bệnh nội trú\", \"Bệnh viện, phòng khám đa khoa và các trạm y tế xã, phường\", \"Chỉ bệnh viện hạng đặc biệt và hạng I trực thuộc Bộ Y tế\", \"Bệnh viện và trung tâm y tế huyện, quận, thị xã, thành phố thuộc tỉnh có giấy phép hoạt động KBCB và đủ điều kiện cung cấp dịch vụ KBCB\"], 3, \"Điều 1.\"],\n[\"Các cơ sở khám bệnh, chữa bệnh khác (ngoài bệnh viện) áp dụng Thông tư như thế nào?\", [\"Căn cứ quy định của Thông tư để triển khai hoạt động điều dưỡng phù hợp với thực tế của cơ sở\", \"Bắt buộc áp dụng nguyên văn như bệnh viện\", \"Không áp dụng vì ngoài phạm vi điều chỉnh\", \"Chỉ áp dụng khi có quyết định của Sở Y tế\"], 0, \"Điều 1.\"],\n[\"Theo Điều 2, chăm sóc điều dưỡng là việc:\", [\"Chỉ thực hiện thuốc và thủ thuật theo y lệnh của bác sĩ\", \"Chẩn đoán bệnh và đề xuất phác đồ điều trị cho người bệnh\", \"Chỉ theo dõi dấu hiệu sinh tồn và ghi chép hồ sơ\", \"Nhận định, can thiệp chăm sóc, theo dõi nhằm đáp ứng các nhu cầu cơ bản của mỗi người bệnh\"], 3, \"Điều 2.\"],\n[\"Nhóm nhu cầu nào được nêu trong khái niệm chăm sóc điều dưỡng (Điều 2)?\", [\"Chỉ định xét nghiệm, chẩn đoán hình ảnh và kê đơn thuốc\", \"Giao tiếp, tín ngưỡng, hoạt động giải trí và kiến thức bảo vệ sức khỏe\", \"Thanh toán viện phí, bảo hiểm y tế và thủ tục ra viện\", \"Phẫu thuật, gây mê hồi sức và truyền máu\"], 1, \"Điều 2.\"],\n[\"Chẩn đoán điều dưỡng là:\", [\"Nhận định về đáp ứng của cơ thể người bệnh với tình trạng sức khỏe, làm cơ sở lựa chọn can thiệp chăm sóc\", \"Kết luận về bệnh do bác sĩ đưa ra sau khi khám\", \"Danh sách các thuốc điều dưỡng được phép sử dụng\", \"Bản ghi kết quả xét nghiệm của người bệnh\"], 0, \"Điều 2.\"],\n[\"Nguyên tắc thực hiện chăm sóc điều dưỡng theo Điều 3 là:\", [\"Đúng chuyên môn, nhanh chóng, tiết kiệm và ưu tiên người bệnh có bảo hiểm y tế\", \"Đúng chuyên môn, toàn diện, liên tục, an toàn, chất lượng, công bằng giữa các người bệnh và phù hợp nhu cầu mỗi người bệnh\", \"Toàn diện, theo ca trực, ưu tiên người bệnh nội trú hơn ngoại trú\", \"Liên tục, theo chỉ định bác sĩ và không cần phối hợp với đơn vị khác\"], 1, \"Điều 3.\"],\n[\"Theo Điều 3, hoạt động điều dưỡng trong bệnh viện phải bảo đảm:\", [\"Có sự tham gia, phối hợp của các đơn vị và chức danh chuyên môn khác trong bệnh viện\", \"Do phòng điều dưỡng thực hiện độc lập\", \"Chỉ phối hợp với bác sĩ điều trị\", \"Chỉ phối hợp khi có sự cố y khoa\"], 0, \"Điều 3.\"],\n[\"Thông tư phân cấp chăm sóc người bệnh thành mấy cấp?\", [\"2 cấp\", \"3 cấp (I, II, III)\", \"4 cấp\", \"5 cấp\"], 1, \"Điều 4.\"],\n[\"Người bệnh nặng, nguy kịch, không tự thực hiện hoạt động cá nhân hằng ngày, phụ thuộc hoàn toàn vào theo dõi, chăm sóc toàn diện và liên tục của điều dưỡng thuộc:\", [\"Chăm sóc cấp II\", \"Chăm sóc cấp I\", \"Chăm sóc cấp III\", \"Chăm sóc cấp đặc biệt\"], 1, \"Điều 4.\"],\n[\"Người bệnh nặng, hạn chế vận động một phần, phụ thuộc phần nhiều vào theo dõi, chăm sóc của điều dưỡng thuộc:\", [\"Chăm sóc cấp I\", \"Chăm sóc cấp II\", \"Chăm sóc cấp III\", \"Không thuộc cấp nào\"], 1, \"Điều 4.\"],\n[\"Người bệnh vận động, đi lại không hạn chế, tự thực hiện được tất cả hoặc hầu hết hoạt động cá nhân dưới sự hướng dẫn của điều dưỡng thuộc:\", [\"Chăm sóc cấp III\", \"Chăm sóc cấp II\", \"Chăm sóc cấp I\", \"Chăm sóc ngoại trú\"], 0, \"Điều 4.\"],\n[\"Tình huống: Người bệnh suy hô hấp nặng đang thở máy, an thần, không thể vận động. Phân cấp chăm sóc phù hợp là:\", [\"Chăm sóc cấp I\", \"Chăm sóc cấp II\", \"Chăm sóc cấp III\", \"Chăm sóc cấp II nếu tỉnh táo\"], 0, \"Điều 4: người bệnh nặng, nguy kịch hoặc do yêu cầu chuyên môn không được vận động, phụ thuộc hoàn toàn vào điều dưỡng.\"],\n[\"Tình huống: Người bệnh sau mổ ổn định, tự đi lại được, tự thực hiện hầu hết sinh hoạt cá nhân, điều dưỡng chỉ hướng dẫn. Phân cấp chăm sóc phù hợp là:\", [\"Chăm sóc cấp I\", \"Chăm sóc cấp III\", \"Chăm sóc cấp II\", \"Chưa cần phân cấp chăm sóc\"], 1, \"Điều 4.\"],\n[\"Ở bước tiếp nhận, phân loại, sàng lọc, điều dưỡng làm gì?\", [\"Tự quyết định chẩn đoán và hướng điều trị ban đầu\", \"Phối hợp với bác sĩ phân loại, sàng lọc và cấp cứu người bệnh ban đầu\", \"Chỉ ghi tên người bệnh vào sổ đăng ký khám\", \"Chỉ chuyển người bệnh đến khoa lâm sàng\"], 1, \"Điều 5 khoản 1.\"],\n[\"Việc sắp xếp người bệnh khám bệnh theo Điều 5 căn cứ vào:\", [\"Chỉ thứ tự đến khám\", \"Chỉ khả năng chi trả và loại hình bảo hiểm\", \"Quyết định của người nhà người bệnh\", \"Thứ tự ưu tiên của tình trạng bệnh lý, của đối tượng (người cao tuổi, thương binh, phụ nữ có thai, trẻ em, đối tượng chính sách) và thứ tự đến khám\"], 3, \"Điều 5 khoản 1.\"],\n[\"Tình huống: Phòng khám đông, có phụ nữ có thai, trẻ em, người cao tuổi và người bệnh đến khám bình thường. Điều dưỡng sắp xếp thế nào?\", [\"Chỉ theo thứ tự đến khám, không ưu tiên ai\", \"Ưu tiên người có bảo hiểm y tế\", \"Ưu tiên người nhà quen biết nhân viên\", \"Theo thứ tự ưu tiên của tình trạng bệnh lý và đối tượng, kết hợp thứ tự đến khám\"], 3, \"Điều 5 khoản 1.\"],\n[\"Nhiệm vụ nào thuộc “nhận định lâm sàng” (Điều 5 khoản 2)?\", [\"Chỉ định xét nghiệm cận lâm sàng\", \"Xác định các nguy cơ ảnh hưởng đến sức khỏe của người bệnh\", \"Kê đơn thuốc điều trị ban đầu\", \"Xác định chẩn đoán bệnh theo ICD\"], 1, \"Điều 5 khoản 2.\"],\n[\"Khi xác định chẩn đoán điều dưỡng, điều dưỡng ưu tiên:\", [\"Các chẩn đoán điều dưỡng tác động trực tiếp đến sức khỏe và tính mạng người bệnh\", \"Các chẩn đoán dễ thực hiện nhất\", \"Các chẩn đoán theo thứ tự đã ghi trong bệnh án\", \"Các chẩn đoán do người nhà đề nghị\"], 0, \"Điều 5 khoản 2.\"],\n[\"Phân cấp chăm sóc người bệnh được thực hiện trên cơ sở:\", [\"Nhận định của điều dưỡng và đánh giá mức độ nguy kịch, tiên lượng của bác sĩ, để điều dưỡng phối hợp với bác sĩ phân cấp\", \"Chỉ nhận định của điều dưỡng trưởng khoa\", \"Chỉ quyết định của trưởng khoa lâm sàng\", \"Yêu cầu của người bệnh hoặc người nhà\"], 0, \"Điều 5 khoản 2.\"],\n[\"Điều dưỡng cần dự báo điều gì trong quá trình chăm sóc?\", [\"Các yếu tố ảnh hưởng và sự cố y khoa có thể xảy ra\", \"Doanh thu và chi phí điều trị của người bệnh\", \"Số ngày nằm viện của toàn khoa\", \"Kết quả xét nghiệm trong 24 giờ tới\"], 0, \"Điều 5 khoản 2.\"],\n[\"Điều 6 khoản 1 quy định bao nhiêu nhóm can thiệp chăm sóc điều dưỡng (từ a đến i)?\", [\"7 nhóm\", \"8 nhóm\", \"10 nhóm\", \"9 nhóm\"], 3, \"Điều 6 khoản 1.\"],\n[\"Chăm sóc hô hấp, tuần hoàn, thân nhiệt: khi phát hiện bất thường, điều dưỡng phải:\", [\"Tự quyết định phác đồ điều trị\", \"Chỉ ghi vào phiếu chăm sóc\", \"Kịp thời báo bác sĩ và phối hợp xử trí\", \"Chờ đến giờ đi buồng sáng hôm sau\"], 2, \"Điều 6 khoản 1 điểm a.\"],\n[\"Trong chăm sóc dinh dưỡng, điều dưỡng theo dõi dung nạp, hài lòng của người bệnh để:\", [\"Tự thay đổi chế độ ăn của người bệnh\", \"Báo cáo bác sĩ và người làm dinh dưỡng kịp thời điều chỉnh chế độ dinh dưỡng\", \"Chỉ thông báo cho người nhà\", \"Chuyển người bệnh sang khoa dinh dưỡng\"], 1, \"Điều 6 khoản 1 điểm b.\"],\n[\"Thông tư nào được dẫn chiếu về trách nhiệm của điều dưỡng trong hoạt động dinh dưỡng bệnh viện?\", [\"Thông tư 07/2011/TT-BYT\", \"Thông tư 18/2020/TT-BYT ngày 12/11/2020\", \"Thông tư 51/2017/TT-BYT\", \"Thông tư 07/2014/TT-BYT\"], 1, \"Điều 6 khoản 1 điểm b (khoản 2 và 3 Điều 13).\"],\n[\"Chăm sóc giấc ngủ và nghỉ ngơi gồm:\", [\"Cho người bệnh dùng thuốc ngủ theo nhu cầu\", \"Cho phép người nhà ở lại buồng bệnh suốt đêm\", \"Thiết lập môi trường bệnh phòng yên tĩnh, ánh sáng phù hợp vào khung giờ ngủ; hướng dẫn thư giãn, tránh chất kích thích; báo bác sĩ khi có rối loạn giấc ngủ\", \"Chỉ tắt đèn hành lang vào ban đêm\"], 2, \"Điều 6 khoản 1 điểm c.\"],\n[\"Chăm sóc vệ sinh cá nhân do điều dưỡng thực hiện hoặc hỗ trợ theo:\", [\"Yêu cầu của người nhà\", \"Quyết định của hộ lý\", \"Giờ hành chính của khoa\", \"Phân cấp chăm sóc\"], 3, \"Điều 6 khoản 1 điểm d.\"],\n[\"Nội dung nào thuộc chăm sóc tinh thần?\", [\"Chỉ trả lời các câu hỏi của người nhà\", \"Quyết định phương pháp điều trị tâm lý\", \"Theo dõi, phát hiện nguy cơ không an toàn và biểu hiện tâm lý tiêu cực; tôn trọng niềm tin, tín ngưỡng của người bệnh\", \"Hạn chế người bệnh thực hiện tín ngưỡng trong bệnh viện\"], 2, \"Điều 6 khoản 1 điểm đ.\"],\n[\"Tình huống: Người bệnh xin được thực hiện nghi lễ tín ngưỡng nhẹ nhàng tại giường. Điều dưỡng nên:\", [\"Từ chối hoàn toàn vì ảnh hưởng điều trị\", \"Tôn trọng và tạo điều kiện trong điều kiện cho phép, phù hợp với quy định\", \"Chỉ cho phép khi có giấy của giám đốc\", \"Cho phép bất kể quy định của bệnh viện\"], 1, \"Điều 6 khoản 1 điểm đ.\"],\n[\"Thực hiện thuốc và các can thiệp chăm sóc điều dưỡng được tiến hành:\", [\"Theo đánh giá riêng của điều dưỡng, không cần chỉ định\", \"Theo chỉ định của bác sĩ, trong phạm vi chuyên môn điều dưỡng, tuân thủ quy trình chuyên môn kỹ thuật\", \"Theo yêu cầu của người bệnh\", \"Theo thói quen của khoa\"], 1, \"Điều 6 khoản 1 điểm e.\"],\n[\"Về phục hồi chức năng, điều dưỡng:\", [\"Độc lập chỉ định và thực hiện mọi kỹ thuật PHCN\", \"Phối hợp với bác sĩ, kỹ thuật viên PHCN để lượng giá, chỉ định, hướng dẫn, thực hiện kỹ thuật; thực hiện một số kỹ thuật PHCN theo quy định\", \"Chỉ hướng dẫn người nhà, không tham gia thực hiện\", \"Không có nhiệm vụ về PHCN\"], 1, \"Điều 6 khoản 1 điểm g.\"],\n[\"Quản lý người bệnh: điều dưỡng lập hồ sơ quản lý và cập nhật:\", [\"Hằng tuần, chỉ cho người bệnh nội trú\", \"Chỉ cho người bệnh nặng\", \"Khi có yêu cầu của thanh tra\", \"Hằng ngày, cho tất cả người bệnh nội trú và ngoại trú tại bệnh viện (bản giấy hoặc điện tử)\"], 3, \"Điều 6 khoản 1 điểm h.\"],\n[\"Khi giao ca trực, điều dưỡng phải bàn giao:\", [\"Đầy đủ số lượng và các vấn đề cần theo dõi, chăm sóc người bệnh\", \"Chỉ số lượng người bệnh\", \"Chỉ các vấn đề do bác sĩ yêu cầu\", \"Chỉ người bệnh cấp I\"], 0, \"Điều 6 khoản 1 điểm h.\"],\n[\"Nội dung truyền thông, giáo dục sức khỏe của điều dưỡng gồm:\", [\"Kiến thức về bệnh, tự chăm sóc, an toàn người bệnh, kiểm soát nhiễm khuẩn, dinh dưỡng, PHCN và nội quy nội trú, chuyển khoa, chuyển viện, ra viện\", \"Chỉ hướng dẫn thủ tục thanh toán viện phí\", \"Chỉ hướng dẫn cách dùng thuốc\", \"Chỉ phát tờ rơi cho người bệnh\"], 0, \"Điều 6 khoản 1 điểm i.\"],\n[\"Khi xác định can thiệp chăm sóc cho từng người bệnh, điều dưỡng căn cứ vào:\", [\"Chỉ chẩn đoán của bác sĩ\", \"Can thiệp chăm sóc quy định, chẩn đoán điều dưỡng, phân cấp chăm sóc và nguồn lực sẵn có\", \"Chỉ yêu cầu của người nhà\", \"Chỉ số giường bệnh còn trống\"], 1, \"Điều 6 khoản 2.\"],\n[\"Các mô hình chăm sóc nêu tại Điều 6 gồm:\", [\"Chăm sóc theo khoa, theo giường, theo ngày, theo bệnh án\", \"Chăm sóc theo chuyên khoa, theo tuyến, theo hạng bệnh viện\", \"Điều dưỡng chăm sóc chính; chăm sóc theo đội; chăm sóc theo nhóm; chăm sóc theo công việc\", \"Chỉ chăm sóc theo công việc\"], 2, \"Điều 6 khoản 3 điểm b.\"],\n[\"Về tình huống khẩn cấp hoặc thay đổi tình trạng người bệnh, điều dưỡng phải:\", [\"Chờ chỉ đạo của trưởng khoa rồi mới xử trí\", \"Đáp ứng kịp thời; dự phòng và báo cáo các sự cố ảnh hưởng đến chất lượng chăm sóc\", \"Chỉ ghi nhận vào cuối ca\", \"Chuyển người bệnh sang khoa khác\"], 1, \"Điều 6 khoản 3 điểm c.\"],\n[\"Việc ghi phiếu chăm sóc phải bảo đảm:\", [\"Ngắn gọn, chỉ ghi khi có biến cố\", \"Đầy đủ, chính xác, kịp thời, rõ ràng, dễ đọc; sử dụng, bảo quản, lưu trữ theo quy định\", \"Ghi tập trung một lần cuối tuần\", \"Chỉ ghi bằng bản giấy\"], 1, \"Điều 6 khoản 4.\"],\n[\"Đánh giá kết quả can thiệp chăm sóc điều dưỡng theo nguyên tắc:\", [\"Định kỳ hằng tháng, theo mẫu thống nhất\", \"Liên tục, chính xác và toàn diện về tình trạng đáp ứng của mỗi người bệnh\", \"Nhanh gọn, chỉ đánh giá người bệnh nặng\", \"Theo nhận xét của người nhà\"], 1, \"Điều 7.\"],\n[\"Sau khi đánh giá, điều dưỡng cần:\", [\"Giữ nguyên kế hoạch ban đầu cho đến khi ra viện\", \"Chờ bác sĩ điều chỉnh mọi can thiệp\", \"Chỉ điều chỉnh khi người bệnh phàn nàn\", \"Điều chỉnh kịp thời can thiệp chăm sóc dựa trên kết quả đánh giá và nhận định lại, trong phạm vi chuyên môn điều dưỡng\"], 3, \"Điều 7.\"],\n[\"Điều 7 còn yêu cầu điều dưỡng:\", [\"Trao đổi với các thành viên liên quan về vấn đề ưu tiên, mục tiêu chăm sóc mong đợi và tham gia cải thiện chất lượng chăm sóc\", \"Báo cáo cá nhân lên Bộ Y tế sau mỗi ca\", \"Chỉ trao đổi với điều dưỡng cùng ca\", \"Không cần trao đổi với bác sĩ\"], 0, \"Điều 7.\"],\n[\"Hệ thống điều dưỡng trong bệnh viện gồm:\", [\"Hội đồng điều dưỡng; Phòng điều dưỡng; Điều dưỡng khoa\", \"Hội đồng điều dưỡng; Phòng quản lý chất lượng; Điều dưỡng khoa\", \"Phòng điều dưỡng; Khoa điều dưỡng; Hội điều dưỡng\", \"Hội đồng khoa học; Phòng điều dưỡng; Điều dưỡng khoa\"], 0, \"Điều 8.\"],\n[\"Hội đồng điều dưỡng do ai quyết định thành lập?\", [\"Trưởng phòng điều dưỡng\", \"Sở Y tế\", \"Cục Quản lý Khám, chữa bệnh\", \"Giám đốc bệnh viện\"], 3, \"Điều 9 khoản 1.\"],\n[\"Chủ tịch Hội đồng điều dưỡng là:\", [\"Trưởng phòng điều dưỡng\", \"Lãnh đạo bệnh viện\", \"Điều dưỡng trưởng khoa\", \"Trưởng phòng tổ chức cán bộ\"], 1, \"Điều 9 khoản 2.\"],\n[\"Phó chủ tịch thường trực Hội đồng điều dưỡng là:\", [\"Phó trưởng phòng điều dưỡng\", \"Trưởng phòng điều dưỡng\", \"Điều dưỡng trưởng khoa lâm sàng\", \"Lãnh đạo bệnh viện\"], 1, \"Điều 9 khoản 2.\"],\n[\"Về thành viên Hội đồng điều dưỡng, Thông tư yêu cầu:\", [\"Ít nhất 30% là điều dưỡng, hộ sinh\", \"Toàn bộ là điều dưỡng\", \"Trên 70% là bác sĩ\", \"Trên 50% thành viên là điều dưỡng, hộ sinh\"], 3, \"Điều 9 khoản 2.\"],\n[\"Tình huống: Hội đồng điều dưỡng có 12 thành viên. Số điều dưỡng, hộ sinh tối thiểu là:\", [\"6 người\", \"8 người\", \"7 người\", \"5 người\"], 2, \"Điều 9 khoản 2: trên 50% của 12 thành viên, tức ít nhất 7 người.\"],\n[\"Nhiệm vụ của Hội đồng điều dưỡng là:\", [\"Quyết định bổ nhiệm điều dưỡng trưởng khoa\", \"Tham mưu cho giám đốc về chiến lược, kế hoạch phát triển hoạt động điều dưỡng, hộ sinh, hộ lý và việc cập nhật quy định, quy trình chuyên môn\", \"Trực tiếp chăm sóc người bệnh nặng\", \"Quản lý tài chính của bệnh viện\"], 1, \"Điều 9 khoản 3.\"],\n[\"Phòng điều dưỡng có nhiệm vụ nào về kế hoạch, quy trình?\", [\"Chỉ thực hiện kế hoạch do khoa lâm sàng xây dựng\", \"Ban hành quy chế bệnh viện thay giám đốc\", \"Chủ trì xây dựng, tổ chức thực hiện kế hoạch hoạt động điều dưỡng, quy định, quy trình chuyên môn kỹ thuật của bệnh viện\", \"Chỉ lưu trữ quy trình do Bộ Y tế ban hành\"], 2, \"Điều 10.\"],\n[\"Phòng điều dưỡng xây dựng các mô hình chăm sóc:\", [\"Giống nhau cho mọi bệnh viện\", \"Phù hợp với nguồn lực và cơ cấu tổ chức của bệnh viện\", \"Do các khoa tự quyết định, không cần phòng điều dưỡng\", \"Chỉ áp dụng cho khoa hồi sức\"], 1, \"Điều 10.\"],\n[\"Trong quản lý điều hành chuyên môn, phòng điều dưỡng:\", [\"Chỉ nhận báo cáo từ các khoa\", \"Chỉ giám sát khi có sự cố\", \"Không có nhiệm vụ kiểm tra\", \"Tổ chức thực hiện, kiểm tra, giám sát các hoạt động điều dưỡng; định kỳ sơ kết, tổng kết, báo cáo\"], 3, \"Điều 10.\"],\n[\"Về nhân sự điều dưỡng, phòng điều dưỡng:\", [\"Phối hợp xây dựng kế hoạch, đề xuất tuyển dụng, bố trí, điều động điều dưỡng, hộ sinh, kỹ thuật y, hộ lý trợ giúp chăm sóc\", \"Quyết định tuyển dụng và ký hợp đồng lao động\", \"Chỉ thực hiện việc điều động theo yêu cầu của khoa\", \"Không tham gia vào việc tuyển dụng\"], 0, \"Điều 10.\"],\n[\"Đối với đánh giá năng lực điều dưỡng, phòng điều dưỡng:\", [\"Chỉ đánh giá khi có khiếu nại\", \"Chỉ đánh giá trước khi nâng hạng\", \"Tham gia xây dựng tiêu chí và chịu trách nhiệm đánh giá năng lực điều dưỡng định kỳ hằng năm và trước khi tuyển dụng\", \"Giao toàn bộ việc đánh giá cho phòng tổ chức cán bộ\"], 2, \"Điều 10.\"],\n[\"Đối với bổ nhiệm, miễn nhiệm điều dưỡng trưởng khoa, hộ sinh trưởng khoa, kỹ thuật y trưởng khoa, phòng điều dưỡng:\", [\"Trực tiếp quyết định\", \"Chỉ được thông báo sau khi có quyết định\", \"Tham gia đề xuất\", \"Không có vai trò\"], 2, \"Điều 10.\"],\n[\"Phòng điều dưỡng tham gia đề xuất khen thưởng, kỷ luật đối với:\", [\"Chỉ điều dưỡng trưởng khoa\", \"Chỉ học viên thực tập\", \"Cá nhân, tập thể điều dưỡng, hộ sinh, kỹ thuật y, hộ lý trợ giúp chăm sóc có thành tích hoặc vi phạm\", \"Chỉ nhân viên hợp đồng\"], 2, \"Điều 10.\"],\n[\"Về đào tạo, phòng điều dưỡng tham gia xây dựng kế hoạch và thực hiện:\", [\"Đào tạo bác sĩ chuyên khoa\", \"Đào tạo kỹ thuật viên xét nghiệm\", \"Đào tạo nâng cao năng lực hoạt động điều dưỡng cho tuyến dưới\", \"Đào tạo nhân viên hành chính\"], 2, \"Điều 10.\"],\n[\"Về trang thiết bị, vật tư liên quan hoạt động điều dưỡng, phòng điều dưỡng:\", [\"Trực tiếp mua sắm và thanh toán\", \"Chỉ nhận bàn giao sau khi mua\", \"Không có vai trò\", \"Tham gia đề xuất mua sắm; giám sát chất lượng; kiểm tra việc sử dụng, bảo quản\"], 3, \"Điều 10.\"],\n[\"Trưởng phòng điều dưỡng kiểm tra và yêu cầu những đối tượng nào thực hiện đúng quy định về hoạt động điều dưỡng?\", [\"Chỉ điều dưỡng của bệnh viện\", \"Chỉ các khoa lâm sàng\", \"Chỉ học viên và sinh viên thực tập\", \"Các khoa, phòng, nhân viên y tế, học viên, người bệnh, người nhà người bệnh và khách thăm\"], 3, \"Điều 11.\"],\n[\"Trưởng phòng điều dưỡng tổ chức và chủ trì các cuộc họp nào?\", [\"Họp giao ban toàn bệnh viện\", \"Họp hội đồng khoa học\", \"Họp điều dưỡng trưởng định kỳ và đột xuất\", \"Họp người bệnh toàn viện\"], 2, \"Điều 11.\"],\n[\"Tình huống: Khoa A quá tải, cần điều tạm điều dưỡng từ khoa khác sang. Trưởng phòng điều dưỡng làm gì?\", [\"Tự điều động mà không cần báo giám đốc\", \"Phối hợp các khoa, phòng liên quan trình giám đốc điều động tạm thời theo quy định của bệnh viện\", \"Chờ Sở Y tế quyết định\", \"Giao điều dưỡng trưởng khoa A tự mượn người\"], 1, \"Điều 11.\"],\n[\"Trưởng phòng điều dưỡng tham gia các hội đồng nào?\", [\"Hội đồng kiểm soát nhiễm khuẩn và các hội đồng khác theo quy định, sự phân công của giám đốc\", \"Chỉ Hội đồng thi đua khen thưởng\", \"Chỉ Hội đồng thuốc và điều trị\", \"Không tham gia hội đồng nào\"], 0, \"Điều 11.\"],\n[\"Điều dưỡng trong phòng điều dưỡng có nhiệm vụ:\", [\"Chỉ trực tiếp chăm sóc người bệnh tại khoa\", \"Chỉ làm công việc hành chính văn phòng\", \"Thực hiện nhiệm vụ theo phân công của trưởng phòng; kiểm tra, giám sát chăm sóc điều dưỡng tại các đơn vị được phân công\", \"Quyết định điều động nhân lực giữa các khoa\"], 2, \"Điều 12.\"],\n[\"Điều dưỡng trưởng khoa chịu trách nhiệm trước ai về hoạt động điều dưỡng tại khoa?\", [\"Chỉ trưởng khoa\", \"Trưởng khoa và trưởng phòng điều dưỡng\", \"Chỉ giám đốc bệnh viện\", \"Chỉ Hội đồng điều dưỡng\"], 1, \"Điều 13.\"],\n[\"Điều dưỡng trưởng khoa xây dựng bản mô tả vị trí việc làm và phân công nhiệm vụ theo:\", [\"Quyết định của giám đốc\", \"Yêu cầu của điều dưỡng khoa\", \"Chỉ đạo của trưởng khoa\", \"Hướng dẫn của Sở Y tế\"], 2, \"Điều 13.\"],\n[\"Điều dưỡng trưởng khoa quản lý người bệnh để:\", [\"Kịp thời phân công và điều phối nhân lực thực hiện chăm sóc điều dưỡng\", \"Quyết định phác đồ điều trị\", \"Tính chi phí điều trị\", \"Thay bác sĩ kê đơn\"], 0, \"Điều 13.\"],\n[\"Điều dưỡng trưởng khoa tham gia đi buồng:\", [\"Hằng tuần với trưởng phòng điều dưỡng\", \"Hằng ngày với lãnh đạo khoa\", \"Khi có người bệnh nặng\", \"Không có nhiệm vụ đi buồng\"], 1, \"Điều 13.\"],\n[\"Điều dưỡng trưởng khoa tổ chức, chủ trì cuộc họp nào?\", [\"Chỉ họp giao ban khoa\", \"Họp điều dưỡng định kỳ, đột xuất và họp người bệnh, người nhà người bệnh khi cần thiết\", \"Chỉ họp hội đồng khoa học\", \"Chỉ họp người bệnh nội trú\"], 1, \"Điều 13.\"],\n[\"Điều dưỡng trưởng khoa có nhiệm vụ nào về nhân sự?\", [\"Nhận xét, đề xuất khen thưởng, kỷ luật, tăng lương và học tập đối với điều dưỡng, hộ lý trợ giúp chăm sóc trong khoa\", \"Quyết định tăng lương cho nhân viên\", \"Chỉ đề xuất tuyển dụng, không đề xuất khen thưởng\", \"Chỉ quản lý nhân viên điều dưỡng, không quản lý hộ lý\"], 0, \"Điều 13.\"],\n[\"Điều dưỡng trưởng khoa có tham gia trực và trực tiếp chăm sóc người bệnh không?\", [\"Không, chỉ làm công tác quản lý\", \"Chỉ khi được giám đốc cho phép\", \"Có, khi cần\", \"Chỉ trong ca đêm\"], 2, \"Điều 13.\"],\n[\"Điều dưỡng khoa lâm sàng phải tuân thủ:\", [\"Quy định, quy trình chuyên môn kỹ thuật, tiêu chuẩn đạo đức nghề nghiệp và pháp luật liên quan\", \"Chỉ chỉ định của bác sĩ điều trị\", \"Chỉ nội quy của khoa\", \"Chỉ quy định của Sở Y tế\"], 0, \"Điều 14.\"],\n[\"Điều dưỡng khoa lâm sàng thực hiện hoặc ứng dụng:\", [\"Chỉ kinh nghiệm cá nhân\", \"Chỉ hướng dẫn của hãng sản xuất\", \"Chỉ ý kiến của người bệnh\", \"Kết quả nghiên cứu khoa học và thực hành dựa vào bằng chứng để cải tiến chất lượng chăm sóc\"], 3, \"Điều 14.\"],\n[\"Điều dưỡng khoa lâm sàng đào tạo, kiểm tra, giám sát ai khi được phân công?\", [\"Chỉ bác sĩ nội trú\", \"Chỉ người bệnh và người nhà\", \"Điều dưỡng mới, học viên và hộ lý trợ giúp chăm sóc\", \"Chỉ kỹ thuật viên xét nghiệm\"], 2, \"Điều 14.\"],\n[\"Trưởng khoa lâm sàng chịu trách nhiệm trước ai về hoạt động điều dưỡng tại khoa?\", [\"Trưởng phòng điều dưỡng\", \"Hội đồng điều dưỡng\", \"Giám đốc bệnh viện\", \"Sở Y tế\"], 2, \"Điều 15.\"],\n[\"Trưởng khoa dược có nhiệm vụ gì liên quan đến chăm sóc điều dưỡng?\", [\"Trực tiếp cho người bệnh uống thuốc\", \"Cung ứng thuốc đầy đủ, kịp thời, chất lượng; tư vấn, hỗ trợ, kiểm tra, giám sát điều dưỡng quản lý và sử dụng thuốc\", \"Chỉ cấp thuốc theo yêu cầu của điều dưỡng\", \"Quyết định chỉ định thuốc cho người bệnh\"], 1, \"Điều 16.\"],\n[\"Trưởng khoa kiểm soát nhiễm khuẩn có nhiệm vụ:\", [\"Giám sát quy định KSNK trong chăm sóc; cung cấp dụng cụ, đồ vải, vật tư đúng quy định; thu gom dụng cụ, đồ vải đã qua sử dụng tại khoa lâm sàng\", \"Chỉ điều trị người bệnh nhiễm khuẩn\", \"Chỉ báo cáo ca nhiễm khuẩn lên Sở Y tế\", \"Chỉ kiểm tra vệ sinh nhà ăn bệnh viện\"], 0, \"Điều 16.\"],\n[\"Trưởng khoa dinh dưỡng có nhiệm vụ:\", [\"Chỉ nấu ăn cho người bệnh nội trú\", \"Quyết định thuốc điều trị bệnh lý dinh dưỡng\", \"Chỉ tư vấn cho người bệnh ngoại trú\", \"Tiếp nhận đề xuất, cung cấp chế độ dinh dưỡng phù hợp từng người bệnh; hỗ trợ, theo dõi, giám sát thực hiện tại khoa lâm sàng; cải tiến chất lượng\"], 3, \"Điều 16.\"],\n[\"Trưởng phòng tổ chức cán bộ có nhiệm vụ:\", [\"Chỉ quản lý hồ sơ nhân sự\", \"Xây dựng kế hoạch tuyển dụng điều dưỡng, hộ lý trên cơ sở tham khảo đề xuất của phòng điều dưỡng; phối hợp điều động giữa các khoa\", \"Quyết định tuyển dụng không cần ý kiến phòng điều dưỡng\", \"Chỉ tổ chức thi nâng hạng\"], 1, \"Điều 17.\"],\n[\"Trưởng phòng quản lý chất lượng phối hợp với phòng điều dưỡng:\", [\"Quản lý ngân sách của phòng điều dưỡng\", \"Điều động nhân lực giữa các khoa\", \"Xây dựng tiêu chí, đánh giá và cải tiến chất lượng chăm sóc điều dưỡng\", \"Mua sắm vật tư điều dưỡng\"], 2, \"Điều 17.\"],\n[\"Phòng nào có nhiệm vụ sửa chữa kịp thời cơ sở hạ tầng, phương tiện phục vụ chăm sóc điều dưỡng?\", [\"Phòng vật tư - thiết bị y tế\", \"Phòng kế hoạch tổng hợp\", \"Phòng công nghệ thông tin\", \"Phòng hành chính - quản trị\"], 3, \"Điều 17.\"],\n[\"Phòng vật tư - thiết bị y tế có nhiệm vụ:\", [\"Quản lý kinh phí hoạt động điều dưỡng\", \"Xây dựng quy trình chuyên môn điều dưỡng\", \"Phân công nhiệm vụ cho điều dưỡng\", \"Bảo đảm cung cấp, sửa chữa kịp thời phương tiện, thiết bị, vật tư tiêu hao phục vụ chăm sóc, trên cơ sở tham khảo đề xuất của phòng điều dưỡng\"], 3, \"Điều 17.\"],\n[\"Phòng công tác xã hội có nhiệm vụ:\", [\"Hỗ trợ tiếp đón; hướng dẫn, hỗ trợ người bệnh khám, xét nghiệm, vào viện, chuyển khoa, chuyển viện, ra viện; phát hiện sớm và hỗ trợ người bệnh khó khăn\", \"Quản lý bệnh án và hồ sơ lưu trữ\", \"Thanh quyết toán chi phí khám chữa bệnh\", \"Thiết kế phần mềm quản lý bệnh viện\"], 0, \"Điều 17.\"],\n[\"Phòng tài chính kế toán hỗ trợ điều dưỡng việc gì?\", [\"Thủ tục thanh quyết toán vào viện, ra viện cho người bệnh\", \"Thủ tục tuyển dụng điều dưỡng\", \"Thủ tục mua sắm trang thiết bị\", \"Thủ tục nâng hạng điều dưỡng\"], 0, \"Điều 17.\"],\n[\"Phòng công nghệ thông tin có nhiệm vụ:\", [\"Điều trị người bệnh từ xa\", \"Đào tạo kỹ năng điều dưỡng cho học viên\", \"Thiết kế, hỗ trợ xây dựng, ứng dụng phần mềm trong hoạt động điều dưỡng, quản lý người bệnh, bệnh án điện tử, sử dụng thuốc, vật tư, trang thiết bị\", \"Cung cấp dụng cụ, đồ vải cho khoa lâm sàng\"], 2, \"Điều 17.\"],\n[\"Phòng kế hoạch tổng hợp phối hợp với phòng điều dưỡng:\", [\"Xây dựng quy định, quy trình chuyên môn liên quan chăm sóc điều dưỡng; phối hợp kiểm tra, giám sát chất lượng\", \"Quản lý nhân sự điều dưỡng\", \"Cung ứng thuốc cho điều dưỡng\", \"Quản lý hồ sơ bệnh án điện tử\"], 0, \"Điều 17.\"],\n[\"Bác sĩ điều trị có nhiệm vụ nào đối với điều dưỡng?\", [\"Phối hợp trong khám, nhận định, phân cấp chăm sóc; kiểm tra, giám sát việc thực hiện chỉ định điều trị của điều dưỡng\", \"Độc lập phân cấp chăm sóc không cần điều dưỡng\", \"Chỉ ra y lệnh, không tham gia giám sát\", \"Quyết định mô hình chăm sóc của khoa\"], 0, \"Điều 18.\"],\n[\"Học sinh, sinh viên điều dưỡng được thực hiện kỹ thuật trên người bệnh khi:\", [\"Đã học xong lý thuyết là được tự thực hiện\", \"Được phép, dưới sự giám sát của giáo viên hoặc điều dưỡng phụ trách, và được người bệnh đồng ý\", \"Chỉ cần giáo viên đồng ý\", \"Chỉ cần người nhà đồng ý\"], 1, \"Điều 19.\"],\n[\"Tình huống: Sinh viên thực tập muốn tự tiêm cho người bệnh trong lúc điều dưỡng phụ trách vắng mặt. Điều này:\", [\"Được phép nếu thao tác thành thạo\", \"Không được phép, vì phải có sự giám sát và được người bệnh đồng ý\", \"Được phép nếu người nhà đồng ý\", \"Được phép vào ban đêm khi khoa thiếu người\"], 1, \"Điều 19.\"],\n[\"Thông tư 31/2021/TT-BYT có hiệu lực từ ngày nào?\", [\"28/12/2021\", \"01/01/2022\", \"27/02/2022\", \"01/07/2022\"], 2, \"Điều 20.\"],\n[\"Thông tư nào hết hiệu lực kể từ khi Thông tư 31/2021/TT-BYT có hiệu lực?\", [\"Thông tư 07/2014/TT-BYT\", \"Thông tư 07/2011/TT-BYT (hướng dẫn công tác điều dưỡng về chăm sóc người bệnh trong bệnh viện)\", \"Thông tư 51/2017/TT-BYT\", \"Thông tư 18/2020/TT-BYT\"], 1, \"Điều 20.\"],\n[\"Khi văn bản dẫn chiếu trong Thông tư được thay thế hoặc sửa đổi, bổ sung thì:\", [\"Vẫn áp dụng văn bản dẫn chiếu ban đầu\", \"Áp dụng theo văn bản đã được thay thế hoặc sửa đổi, bổ sung\", \"Dừng thực hiện nội dung liên quan\", \"Chờ Bộ Y tế ban hành thông tư sửa đổi\"], 1, \"Điều 21.\"],\n[\"Đơn vị nào thuộc Bộ Y tế chịu trách nhiệm tổ chức triển khai, kiểm tra việc thực hiện Thông tư trên toàn quốc?\", [\"Vụ Tổ chức cán bộ\", \"Cục Khoa học công nghệ và đào tạo\", \"Thanh tra Bộ\", \"Cục Quản lý Khám, chữa bệnh\"], 3, \"Điều 22 khoản 1.\"],\n[\"Cục Khoa học công nghệ và đào tạo chịu trách nhiệm:\", [\"Chỉ đạo các trường đào tạo điều dưỡng đổi mới chương trình đáp ứng năng lực chăm sóc theo yêu cầu các chuyên khoa và hội nhập\", \"Kiểm tra việc thực hiện Thông tư tại bệnh viện\", \"Cấp chứng chỉ hành nghề điều dưỡng\", \"Quản lý nhân sự điều dưỡng toàn quốc\"], 0, \"Điều 22 khoản 1.\"],\n[\"Sở Y tế các tỉnh, thành phố có trách nhiệm gì?\", [\"Chỉ phổ 0 khoản 4 điểm a.\"],\n[\"Về giải pháp nâng cao chất lượng hoạt động điều dưỡng, phòng điều dưỡng:\", [[\"Thường xuyên đánh giá, đề xuất và thử nghiệm giải pháp\"], \"Chỉ áp dụng giải pháp do Bộ Y tế ban hành\", \"Chờ khoa lâm sàng đề xuất\", \"Không có nhiệm vụ này\"], 0, \"Điều 10 khoản 4 điểm b.\"],\n[\"Về học tập nâng cao, phòng điều dưỡng:\", [[\"Đề xuất việc học tập nâng cao trình độ chuyên môn, thi nâng hạng của điều dưỡng, hộ sinh, kỹ thuật y theo quy định\"], \"Trực tiếp quyết định nâng hạng\", \"Chỉ tổ chức thi tuyển dụng\", \"Không tham gia\"], 0, \"Điều 10 khoản 4 điểm d.\"],\n[\"Phòng điều dưỡng xây dựng kế hoạch, chương trình, tài liệu để thực hiện:\", [[\"Đào tạo mới và đào tạo liên tục; khảo sát, đánh giá các điểm cần cải thiện trong đào tạo\"], \"Chỉ đào tạo bác sĩ nội trú\", \"Chỉ đào tạo cho tuyến trên\", \"Chỉ đào tạo nhân viên hành chính\"], 0, \"Điều 10 khoản 4 điểm đ.\"],\n[\"Phòng điều dưỡng tổ chức các hoạt động nào sau đây?\", [[\"Nghiên cứu khoa học, cải tiến chất lượng chăm sóc, thực hành chăm sóc dựa vào bằng chứng\"], \"Chỉ thanh tra các khoa\", \"Chỉ quản lý hồ sơ bệnh án\", \"Chỉ mua sắm vật tư\"], 0, \"Điều 10 khoản 4 điểm e.\"],\n[\"Trưởng phòng điều dưỡng tham mưu cho giám đốc và:\", [[\"Xây dựng, tổ chức thực hiện kế hoạch của phòng; định kỳ sơ kết, tổng kết, báo cáo\"], \"Trực tiếp ký quyết định tuyển dụng\", \"Quyết định phân cấp chăm sóc người bệnh\", \"Chỉ chủ trì họp người bệnh\"], 0, \"Điều 11 khoản 2, 3.\"],\n[\"Điều dưỡng trong phòng điều dưỡng còn:\", [[\"Tham gia các hội đồng, mạng lưới trong bệnh viện theo phân công; định kỳ sơ kết, tổng kết, báo cáo\"], \"Quyết định nhân sự các khoa\", \"Chỉ chăm sóc trực tiếp người bệnh\", \"Không tham gia hội đồng nào\"], 0, \"Điều 12 khoản 5, 6.\"],\n[\"Điều dưỡng trưởng khoa có nhiệm vụ lập kế hoạch:\", [[\"Và tổ chức thực hiện kế hoạch hoạt động điều dưỡng tại khoa\"], \"Tài chính của khoa\", \"Điều trị cho người bệnh\", \"Thi đua của toàn bệnh viện\"], 0, \"Điều 13 khoản 2.\"],\n[\"Điều dưỡng trưởng khoa quản lý nhân lực điều dưỡng trong khoa theo hướng:\", [[\"Quản lý, đào tạo và phát triển\"], \"Chỉ chấm công\", \"Chỉ phân ca trực\", \"Chỉ do phòng tổ chức cán bộ quản lý\"], 0, \"Điều 13 khoản 7.\"],\n[\"Điều dưỡng trưởng khoa đề xuất nhu cầu:\", [[\"Tuyển dụng, thuyên chuyển, đào tạo điều dưỡng, hộ sinh, kỹ thuật y, hộ lý trợ giúp chăm sóc của khoa\"], \"Tăng lương cho bác sĩ\", \"Mua thuốc cho toàn bệnh viện\", \"Bổ nhiệm trưởng phòng điều dưỡng\"], 0, \"Điều 13 khoản 8.\"],\n[\"Điều dưỡng trưởng khoa tham gia nghiên cứu khoa học, cải tiến chất lượng và:\", [[\"Chỉ đạo tuyến theo sự phân công\"], \"Cấp chứng chỉ hành nghề\", \"Thanh tra bệnh viện\", \"Quyết định danh mục kỹ thuật\"], 0, \"Điều 13 khoản 9.\"],\n[\"Về hạ tầng, trang thiết bị, thuốc, vật tư, điều dưỡng trưởng khoa:\", [[\"Tham gia đề xuất cung cấp, sửa chữa, bảo dưỡng và giám sát sử dụng, bảo quản tại khoa\"], \"Trực tiếp mua sắm\", \"Không có vai trò\", \"Chỉ nhận bàn giao\"], 0, \"Điều 13 khoản 11.\"],\n[\"Điều dưỡng trưởng khoa giám sát, kiểm tra, đánh giá:\", [[\"Việc thực hiện kế hoạch công tác điều dưỡng tại khoa và cải tiến chất lượng chăm sóc; định kỳ sơ kết, tổng kết, báo cáo\"], \"Chuyên môn của bác sĩ trong khoa\", \"Hoạt động tài chính của khoa\", \"Chỉ việc chấp hành giờ giấc\"], 0, \"Điều 13 khoản 12, 13.\"],\n[\"Điều dưỡng khoa lâm sàng làm việc theo phân công của trưởng khoa, điều dưỡng trưởng khoa và theo:\", [[\"Thông tư này và Thông tư liên tịch 26/2015/TTLT-BYT-BNV\"], \"Chỉ nội quy của khoa\", \"Chỉ yêu cầu của người bệnh\", \"Chỉ hướng dẫn của Sở Y tế\"], 0, \"Điều 14 khoản 1.\"],\n[\"Điều dưỡng khoa lâm sàng học tập liên tục để:\", [[\"Cập nhật kiến thức, kỹ năng và ứng dụng để nâng cao chất lượng can thiệp chăm sóc\"], \"Chỉ để thi nâng hạng\", \"Chỉ để thay thế bác sĩ\", \"Chỉ khi bệnh viện bắt buộc\"], 0, \"Điều 14 khoản 5.\"],\n[\"Điều dưỡng khoa lâm sàng tham gia xây dựng:\", [[\"Kế hoạch công tác điều dưỡng tại khoa, hướng dẫn, quy định, quy tr size:.9rem}th,td{padding:6px 7px}\n #box .btn,#res .btn{width:100%}\n .tabs button{padding:9px 6px;font-size:.92rem}\n}\n@media(min-width:800px){\n main{max-width:1100px;padding:20px 28px 40px}\n h1{font-size:1.8rem}\n #sum{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;align-items:start}\n #sum>*{grid-column:1/-1;margin-top:0;margin-bottom:0}\n #sum>details.card{grid-column:auto}\n #sum>h2{margin-top:.6em}\n #quiz{max-width:900px;margin:0 auto}\n #box{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}\n #box>.q,#box>#ex,#box>.btn,#box>select.opt{grid-column:1/-1}\n #box>.btn{justify-self:start}\n #box .opt{margin:0}\n}\n@media(min-width:1080px){\n main{max-width:1760px;padding:20px 32px 40px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(380px,.9fr);column-gap:32px;align-content:start}\n main>h1,main>.sub,main>footer{grid-column:1/-1}\n .tabs{display:none}\n #sum,#sum.hide{display:grid!important;grid-column:1;grid-template-columns:1fr}\n #quiz,#quiz.hide{display:block!important;grid-column:2;position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;max-width:none;margin:0}\n #box{grid-template-columns:1fr}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003ch1>Thông tư 07/2014/TT-BYT\u003c/h1>\n\u003cp class=\"sub\">Quy tắc ứng xử của công chức, viên chức, người lao động làm việc tại các cơ sở y tế · Ban hành 25/02/2014 · Hiệu lực 01/05/2014 · 5 chương, 18 điều\u003c/p>\n\u003cdiv class=\"tabs\">\u003cbutton id=\"t1\" class=\"on\">📘 Tóm tắt\u003c/button>\u003cbutton id=\"t2\">📝 Trắc nghiệm (55 câu · xáo trộn)\u003c/button>\u003c/div>\n\n\u003csection id=\"sum\">\n\u003cdiv class=\"note\">Người ký: Bộ trưởng Nguyễn Thị Kim Tiến. Đối tượng: công chức, viên chức, người lao động ở cơ sở y tế toàn quốc (gọi chung là “công chức, viên chức y tế”). Tôi chưa kiểm tra tình trạng hiệu lực hiện nay của thông tư; khi áp dụng thực tế hãy đối chiếu bản mới nhất.\u003c/div>\n\n\u003ch2>Nhớ nhanh\u003c/h2>\n\u003cdiv class=\"card tw\">\u003ctable>\n\u003ctr>\u003cth>Nội dung\u003c/th>\u003cth>Quy định\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Y đức\u003c/td>\u003ctd>Thực hiện nghiêm túc 12 Điều y đức (Quyết định 2088/QĐ-BYT ngày 06/11/1996)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Đạo đức thầy thuốc\u003c/td>\u003ctd>Cần, kiệm, liêm, chính, chí công vô tư\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Tiền, quà biếu\u003c/td>\u003ctd>Không có thái độ, gợi ý nhận tiền, quà biếu của cơ quan, tổ chức, cá nhân\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ra viện, chuyển tuyến\u003c/td>\u003ctd>Công khai chi tiết từng khoản chi phí trong phiếu thanh toán; giải thích đầy đủ khi có yêu cầu\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cơ quan đầu mối của Bộ Y tế\u003c/td>\u003ctd>Vụ Tổ chức cán bộ\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Sơ kết, tổng kết\u003c/td>\u003ctd>Sơ kết 6 tháng, tổng kết 1 năm (Sở Y tế và Thủ trưởng cơ sở y tế)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Thủ trưởng cơ sở y tế\u003c/td>\u003ctd>Niêm yết công khai Quy tắc ứng xử; lắp đường dây nóng và camera giám sát\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Văn bản hết hiệu lực\u003c/td>\u003ctd>Quyết định 4031/2001/QĐ-BYT và Quyết định 29/2008/QĐ-BYT\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\n\u003ch2>Nội dung theo chương\u003c/h2>\n\u003cdetails class=\"card\" open>\u003csummary>Chương I – Quy định chung (Điều 1–2)\u003c/summary>\u003cul>\n\u003cli>Điều chỉnh nội dung Quy tắc ứng xử và trách nhiệm tổ chức thực hiện của cơ quan, tổ chức, cá nhân liên quan.\u003c/li>\n\u003cli>Áp dụng: công chức, viên chức, người lao động ở cơ sở y tế toàn quốc; cơ quan, tổ chức, cá nhân có liên quan.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Điều 3 – Ứng xử khi thi hành công vụ, nhiệm vụ\u003c/summary>\u003cul>\n\u003cli>\u003cb>Phải làm:\u003c/b> chấp hành nghĩa vụ công chức, viên chức; đạo đức, nhân cách, lối sống lành mạnh của người thầy thuốc (cần, kiệm, liêm, chính, chí công vô tư); đúng quy trình chuyên môn, nội quy, quy chế; học tập thường xuyên; phục tùng, chịu trách nhiệm trong công việc; góp ý trong điều hành; giữ uy tín, danh dự đơn vị; mặc trang phục, đeo thẻ, phù hiệu đúng quy định.\u003c/li>\n\u003cli>\u003cb>Không được làm:\u003c/b> trốn tránh trách nhiệm, thoái thác nhiệm vụ; lạm dụng chức năng, quyền hạn, danh tiếng cơ quan để việc riêng, tự đề cao để vụ lợi; phân biệt đối xử về dân tộc, nam nữ, thành phần xã hội, tín ngưỡng, tôn giáo.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Điều 4 – Ứng xử với đồng nghiệp\u003c/summary>\u003cul>\n\u003cli>\u003cb>Phải làm:\u003c/b> trung thực, đoàn kết, hợp tác, chia sẻ trách nhiệm; tự phê bình và phê bình khách quan, thẳng thắn, xây dựng; tôn trọng, lắng nghe, trao đổi kinh nghiệm; phát hiện đồng nghiệp vi phạm thì phản ánh đến cấp có thẩm quyền và chịu trách nhiệm cá nhân về phản ánh đó.\u003c/li>\n\u003cli>\u003cb>Không được làm:\u003c/b> né tránh, đẩy trách nhiệm, khuyết điểm cho đồng nghiệp; bè phái, chia rẽ nội bộ, cục bộ địa phương.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Điều 5 – Ứng xử với cơ quan, tổ chức, cá nhân\u003c/summary>\u003cul>\n\u003cli>\u003cb>Phải làm:\u003c/b> lịch sự, hòa nhã, văn minh khi giao dịch trực tiếp hoặc qua phương tiện thông tin; thông tin đúng nội dung công việc; tuyên truyền, hướng dẫn người dân chấp hành nội quy, quy trình; giữ bí mật nhà nước, bí mật cơ quan, bí mật cá nhân.\u003c/li>\n\u003cli>\u003cb>Không được làm:\u003c/b> cửa quyền, hách dịch, sách nhiễu, trì hoãn, thờ ơ, gây khó khăn; cố ý kéo dài thời gian; có thái độ, gợi ý nhận tiền, quà biếu.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Điều 6 – Ứng xử trong cơ sở khám bệnh, chữa bệnh\u003c/summary>\u003cul>\n\u003cli>Thực hiện nghiêm túc 12 Điều y đức.\u003c/li>\n\u003cli>\u003cb>Người đến khám:\u003c/b> niềm nở, hướng dẫn thủ tục; sơ bộ phân loại, khám theo thứ tự và đối tượng ưu tiên; kín đáo, tôn trọng, giải thích tình trạng bệnh; khám, xét nghiệm, kê đơn phù hợp bệnh và khả năng chi trả; dặn dò dùng thuốc, hẹn khám lại; hỗ trợ thủ tục nhập viện.\u003c/li>\n\u003cli>\u003cb>Người bệnh nội trú:\u003c/b> khẩn trương tiếp đón, bố trí giường, giải thích nội quy; phát hiện diễn biến bất thường, giải thích thắc mắc; tư vấn giáo dục sức khỏe; có mặt kịp thời khi được yêu cầu; trước phẫu thuật phải giải thích bệnh, phương pháp, rủi ro, chuẩn bị đầy đủ và nêu rõ lý do khi hoãn hoặc tạm ngừng.\u003c/li>\n\u003cli>\u003cb>Ra viện, chuyển tuyến:\u003c/b> dặn dò điều cần thực hiện; giải thích lý do chuyển tuyến; công khai chi tiết từng khoản chi phí; khẩn trương làm thủ tục; tiếp thu góp ý.\u003c/li>\n\u003cli>\u003cb>Không được làm:\u003c/b> không tuân thủ quy chế chuyên môn; lạm dụng nghề nghiệp để thu lợi; gây khó khăn, thờ ơ với người bệnh hoặc người đại diện.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Điều 7 – Ứng xử của lãnh đạo, quản lý cơ sở y tế\u003c/summary>\u003cul>\n\u003cli>\u003cb>Phải làm:\u003c/b> phân công công việc công khai, hợp lý theo năng lực; đôn đốc, kiểm tra; khen thưởng kịp thời, xử lý kỷ luật nghiêm, khách quan; nắm tâm tư, nguyện vọng; thực hiện Quy chế dân chủ ở cơ sở; tôn trọng, tạo niềm tin khi giao việc; lắng nghe, bảo vệ quyền lợi chính đáng; xây dựng đoàn kết, môi trường văn hóa.\u003c/li>\n\u003cli>\u003cb>Không được làm:\u003c/b> chuyên quyền, độc đoán, gia trưởng, xem thường cấp dưới, không gương mẫu; khen thưởng, xử lý thiếu khách quan; cản trở hoặc xử lý sai quy trình khiếu nại, tố cáo, tiết lộ thông tin người tố cáo; các việc bị cấm theo Luật phòng, chống tham nhũng và Luật thực hành tiết kiệm, chống lãng phí.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Chương III – Trách nhiệm thực hiện (Điều 8–14)\u003c/summary>\u003cul>\n\u003cli>\u003cb>Bộ Y tế (Điều 8):\u003c/b> hướng dẫn, chỉ đạo, tập huấn; phối hợp Công đoàn Y tế Việt Nam phát động thi đua, ký cam kết; hướng dẫn cơ sở ban hành quy tắc phù hợp thực tiễn; kiểm tra, giám sát; sơ kết, tổng kết; giao Vụ Tổ chức cán bộ làm đầu mối.\u003c/li>\n\u003cli>\u003cb>Giám đốc Sở Y tế, Thủ trưởng Y tế bộ, ngành (Điều 9):\u003c/b> tuyên truyền, tập huấn lãnh đạo cơ sở; ký cam kết; thiết lập đường dây nóng; khen thưởng, xử lý vi phạm; sơ kết 6 tháng, tổng kết 1 năm, báo cáo Bộ Y tế.\u003c/li>\n\u003cli>\u003cb>Hội nghề nghiệp (Điều 10):\u003c/b> phối hợp ban hành quy tắc đạo đức nghề nghiệp; tuyên truyền, tập huấn hội viên; kiểm tra, xử lý vi phạm theo quy định của hội, kiến nghị cơ quan nhà nước.\u003c/li>\n\u003cli>\u003cb>Trưởng phòng Y tế cấp huyện (Điều 11):\u003c/b> xây dựng kế hoạch trình UBND cấp huyện phê duyệt; phối hợp tuyên truyền, kiểm tra.\u003c/li>\n\u003cli>\u003cb>Thủ trưởng cơ sở y tế (Điều 12):\u003c/b> ban hành Quy tắc ứng xử của đơn vị; niêm yết công khai; ban hành quy chế thi đua, khen thưởng, chế tài; ký cam kết với trưởng khoa, phòng; lắp đường dây nóng và camera giám sát; sơ kết 6 tháng, tổng kết 1 năm; chịu trách nhiệm trước pháp luật và cấp trên nếu để xảy ra vi phạm.\u003c/li>\n\u003cli>\u003cb>Trưởng khoa, phòng (Điều 13):\u003c/b> triển khai, đôn đốc; ký cam kết thi đua; quán triệt, phổ biến cho nhân dân không đưa tiền, quà biếu; chịu trách nhiệm nếu để vi phạm xảy ra.\u003c/li>\n\u003cli>\u003cb>Công chức, viên chức y tế (Điều 14):\u003c/b> học tập, chấp hành; ký cam kết với trưởng khoa, phòng; gương mẫu và vận động đồng nghiệp; vận động nhân dân; chịu trách nhiệm cá nhân khi vi phạm.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Chương IV – Khen thưởng, xử lý vi phạm (Điều 15–16)\u003c/summary>\u003cul>\n\u003cli>\u003cb>Khen thưởng (Thủ trưởng quyết định):\u003c/b> biểu dương trước toàn đơn vị; tăng thưởng thi đua theo phân loại lao động hàng tháng; xếp loại hoàn thành xuất sắc nhiệm vụ cuối năm; các hình thức phù hợp khác.\u003c/li>\n\u003cli>\u003cb>Xử lý vi phạm:\u003c/b> kỷ luật theo pháp luật về công chức, viên chức và quy chế đơn vị; hình thức do Thủ trưởng quyết định gồm phê bình trước hội nghị giao ban, cắt hoặc giảm thưởng thi đua, điều chuyển vị trí công tác, xếp loại không hoàn thành nhiệm vụ, không xét danh hiệu thi đua, khen thưởng.\u003c/li>\n\u003cli>Thủ trưởng không kiên quyết thực hiện, để xảy ra vi phạm thì bị xử lý theo quy định về trách nhiệm người đứng đầu.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Chương V – Điều khoản thi hành (Điều 17–18)\u003c/summary>\u003cul>\n\u003cli>Hiệu lực từ 01/05/2014.\u003c/li>\n\u003cli>Hết hiệu lực từ cùng ngày: Quyết định 4031/2001/QĐ-BYT (chế độ giao tiếp tại cơ sở KBCB) và Quyết định 29/2008/QĐ-BYT (quy tắc ứng xử của cán bộ, viên chức tại đơn vị sự nghiệp y tế).\u003c/li>\u003c/ul>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"quiz\" class=\"hide\">\n\u003cdiv class=\"bar\">\u003ci id=\"pb\">\u003c/i>\u003c/div>\n\u003cdiv class=\"sub\" id=\"pg\">\u003c/div>\n\u003cdiv class=\"card\" id=\"box\">\u003c/div>\n\u003cdiv id=\"res\" class=\"card hide\">\u003c/div>\n\u003c/section>\n\n\u003cfooter>Nguồn: toàn văn Thông tư 07/2014/TT-BYT (Bộ Y tế). Nội dung tóm tắt chỉ phục vụ ôn tập, không thay thế văn bản gốc.\u003c/footer>\n\u003c/main>\n\u003cscript>\nvar Q=[\n[\"Thông tư 07/2014/TT-BYT áp dụng đối với đối tượng nào?\",[\"Chỉ bác sĩ và điều dưỡng\",\"Chỉ viên chức ở bệnh viện công\",\"Công chức, viên chức, người lao động ở các cơ sở y tế toàn quốc và cơ quan, tổ chức, cá nhân liên quan\",\"Chỉ lãnh đạo các cơ sở y tế\"],2,\"Điều 2: công chức, viên chức, người lao động ở cơ sở y tế toàn quốc (gọi chung là công chức, viên chức y tế) và cơ quan, tổ chức, cá nhân liên quan.\"],\n[\"Thông tư 07/2014/TT-BYT điều chỉnh nội dung nào?\",[\"Quy tắc ứng xử và trách nhiệm tổ chức thực hiện của các bên liên quan\",\"Giá dịch vụ khám bệnh, chữa bệnh\",\"Cấp chứng chỉ hành nghề\",\"Điều kiện cấp giấy phép hoạt động cơ sở KBCB\"],0,\"Điều 1: nội dung Quy tắc ứng xử và trách nhiệm tổ chức thực hiện.\"],\n[\"Hành vi nào sau đây thuộc “những việc KHÔNG được làm” khi thi hành công vụ, nhiệm vụ?\",[\"Học tập thường xuyên nâng cao đạo đức nghề nghiệp\",\"Đeo thẻ công chức, viên chức đúng quy định\",\"Đóng góp ý kiến trong điều hành đơn vị\",\"Lạm dụng chức năng, quyền hạn và danh tiếng của đơn vị để giải quyết việc cá nhân\"],3,\"Điều 3 khoản 2 điểm b.\"],\n[\"Người thầy thuốc cần có đạo đức, nhân cách, lối sống theo quan điểm nào?\",[\"Cần, kiệm, liêm, chính, chí công vô tư\",\"Nhân, nghĩa, lễ, trí, tín\",\"Thận trọng, chuyên cần, hiệu quả\",\"Công bằng, minh bạch, hiệu quả\"],0,\"Điều 3 khoản 1 điểm b.\"],\n[\"Tình huống: Nhân viên y tế từ chối tiếp đón người bệnh vì khác tín ngưỡng, tôn giáo. Hành vi này:\",[\"Được phép nếu người bệnh không phải người địa phương\",\"Vi phạm quy định cấm phân biệt đối xử về dân tộc, nam nữ, thành phần xã hội, tín ngưỡng, tôn giáo\",\"Không vi phạm nếu có lý do cá nhân\",\"Chỉ bị nhắc nhở miệng, không phải vi phạm\"],1,\"Điều 3 khoản 2 điểm c.\"],\n[\"Theo Điều 3, công chức, viên chức y tế phải làm gì về trang phục?\",[\"Mặc đồng phục tự chọn\",\"Mặc trang phục, đeo thẻ công chức, viên chức đúng quy định; đeo phù hiệu theo pháp luật (nếu có)\",\"Chỉ đeo thẻ khi có thanh tra\",\"Không có quy định\"],1,\"Điều 3 khoản 1 điểm h.\"],\n[\"Phát hiện đồng nghiệp thực hiện không nghiêm túc nghĩa vụ công chức, viên chức, bạn phải:\",[\"Im lặng để giữ đoàn kết\",\"Tự xử lý nội bộ giữa hai người\",\"Phản ánh đến cấp có thẩm quyền và chịu trách nhiệm cá nhân về phản ánh đó\",\"Đăng lên mạng xã hội\"],2,\"Điều 4 khoản 1 điểm d.\"],\n[\"Việc nào sau đây KHÔNG được làm trong ứng xử với đồng nghiệp?\",[\"Tôn trọng, lắng nghe ý kiến đồng nghiệp\",\"Tự phê bình và phê bình khách quan, thẳng thắn\",\"Trao đổi kinh nghiệm, học hỏi lẫn nhau\",\"Né tránh, đẩy trách nhiệm, khuyết điểm của mình cho đồng nghiệp\"],3,\"Điều 4 khoản 2 điểm a. (Bè phái, chia rẽ nội bộ, cục bộ địa phương cũng bị cấm - điểm b.)\"],\n[\"Theo Điều 4, tự phê bình và phê bình phải mang tính chất nào?\",[\"Gay gắt để răn đe\",\"Khách quan, nghiêm túc, thẳng thắn, mang tính xây dựng\",\"Chỉ thực hiện bằng văn bản mật\",\"Nhẹ nhàng, tránh va chạm\"],1,\"Điều 4 khoản 1 điểm b.\"],\n[\"Sau khi khám xong, người nhà đưa phong bì và nhân viên y tế gợi ý nhận thêm. Hành vi này vi phạm quy định nào?\",[\"Không vi phạm vì là tự nguyện\",\"Chỉ vi phạm nếu số tiền lớn\",\"Không được có thái độ, gợi ý nhận tiền, quà biếu của cơ quan, tổ chức, cá nhân\",\"Chỉ vi phạm nếu đòi trực tiếp\"],2,\"Điều 5 khoản 2 điểm c.\"],\n[\"Công chức, viên chức y tế phải giữ gìn bí mật nào khi giao tiếp với cơ quan, tổ chức, cá nhân?\",[\"Bí mật nhà nước, bí mật cơ quan, bí mật cá nhân theo quy định của pháp luật\",\"Chỉ bí mật nhà nước\",\"Chỉ bí mật kinh doanh\",\"Chỉ bí mật của lãnh đạo\"],0,\"Điều 5 khoản 1 điểm d.\"],\n[\"Khi giao dịch trực tiếp hoặc qua phương tiện thông tin, công chức, viên chức y tế phải:\",[\"Ngắn gọn, dứt khoát\",\"Lịch sự, hòa nhã, văn minh\",\"Nghiêm khắc để giữ trật tự\",\"Tuỳ tâm trạng\"],1,\"Điều 5 khoản 1 điểm a.\"],\n[\"Hành vi nào sau đây KHÔNG được làm khi thi hành nhiệm vụ liên quan đến tổ chức, cá nhân?\",[\"Hướng dẫn người dân chấp hành nội quy\",\"Trả lời đúng nội dung công việc cần hướng dẫn\",\"Cố ý kéo dài thời gian khi thi hành công vụ, nhiệm vụ\",\"Giữ bí mật cá nhân theo quy định\"],2,\"Điều 5 khoản 2 điểm b. (Cửa quyền, hách dịch, sách nhiễu, trì hoãn, thờ ơ cũng bị cấm - điểm a.)\"],\n[\"Trong cơ sở KBCB, công chức, viên chức y tế phải thực hiện nghiêm túc bao nhiêu Điều y đức?\",[\"10 Điều\",\"15 Điều\",\"8 Điều\",\"12 Điều\"],3,\"Điều 6 khoản 1: 12 Điều y đức ban hành kèm Quyết định số 2088/QĐ-BYT ngày 06/11/1996.\"],\n[\"Đối với người đến khám bệnh, nhân viên y tế phải sơ bộ phân loại người bệnh và sắp xếp khám theo:\",[\"Thứ tự và đối tượng ưu tiên theo quy định\",\"Thứ tự do người nhà thỏa thuận\",\"Mức độ giàu nghèo\",\"Thời gian đăng ký trước, không có ưu tiên\"],0,\"Điều 6 khoản 2 điểm b.\"],\n[\"Khám bệnh, chỉ định xét nghiệm, kê đơn phải phù hợp với:\",[\"Doanh thu của khoa\",\"Tình trạng bệnh và khả năng chi trả của người bệnh\",\"Yêu cầu của người nhà\",\"Chỉ tiêu của bệnh viện\"],1,\"Điều 6 khoản 2 điểm d.\"],\n[\"Tình huống: Ca phẫu thuật của người bệnh bị hoãn. Nhân viên y tế phải:\",[\"Không cần thông báo\",\"Chỉ thông báo cho lãnh đạo khoa\",\"Giải thích rõ lý do cho người bệnh hoặc người đại diện hợp pháp\",\"Chờ người bệnh hỏi mới trả lời\"],2,\"Điều 6 khoản 3 điểm đ.\"],\n[\"Trước phẫu thuật, phải thông báo, giải thích cho người bệnh những nội dung nào?\",[\"Chỉ giá dịch vụ\",\"Chỉ tên bác sĩ phẫu thuật\",\"Tình trạng bệnh, phương pháp phẫu thuật, khả năng rủi ro có thể xảy ra\",\"Chỉ thời gian xuất viện\"],2,\"Điều 6 khoản 3 điểm đ.\"],\n[\"Khi người bệnh ra viện hoặc chuyển tuyến, nhân viên y tế phải công khai gì?\",[\"Chi tiết từng khoản chi phí trong phiếu thanh toán giá dịch vụ y tế; giải thích đầy đủ khi có yêu cầu\",\"Chỉ tổng số tiền\",\"Danh sách bác sĩ trực\",\"Lợi nhuận của bệnh viện\"],0,\"Điều 6 khoản 4 điểm b.\"],\n[\"Khi chuyển tuyến, nhân viên y tế phải:\",[\"Chỉ làm giấy chuyển tuyến\",\"Giải thích lý do chuyển tuyến cho người bệnh hoặc người đại diện hợp pháp\",\"Để người nhà tự tìm hiểu\",\"Không cần giải thích\"],1,\"Điều 6 khoản 4 điểm a.\"],\n[\"Hành vi nào sau đây KHÔNG được làm trong cơ sở KBCB?\",[\"Lạm dụng nghề nghiệp để thu lợi trong quá trình khám bệnh, chữa bệnh\",\"Hỗ trợ hoàn thiện thủ tục nhập viện\",\"Hẹn khám lại khi cần\",\"Tư vấn giáo dục sức khỏe\"],0,\"Điều 6 khoản 5 điểm b. (Không tuân thủ quy chế chuyên môn; gây khó khăn, thờ ơ với người bệnh cũng bị cấm.)\"],\n[\"Khi khám bệnh, nhân viên y tế phải bảo đảm điều gì?\",[\"Khám nhanh, không cần giải thích\",\"Kín đáo, tôn trọng người bệnh; thông báo, giải thích tình trạng sức khỏe cho người bệnh hoặc người đại diện hợp pháp\",\"Chỉ giải thích với người nhà\",\"Ưu tiên người quen\"],1,\"Điều 6 khoản 2 điểm c.\"],\n[\"Lãnh đạo, quản lý cơ sở y tế phải phân công công việc như thế nào?\",[\"Theo quan hệ cá nhân\",\"Luân phiên ngẫu nhiên\",\"Công khai, hợp lý, phù hợp nhiệm vụ và năng lực chuyên môn của từng người\",\"Do cấp dưới tự chọn\"],2,\"Điều 7 khoản 1 điểm a.\"],\n[\"Tình huống: Lãnh đạo tiết lộ họ tên người tố cáo cho người bị tố cáo. Hành vi này:\",[\"Hợp lệ để làm rõ sự việc\",\"Vi phạm: cản trở, xử lý không đúng quy trình khiếu nại, tố cáo; tiết lộ thông tin người tố cáo\",\"Hợp lệ nếu người bị tố cáo yêu cầu\",\"Không liên quan đến Quy tắc ứng xử\"],1,\"Điều 7 khoản 2 điểm c.\"],\n[\"Hành vi nào sau đây của lãnh đạo, quản lý bị cấm?\",[\"Lắng nghe ý kiến phản ánh của công chức, viên chức\",\"Xây dựng, giữ gìn đoàn kết trong đơn vị\",\"Khen thưởng kịp thời người có thành tích\",\"Chuyên quyền, độc đoán, gia trưởng, xem thường cấp dưới, nói không đi đôi với làm\"],3,\"Điều 7 khoản 2 điểm a.\"],\n[\"Lãnh đạo, quản lý cơ sở y tế phải thực hiện quy chế nào ở cơ sở?\",[\"Quy chế dân chủ ở cơ sở\",\"Quy chế bảo mật\",\"Quy chế chi tiêu cá nhân\",\"Quy chế hội nghị quốc tế\"],0,\"Điều 7 khoản 1 điểm d.\"],\n[\"Bộ Y tế giao đơn vị nào làm đầu mối tổ chức triển khai Thông tư?\",[\"Cục Quản lý Khám, chữa bệnh\",\"Vụ Tổ chức cán bộ\",\"Thanh tra Bộ\",\"Vụ Pháp chế\"],1,\"Điều 8 khoản 7: Vụ Tổ chức cán bộ.\"],\n[\"Giám đốc Sở Y tế phải sơ kết, tổng kết việc thực hiện Thông tư theo thời hạn nào?\",[\"Sơ kết hằng quý, tổng kết 5 năm\",\"Sơ kết 3 tháng, tổng kết 2 năm\",\"Sơ kết 6 tháng, tổng kết 1 năm; báo cáo về Bộ Y tế\",\"Chỉ tổng kết khi có yêu cầu\"],2,\"Điều 9 khoản 6.\"],\n[\"Thủ trưởng cơ sở y tế phải làm gì đối với nội dung Quy tắc ứng xử của đơn vị?\",[\"Giữ nội bộ\",\"Niêm yết công khai nội dung Quy tắc ứng xử tại cơ sở y tế\",\"Chỉ gửi cấp trên\",\"Chỉ đăng website\"],1,\"Điều 12 khoản 4.\"],\n[\"Thủ trưởng cơ sở y tế phải lắp đặt hệ thống nào để tiếp nhận phản ánh và giám sát hoạt động?\",[\"Đường dây nóng và camera giám sát hoạt động của các bộ phận\",\"Chỉ hòm thư góp ý\",\"Chỉ hệ thống chấm công\",\"Chỉ bảng điện tử\"],0,\"Điều 12 khoản 7.\"],\n[\"Trưởng khoa, phòng phải quán triệt, phổ biến cho nhân dân điều gì?\",[\"Không đưa tiền, quà biếu trong khi viên chức y tế thi hành nhiệm vụ\",\"Không phản ánh tiêu cực\",\"Chỉ đến khám giờ hành chính\",\"Phải đặt lịch trước\"],0,\"Điều 13 khoản 6.\"],\n[\"Công chức, viên chức y tế ký cam kết thực hiện Quy tắc ứng xử với ai?\",[\"Giám đốc Sở Y tế\",\"Trưởng khoa, phòng trong đơn vị\",\"Bộ trưởng Bộ Y tế\",\"Chủ tịch UBND tỉnh\"],1,\"Điều 14 khoản 2.\"],\n[\"Trưởng phòng Y tế quận, huyện, thị xã xây dựng kế hoạch triển khai Thông tư và trình cơ quan nào phê duyệt?\",[\"Sở Y tế\",\"Bộ Y tế\",\"UBND cấp huyện\",\"Hội đồng nhân dân tỉnh\"],2,\"Điều 11 khoản 1.\"],\n[\"Hình thức khen thưởng nào do Thủ trưởng cơ sở y tế quyết định theo Điều 15?\",[\"Biểu dương tập thể, cá nhân trước toàn thể cơ quan, đơn vị\",\"Điều chuyển vị trí công tác\",\"Phê bình trước hội nghị giao ban\",\"Không xét danh hiệu thi đua\"],0,\"Điều 15 khoản 2 điểm a. (Ba phương án còn lại là hình thức xử lý vi phạm hoặc không phải khen thưởng.)\"],\n[\"Hình thức nào sau đây KHÔNG phải hình thức xử lý vi phạm do Thủ trưởng cơ sở y tế quyết định?\",[\"Phê bình trước hội nghị giao ban toàn đơn vị\",\"Cắt hoặc giảm thưởng thi đua\",\"Điều chuyển vị trí công tác\",\"Tăng thưởng thi đua theo phân loại lao động hàng tháng\"],3,\"Điều 16 khoản 3: tăng thưởng thi đua là hình thức khen thưởng (Điều 15).\"],\n[\"Thủ trưởng cơ sở y tế không kiên quyết tổ chức thực hiện, để xảy ra vi phạm Quy tắc ứng xử thì:\",[\"Không bị xử lý\",\"Chỉ bị nhắc nhở\",\"Chuyển sang công tác khác ngay\",\"Bị xử lý theo quy định về trách nhiệm của người đứng đầu cơ quan, đơn vị\"],3,\"Điều 16 khoản 4.\"],\n[\"Thông tư 07/2014/TT-BYT có hiệu lực từ ngày nào?\",[\"01/05/2014\",\"25/02/2014\",\"01/01/2015\",\"01/07/2014\"],0,\"Điều 17 khoản 1: 01/05/2014 (ban hành 25/02/2014).\"],\n[\"Văn bản nào hết hiệu lực kể từ khi Thông tư 07/2014/TT-BYT có hiệu lực?\",[\"Luật Khám bệnh, chữa bệnh 2009\",\"Luật viên chức\",\"Quyết định 4031/2001/QĐ-BYT và Quyết định 29/2008/QĐ-BYT\",\"Quyết định 2088/QĐ-BYT ngày 06/11/1996\"],2,\"Điều 17 khoản 2. (Quyết định 2088/1996 về 12 Điều y đức vẫn được dẫn chiếu tại Điều 6.)\"],\n[\"Điều 10: Hội nghề nghiệp phối hợp với cơ quan quản lý để ban hành nội dung nào?\", [\"Quy tắc đạo đức nghề nghiệp\", \"Bảng giá dịch vụ y tế\", \"Chứng chỉ hành nghề\", \"Quy chế tài chính của bệnh viện\"], 0, \"Điều 10: hội nghề nghiệp phối hợp ban hành quy tắc đạo đức nghề nghiệp, tuyên truyền, tập huấn hội viên.\"],\n[\"Hội nghề nghiệp xử lý hội viên vi phạm Quy tắc ứng xử theo căn cứ nào?\", [\"Theo quy định của hội và kiến nghị cơ quan nhà nước có thẩm quyền\", \"Chỉ do Bộ trưởng quyết định\", \"Không có quyền xử lý\", \"Chỉ do Thủ trưởng cơ sở y tế quyết định\"], 0, \"Điều 10: kiểm tra, xử lý vi phạm theo quy định của hội, kiến nghị cơ quan nhà nước.\"],\n[\"Bộ Y tế phối hợp với tổ chức nào để phát động thi đua, ký cam kết thực hiện Quy tắc ứng xử?\", [\"Hội Chữ thập đỏ\", \"Công đoàn Y tế Việt Nam\", \"Hội Liên hiệp phụ nữ\", \"Đoàn Thanh niên\"], 1, \"Điều 8: Bộ Y tế phối hợp Công đoàn Y tế Việt Nam phát động thi đua, ký cam kết.\"],\n[\"Bộ Y tế hướng dẫn các cơ sở y tế như thế nào về việc ban hành quy tắc ứng xử?\", [\"Bắt buộc dùng nguyên văn một mẫu chung\", \"Cấm cơ sở tự ban hành\", \"Hướng dẫn cơ sở ban hành quy tắc phù hợp với thực tiễn đơn vị\", \"Giao hoàn toàn cho Sở Y tế soạn\"], 2, \"Điều 8: hướng dẫn cơ sở ban hành quy tắc ứng xử phù hợp thực tiễn.\"],\n[\"Giám đốc Sở Y tế phải thiết lập hệ thống nào để tiếp nhận phản ánh về vi phạm?\", [\"Hòm thư góp ý giấy\", \"Đường dây nóng\", \"Trang mạng xã hội\", \"Không yêu cầu\"], 1, \"Điều 9: Giám đốc Sở Y tế thiết lập đường dây nóng.\"],\n[\"Thủ trưởng cơ sở y tế có trách nhiệm ban hành văn bản nào?\", [\"Bảng giá dịch vụ\", \"Quy tắc ứng xử của đơn vị\", \"Điều lệ Hội nghề nghiệp\", \"Kế hoạch của UBND huyện\"], 1, \"Điều 12: Thủ trưởng ban hành Quy tắc ứng xử của đơn vị, niêm yết công khai.\"],\n[\"Thủ trưởng cơ sở y tế ký cam kết thực hiện Quy tắc ứng xử với ai?\", [\"Trưởng khoa, phòng\", \"Giám đốc Sở Y tế\", \"Chủ tịch UBND tỉnh\", \"Người bệnh\"], 0, \"Điều 12: Thủ trưởng ký cam kết với trưởng khoa, phòng.\"],\n[\"Nếu để xảy ra vi phạm Quy tắc ứng xử tại đơn vị, Thủ trưởng cơ sở y tế phải:\", [\"Không chịu trách nhiệm vì do nhân viên vi phạm\", \"Chỉ nhắc nhở người vi phạm\", \"Chịu trách nhiệm trước pháp luật và cấp trên\", \"Chỉ chịu trách nhiệm trước Hội nghề nghiệp\"], 2, \"Điều 12: Thủ trưởng chịu trách nhiệm trước pháp luật và cấp trên nếu để xảy ra vi phạm.\"],\n[\"Trưởng khoa, phòng phải chịu trách nhiệm trong trường hợp nào?\", [\"Khi bệnh nhân đông\", \"Khi để xảy ra vi phạm Quy tắc ứng xử tại khoa, phòng\", \"Khi thiếu thuốc\", \"Khi Sở Y tế kiểm tra\"], 1, \"Điều 13: Trưởng khoa, phòng chịu trách nhiệm nếu để vi phạm xảy ra tại khoa, phòng.\"],\n[\"Theo Điều 14, ngoài việc tự chấp hành, công chức, viên chức y tế còn phải làm gì?\", [\"Gương mẫu và vận động đồng nghiệp, vận động nhân dân cùng thực hiện\", \"Chỉ báo cáo cấp trên\", \"Không phải làm gì thêm\", \"Chỉ tham gia tập huấn\"], 0, \"Điều 14: gương mẫu, vận động đồng nghiệp và vận động nhân dân.\"],\n[\"Khi vi phạm Quy tắc ứng xử, công chức, viên chức y tế chịu trách nhiệm như thế nào?\", [\"Trách nhiệm tập thể của khoa\", \"Trách nhiệm cá nhân\", \"Trách nhiệm của Thủ trưởng thay\", \"Không bị xử lý lần đầu\"], 1, \"Điều 14: công chức, viên chức y tế chịu trách nhiệm cá nhân khi vi phạm.\"],\n[\"Tình huống: Nhân viên y tế thoái thác nhiệm vụ được giao mà không có lý do chính đáng. Hành vi này:\", [\"Được phép nếu mệt\", \"Vi phạm quy định cấm trốn tránh trách nhiệm, thoái thác nhiệm vụ\", \"Chỉ vi phạm nếu có thiệt hại\", \"Thuộc quyền cá nhân\"], 1, \"Điều 3 khoản 2: không được trốn tránh trách nhiệm, thoái thác nhiệm vụ.\"],\n[\"Hành vi bè phái, chia rẽ nội bộ trong đơn vị thuộc nhóm nào?\", [\"Việc nên làm\", \"Việc không được làm khi ứng xử với đồng nghiệp\", \"Không liên quan đến Quy tắc ứng hần tóm tắt rồi làm lại.\")+'\u003c/p>';\n if(mode==\"t\"){\n  var w=\"\";\n  Q.forEach(function(q,j){if(AN[j]!==q[2]){w+='\u003cdiv class=\"card\">\u003cdiv class=\"q\">'+(j+1)+'. '+q[0]+'\u003c/div>\u003cdiv class=\"ex\">'+(AN[j]==null?\"⏱ Chưa trả lời. \":\"Bạn chọn: \"+L[AN[j]]+\". \")+\"Đáp án đúng: \"+L[q[2]]+\". \"+q[1][q[2]]+\"\u003cbr>\"+q[3]+\"\u003c/div>\u003c/div>\"}});\n  h+=w?\"\u003ch2>Các câu cần xem lại\u003c/h2>\"+w:\"\u003cp>🎉 Không có câu nào sai!\u003c/p>\";\n }\n h+='\u003cbutton class=\"btn\" id=\"rs\">Làm lại (xáo trộn mới)\u003c/button> \u003cbutton class=\"btn\" id=\"st\">Chọn lại chủ đề/chế độ\u003c/button>';\n $(\"res\").innerHTML=h;\n $(\"rs\").onclick=function(){start(CFG)};\n $(\"st\").onclick=setup;\n}\nsetup();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "tt32": "\u003c!DOCTYPE html>\n\u003chtml lang=\"vi\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Thông tư 32/2023/TT-BYT – Tóm tắt & Trắc nghiệm\u003c/title>\n\u003cstyle>\n:root{--bg:#f6f8fa;--card:#fff;--tx:#1b2a33;--mu:#5b6b75;--ac:#0b7a75;--ac2:#e3f4f2;--ok:#1e8e3e;--okb:#e6f4ea;--no:#c5221f;--nob:#fce8e6;--bd:#d9e1e6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10191e;--card:#18242b;--tx:#e6eef2;--mu:#9bb0bb;--ac:#4fd1c5;--ac2:#14363a;--ok:#6fd58a;--okb:#143323;--no:#ff8a84;--nob:#3a1b1a;--bd:#2c3d46;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#10191e;--card:#18242b;--tx:#e6eef2;--mu:#9bb0bb;--ac:#4fd1c5;--ac2:#14363a;--ok:#6fd58a;--okb:#143323;--no:#ff8a84;--nob:#3a1b1a;--bd:#2c3d46;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-se
