tails.card{grid-column:auto}\n #sum>h2{margin-top:.6em}\n #quiz{max-width:900px;margin:0 auto}\n #box{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}\n #box>.q,#box>#ex,#box>.btn,#box>select.opt{grid-column:1/-1}\n #box>.btn{justify-self:start}\n #box .opt{margin:0}\n}\n@media(min-width:1080px){\n main{max-width:1760px;padding:20px 32px 40px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(380px,.9fr);column-gap:32px;align-content:start}\n main>h1,main>.sub,main>footer{grid-column:1/-1}\n .tabs{display:none}\n #sum,#sum.hide{display:grid!important;grid-column:1;grid-template-columns:1fr}\n #quiz,#quiz.hide{display:block!important;grid-column:2;position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;max-width:none;margin:0}\n #box{grid-template-columns:1fr}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003ch1>Quyết định 3916/QĐ-BYT\u003c/h1>\n\u003cp class=\"sub\">Hướng dẫn kiểm soát nhiễm khuẩn trong cơ sở khám bệnh, chữa bệnh · Ban hành 28/08/2017 · Phiên bản này: vệ sinh tay và vệ sinh môi trường bề mặt\u003c/p>\n\u003cdiv class=\"tabs\">\u003cbutton id=\"t1\" class=\"on\">📘 Tóm tắt\u003c/button>\u003cbutton id=\"t2\">📝 Trắc nghiệm (53 câu · xáo trộn)\u003c/button>\u003c/div>\n\n\u003csection id=\"sum\">\n\u003cdiv class=\"note\">Quyết định 3916/QĐ-BYT phê duyệt một bộ Hướng dẫn kiểm soát nhiễm khuẩn. \u003cb>Phiên bản này mới có nội dung chi tiết của 2 hướng dẫn: vệ sinh tay và vệ sinh môi trường bề mặt.\u003c/b> Các hướng dẫn còn lại (giám sát NKBV, KSNK tại khoa gây mê hồi sức, phòng ngừa nhiễm khuẩn tiết niệu, xử lý dụng cụ nội soi) mình chưa lấy được toàn văn, nên chưa tóm tắt và chưa ra câu hỏi. Hãy đối chiếu bản hiện hành trước khi dùng cho công việc.\u003c/div>\n\u003ch2>Quyết định 3916/QĐ-BYT\u003c/h2>\n\u003cdiv class=\"card\">\u003cul>\n\u003cli>\u003cb>Số, ngày:\u003c/b> 3916/QĐ-BYT, Hà Nội, 28/08/2017; KT. Bộ trưởng, Thứ trưởng Nguyễn Viết Tiến ký; theo đề nghị của Cục trưởng Cục Quản lý Khám, chữa bệnh.\u003c/li>\n\u003cli>\u003cb>Căn cứ:\u003c/b> Nghị định 75/2017/NĐ-CP; Thông tư 18/2009/TT-BYT hướng dẫn tổ chức thực hiện công tác kiểm soát nhiễm khuẩn trong cơ sở khám bệnh, chữa bệnh.\u003c/li>\n\u003cli>\u003cb>Điều 1:\u003c/b> ban hành kèm theo các Hướng dẫn KSNK. Một số bản sao liệt kê 5 hướng dẫn, bản khác thêm hướng dẫn thứ 6 (vệ sinh môi trường bề mặt); văn bản vệ sinh môi trường bề mặt ghi rõ ban hành kèm Quyết định này. Danh sách: (1) giám sát NKBV; (2) KSNK tại khoa gây mê hồi sức; (3) phòng ngừa nhiễm khuẩn tiết niệu liên quan đặt thông tiểu; (4) xử lý dụng cụ phẫu thuật nội soi và ống nội soi mềm; (5) thực hành vệ sinh tay; (6) vệ sinh môi trường bề mặt.\u003c/li>\n\u003cli>\u003cb>Điều 2:\u003c/b> hiệu lực từ ngày ký. \u003cb>Điều 3:\u003c/b> trách nhiệm thi hành (Văn phòng Bộ, Thanh tra, các Vụ, Cục, Sở Y tế, bệnh viện, Y tế các Bộ, ngành). Công văn 6453/BYT-KCB (10/11/2017) yêu cầu các đơn vị lập kế hoạch triển khai, kiểm tra, giám sát và báo cáo.\u003c/li>\u003c/ul>\u003c/div>\n\u003ch2>Hướng dẫn thực hành vệ sinh tay\u003c/h2>\n\u003cdetails class=\"card\" open>\u003csummary>Thuật ngữ và bằng chứng\u003c/summary>\u003cul>\n\u003cli>\u003cb>Vệ sinh tay (VST)\u003c/b> gồm rửa tay (nước + xà phòng thường), rửa tay khử khuẩn (xà phòng khử khuẩn) và chà tay khử khuẩn (cồn, không dùng nước). Cồn VST thường chứa 60–90% ethanol hoặc isopropanol.\u003c/li>\n\u003cli>\u003cb>Vi khuẩn vãng lai:\u003c/b> ở bề mặt da, do tiếp xúc người bệnh và môi trường, là thủ phạm chính gây NKBV, loại bỏ dễ bằng VST thường quy (cồn 20–30 giây). \u003cb>Vi khuẩn định cư:\u003c/b> ở lớp sâu biểu bì, chỉ loại bỏ bằng VST ngoại khoa.\u003c/li>\n\u003cli>Semmelweis 1847: tử vong sản phụ giảm từ 18% xuống 5%. VST tốt giảm 30–50% NKBV. Tuân thủ VST ở NVYT thế giới 13–81% (trung bình 40,5%); Việt Nam 2005: 13,4%, những năm gần đây 30–40%.\u003c/li>\n\u003cli>Lạm dụng găng và dùng một đôi găng cho nhiều người bệnh là yếu tố quan trọng gây tuân thủ kém; găng không thay thế được VST. Chế phẩm chứa iodine, chlorhexidine kích ứng da nhiều hơn cồn.\u003c/li>\n\u003cli>Hiệu quả phụ thuộc kỹ thuật, thời gian, hóa chất; không đeo nhẫn, trang sức, móng giả, không để móng tay dài. Nước và xà phòng thường 30 giây giảm 1,8–2,8 log; cồn 30 giây giảm 3,5 log, 1 phút giảm 4–5 log.\u003c/li>\u003c/ul>\u003c/details>\n\u003cdetails class=\"card\">\u003csummary>Phương tiện, thời điểm, kỹ thuật thường quy (mục III.1–3)\u003c/summary>\u003cul>\n\u003cli>\u003cb>Hóa chất:\u003c/b> phải được Bộ Y tế cấp phép, có chất làm ẩm, dưỡng da; bình kín có bơm định lượng, có nhãn và hạn dùng; hạn chế xà phòng bánh (nếu dùng: bánh nhỏ, giá có nắp, có lỗ thoát nước). Bồn VST ngoại khoa rộng, thành cao, vòi tự động hoặc cần gạt; nước ngoại khoa vô khuẩn (nước máy hoặc RO khử khuẩn UV hoặc lọc siêu lọc); khăn ngoại khoa hấp tiệt khuẩn hoặc khăn giấy vô khuẩn.\u003c/li>\n\u003cli>\u003cb>Trang bị:\u003c/b> phương tiện VST sẵn có ở mọi buồng phẫu thuật, thủ thuật, khu chăm sóc, hành chính, tiếp đón, vệ sinh; cồn VST ở khu nguy cơ cao, giường người bệnh nặng, xe tiêm, xe thủ thuật; bồn rửa tay ở buồng thủ thuật, hành chính, người bệnh nặng, tiếp đón, vệ sinh.\u003c/li>\n\u003cli>\u003cb>5 thời điểm:\u003c/b> trước tiếp xúc người bệnh; trước thủ thuật sạch/vô khuẩn; sau tiếp xúc máu, dịch cơ thể; sau tiếp xúc người bệnh; sau tiếp xúc bề mặt đồ dùng trong buồng bệnh. Thêm: chuyển từ chăm sóc bẩn sang sạch trên cùng người bệnh; trước khi mang găng và sau khi tháo găng; trước khi vào và sau khi ra buồng bệnh; NVYT trong buồng mổ không chạm người bệnh phải VST trước khi vào, chạm bề mặt thiết bị thì chà cồn ngay; làm xét nghiệm tuân thủ thời điểm 3 và 5.\u003c/li>\n\u003cli>\u003cb>Kỹ thuật 6 bước, mỗi bước chà 5 lần, 20–30 giây, 3–5 ml:\u003c/b> lòng bàn tay; lòng bàn tay lên mu tay kia; kẽ ngón; mu ngón lên lòng bàn tay kia; ngón cái; đầu ngón tay. Tay có vết bẩn: nước và xà phòng thường; tay không bẩn, sau tháo găng, thăm khám giữa các người bệnh: chà cồn. Cồn chưa khô sau 6 bước thì lặp lại. Không rửa lại bằng nước sau chà cồn. Lau khô bằng khăn dùng một lần, đóng vòi bằng khăn vừa dùng; không dùng máy sấy tay.\u003c/li>\u003c/ul>\u003c/details>\n\u003cdetails class=\"card\">\u003csummary>VST ngoại khoa, găng tay, tác dụng phụ (mục III.4–6)\u003c/summary>\u003cul>\n\u003cli>\u003cb>Ai thực hiện:\u003c/b> phẫu thuật viên, phụ mổ, nhân viên gây mê tiếp xúc trực tiếp người bệnh. Chọn một trong hai phương pháp, không dùng đồng thời cả hai.\u003c/li>\n\u003cli>\u003cb>Chung:\u003c/b> không móng tay dài, tháo trang sức, mặc trang phục khu phẫu thuật; chà từ bàn tay đến khuỷu, tay luôn hướng lên; tối thiểu 3 phút với xà phòng chlorhexidine 4% hoặc cồn; không dùng bàn chải chà da, chỉ đánh kẽ móng bằng bàn chải hấp tiệt khuẩn ở ca đầu tiên trong ngày nếu thấy bẩn; không ngâm tay vào chậu cồn. Chỉ làm đầy đủ cho ca đầu tiên; ca sau thay găng và chà cồn, trừ khi tay dây bột talc, máu, dịch.\u003c/li>\n\u003cli>\u003cb>Phương pháp xà phòng khử khuẩn (PL 4):\u003c/b> đánh kẽ móng 30 giây; rửa lần 1 và lần 2 mỗi lần 1 phút 30 giây (tổng 3 phút chà); làm khô bằng khăn vô khuẩn; nếu không kiểm soát được nước, khăn thì chà cồn tối thiểu 1 phút.\u003c/li>\n\u003cli>\u003cb>Phương pháp cồn (PL 4):\u003c/b> rửa xà phòng thường 1 phút không bàn chải; chà cồn tối thiểu 3 phút, mỗi lần lấy 3–5 ml, nhúng 5 đầu ngón 5 giây rồi chà đến khuỷu.\u003c/li>\n\u003cli>\u003cb>Găng tay:\u003c/b> người bệnh không nhiễm trùng, tay lành: không mang găng khi khám bệnh, cho ăn, lấy mạch, nhiệt độ, huyết áp, thay đồ vải (trừ dính máu, dịch), tiêm bắp, trong da, dưới da, viết hồ sơ, vận chuyển, đi giữa các buồng. Không dùng một đôi găng cho nhiều người bệnh; không chà cồn ngoài găng để dùng lại. Nên chọn găng không bột talc.\u003c/li>\n\u003cli>\u003cb>Tác dụng phụ:\u003c/b> NVYT thông báo bằng văn bản tới khoa KSNK; mỗi chế phẩm mới đánh giá theo PL 5 (5 mức: không thấy, nhẹ, vừa, rõ, rất rõ); chế phẩm có tỷ lệ tác dụng phụ cao không được đưa vào sử dụng.\u003c/li>\u003c/ul>\u003c/details>\n\u003cdetails class=\"card\">\u003csummary>Đào tạo, giám sát, kế hoạch (mục III.7–9)\u003c/summary>\u003cul>\n\u003cli>\u003cb>Đào tạo:\u003c/b> hằng năm cho mọi NVYT (nhất là mới tuyển, học viên); hướng dẫn người bệnh, người nhà; treo quy trình tại mọi điểm VST; tổ chức tháng tăng cường VST hằng năm.\u003c/li>\n\u003cli>\u003cb>Giám sát:\u003c/b> phương tiện VST hằng quý; thời điểm và găng tối thiểu hằng tháng ở mọi khoa lâm sàng (phiếu PL 6; quan sát trực tiếp, camera, lượng hóa chất); kỹ thuật VST hằng quý; tác dụng phụ (PL 5); kiến thức, thái độ trước và sau tập huấn. Thông báo kết quả ngay sau giám sát; khoa KSNK tổng kết, báo cáo hằng tháng, quý tới Hội đồng KSNK, lãnh đạo.\u003c/li>\n\u003cli>\u003cb>Kế hoạch:\u003c/b> xây dựng hằng năm, Hội đồng KSNK và Giám đốc phê duyệt; sơ kết đánh giá hằng quý (PL 7); tổng kết hằng năm kèm khen thưởng, biện pháp hành chính.\u003c/li>\u003c/ul>\u003c/details>\n\u003ch2>Hướng dẫn vệ sinh môi trường bề mặt\u003c/h2>\n\u003cdetails class=\"card\">\u003csummary>Mục đích, nguy cơ, phân loại (mục I–III)\u003c/summary>\u003cul>\n\u003cli>Cụ thể hóa quy định tại Điều 6 và Điều 12 Thông tư 18/2009/TT-BYT; áp dụng mọi cơ sở KBCB công lập và ngoài công lập; chỉ môi trường bề mặt.\u003c/li>\n\u003cli>Vi sinh vật tồn tại lâu: bào tử C. difficile 4–5 tháng trên bề mặt khô; VRE, MRSA, Acinetobacter, Norovirus nhiều tuần. Bề mặt quanh người bệnh ô nhiễm nhiều hơn; lan truyền chủ yếu qua tay.\u003c/li>\n\u003cli>\u003cb>Theo mức ô nhiễm:\u003c/b> trắng (vô khuẩn cao: người bệnh nặng, suy giảm miễn dịch, khu phẫu thuật, nhà đẻ, buồng can thiệp mạch, khu đóng gói dụng cụ, pha chế dịch) làm sạch bằng tẩy rửa và khử khuẩn mức trung bình hoặc thấp; đỏ (nguy cơ cao: lọc máu, ICU, nhà vệ sinh, khu cách ly bệnh có khả năng gây dịch) cũng làm sạch bằng tẩy rửa và khử khuẩn mức trung bình hoặc thấp; vàng (trung bình: buồng bệnh, thủ thuật, nhà vệ sinh các đơn vị còn lại) chỉ tẩy rửa; xanh (thấp: hành chính, chờ, nhân viên, họp) chỉ tẩy rửa.\u003c/li>\n\u003cli>\u003cb>Theo mức tiếp xúc:\u003c/b> tiếp xúc thường xuyên (3 điểm: núm cửa, công tắc, thành giường, máy theo dõi, sàn, bồn rửa tay…) làm sạch ít nhất 1 lần/ngày (khu thông thường) và 2 lần/ngày (khu nguy cơ cao) và khi dây bẩn; ít tiếp xúc (1 điểm: tường, trần, gương, rèm…) định kỳ hằng tuần hoặc tháng 2 lần, và khi dây bẩn hoặc người bệnh ra viện.\u003c/li>\u003c/ul>\u003c/details>\n\u003cdetails class=\"card\">\u003csummary>Quy định chung và kỹ thuật (mục IV.1, IV.3)\u003c/summary>\u003cul>\n\u003cli>\u003cb>Phương tiện:\u003c/b> khăn ẩm sạch, xô sạch; riêng cho khu vô khuẩn cao, vệ sinh, cách ly; tốt nhất khăn dùng một lần. Hóa chất khử khuẩn phải được Bộ Y tế cấp phép lưu hành; hộp/can chứa dùng một lần, không bổ sung vào can đang dùng.\u003c/li>\n\u003cli>\u003cb>Trình tự:\u003c/b> từ ít ô nhiễm tới nhiều; từ ít tiếp xúc tới thường xuyên; từ cao xuống thấp; từ trong ra ngoài. Loại bỏ chất thải trước; không thu gom sắc nhọn bằng tay trần; không dùng chổi trong bệnh phòng, không bật quạt, không giũ khăn; không nhúng khăn bẩn vào dung dịch; khăn riêng từng khu và từng giường; thay dung dịch khi đục, bẩn hoặc sau xử lý máu dịch tràn.\u003c/li>\n\u003cli>\u003cb>Người thực hiện:\u003c/b> công ty vệ sinh công nghiệp hoặc hộ lý làm bề mặt thông thường; điều dưỡng làm bề mặt dụng cụ, thiết bị y tế; mọi người được đào tạo, cấp chứng nhận, mang phương tiện phòng hộ. Yêu cầu: bề mặt sạch khi quan sát, không bụi, vết bẩn, mùi khó chịu.\u003c/li>\n\u003cli>\u003cb>Kỹ thuật lau:\u003c/b> từ sạch đến bẩn, zích zắc, đường sau không trùng đường trước; mỗi khăn lau nhà khoảng 20 m², khăn lau bàn dùng một lần. Bề mặt khoa phòng 9 bước: khu không lây nhiễm lau lần 1 xà phòng, lần 2 nước sạch; khu lây nhiễm hoặc có dịch (H5N1, SARS) thêm lần 3 dung dịch khử khuẩn trước mỗi ca. Giường, bàn, ghế người bệnh lây nhiễm: lau bụi, cọ xà phòng, nước sạch, để khô rồi lau khử khuẩn, khử khuẩn khi người bệnh ra viện.\u003c/li>\n\u003cli>\u003cb>Nhà vệ sinh:\u003c/b> tối thiểu 2 lần (nhân viên) và 3 lần (công cộng, người bệnh); không trộn chất tẩy rửa vì sinh khí độc. \u003cb>Hành lang, cầu thang:\u003c/b> tối thiểu 2 lần/ngày, tay vịn lau khử khuẩn hằng ngày. \u003cb>Bồn rửa tay:\u003c/b> lau từ ngoài vào trong, bổ sung xà phòng, khăn giấy.\u003c/li>\n\u003cli>\u003cb>Máu, dịch tràn:\u003c/b> biển “Sàn ướt”, phủ khăn giấy, rưới hypochlorite 0,5–1% để 10 phút (tối thiểu 2 phút), lau, bỏ khăn vào túi chất thải lây nhiễm, lau lại bằng giẻ thấm dung dịch rồi khăn ẩm sạch.\u003c/li>\u003c/ul>\u003c/details>\n\u003cdetails class=\"card\">\u003csummary>Khu đặc biệt, giám sát, tổ chức, phụ lục (mục IV.2, IV.4, V–VI, PL)\u003c/summary>\u003cul>\n\u003cli>\u003cb>Khu phẫu thuật:\u003c/b> phương tiện riêng; trước ca đầu khử khuẩn đèn, thiết bị trên cao, bàn mổ, sàn; giữa 2 ca khử khuẩn vết máu, đèn, bàn mổ và vùng bán kính khoảng 1,5 m; sau ca cuối làm tường cao 2 m và sàn; khu ngoài buồng mổ 2 lần/ngày, cửa, kho, tủ hằng tuần, trần, quạt, điều hòa hằng tháng. Chất thải ra theo đường riêng.\u003c/li>\n\u003cli>\u003cb>Khu cách ly:\u003c/b> phương tiện riêng, tháo màn, đóng cửa buồng khi làm vệ sinh; bề mặt tiếp xúc và sàn 2 lần/ngày; tổng vệ sinh và phun khử khuẩn khi người bệnh ra viện hoặc tử vong.\u003c/li>\n\u003cli>\u003cb>Giám sát:\u003c/b> quan sát trực quan bằng bảng kiểm; máy đánh dấu phát sáng (đèn huỳnh quang, UV) làm đột xuất; nuôi cấy vi khuẩn không cần định kỳ, chỉ khuyến cáo cho khu nguy cơ cao (phòng mổ, ghép tạng) hoặc khi nghi dịch.\u003c/li>\n\u003cli>\u003cb>Trách nhiệm:\u003c/b> người quản lý cơ sở phân công, lập kế hoạch (cái gì, ở đâu, khi nào, bằng cách nào, ai làm), cung cấp phương tiện, hóa chất, phòng hộ, cho nhân viên đi đào tạo; Hội đồng KSNK xây dựng chính sách; khoa KSNK xây dựng hướng dẫn, quy trình và giám sát; trưởng đơn vị vệ sinh do Ban Giám đốc bổ nhiệm; nhân viên vệ sinh có chứng nhận đào tạo, biết phân vùng nguy cơ; nhân viên bảo dưỡng; nhân viên kiểm soát chất lượng. 100% nhân viên VSMT có chứng nhận đào tạo; dự toán ngân sách hằng năm.\u003c/li>\n\u003cli>\u003cb>PL 1 (ma trận điểm):\u003c/b> 7 điểm (nguy cơ cao): làm sạch sau mỗi ca/thủ thuật và ít nhất 2 lần/ngày; 4–6 điểm: ít nhất 1 lần/ngày; 2–3 điểm: theo lịch cố định; luôn bổ sung khi tràn chất thải. \u003cb>PL 2 (chlorin):\u003c/b> 1% khi đổ tràn máu, dịch ở người nghi hoặc mắc bệnh truyền nhiễm có nguy cơ gây dịch; 0,5% khi đổ tràn máu, dịch; 0,05% lau khử khuẩn bề mặt thông thường; pha 1:100 từ sodium hypochlorite 5% cho 0,05% (500 ppm); chỉ pha bằng nước lạnh, pha mỗi ngày, dán tên, ngày, bỏ sau 24 giờ; làm sạch chất hữu cơ trước khi khử khuẩn; thời gian tiếp xúc bề mặt ≥ 10 phút, ngâm dụng cụ 30 phút. \u003cb>PL 3 (phòng mổ):\u003c/b> phòng thường: trống dưới 35 vi khuẩn/m³, đang mổ dưới 180/m³; phòng siêu sạch: dưới 1/m³ (trống, cách sàn 1 m), dưới 10/m³ (đang mổ, ngang bàn mổ).\u003c/li>\u003c/ul>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"quiz\" class=\"hide\">\n\u003cdiv class=\"bar\">\u003ci id=\"pb\">\u003c/i>\u003c/div>\n\u003cdiv class=\"sub\" id=\"pg\">\u003c/div>\n\u003cdiv class=\"card\" id=\"box\">\u003c/div>\n\u003cdiv id=\"res\" class=\"card hide\">\u003c/div>\n\u003c/section>\n\n\u003cfooter>Nguồn: Quyết định 3916/QĐ-BYT và các Hướng dẫn kèm theo (Bộ Y tế). Nội dung tóm tắt chỉ phục vụ ôn tập, không thay thế văn bản gốc.\u003c/footer>\n\u003c/main>\n\u003cscript>\nvar Q=[\n[\"Quyết định 3916/QĐ-BYT được ban hành ngày:\", [\"28/08/2017\", \"14/10/2009\", \"27/09/2012\", \"20/07/2018\"], 0, \"QĐ Điều 1.\"],\n[\"Quyết định 3916/QĐ-BYT có hiệu lực:\", [\"Kể từ ngày ký, ban hành\", \"Từ 01/01/2018\", \"Sau 6 tháng kể từ ngày ký\", \"Từ ngày công bố trên Công báo\"], 0, \"QĐ Điều 2.\"],\n[\"Quyết định 3916/QĐ-BYT căn cứ trực tiếp vào văn bản hướng dẫn công tác kiểm soát nhiễm khuẩn nào?\", [\"Thông tư 18/2009/TT-BYT\", \"Thông tư 16/2018/TT-BYT\", \"Thông tư 20/2021/TT-BYT\", \"Quyết định 3671/QĐ-BYT\"], 0, \"QĐ (phần căn cứ).\"],\n[\"Quyết định 3916/QĐ-BYT được ký bởi:\", [\"Thứ trưởng Nguyễn Viết Tiến (KT. Bộ trưởng)\", \"Bộ trưởng Bộ Y tế\", \"Cục trưởng Cục Quản lý Khám, chữa bệnh\", \"Giám đốc Sở Y tế\"], 0, \"QĐ (phần ký).\"],\n[\"Nội dung Điều 1 Quyết định 3916 là:\", [\"Ban hành kèm theo các Hướng dẫn kiểm soát nhiễm khuẩn trong cơ sở khám bệnh, chữa bệnh\", \"Quy định tổ chức khoa Kiểm soát nhiễm khuẩn\", \"Ban hành danh mục kỹ thuật\", \"Quy định chế độ báo cáo nhiễm khuẩn bệnh viện\"], 0, \"QĐ Điều 1.\"],\n[\"Theo Hướng dẫn thực hành vệ sinh tay, phổ vi khuẩn là thủ phạm chính gây nhiễm khuẩn bệnh viện là:\", [\"Vi khuẩn vãng lai\", \"Vi khuẩn định cư\", \"Vi khuẩn kỵ khí\", \"Nấm men\"], 0, \"VST II.1.\"],\n[\"Vi khuẩn định cư trên tay được loại bỏ bằng:\", [\"Vệ sinh tay ngoại khoa\", \"Vệ sinh tay thường quy\", \"Chỉ rửa bằng xà phòng thường\", \"Mang găng tay\"], 0, \"VST II.1.\"],\n[\"Thực hiện tốt vệ sinh tay làm giảm nhiễm khuẩn bệnh viện:\", [\"30% – 50%\", \"5% – 10%\", \"60% – 80%\", \"Trên 90%\"], 0, \"VST II.3.\"],\n[\"Thời gian chà tay với hóa chất trong vệ sinh tay thường quy là:\", [\"20 giây – 30 giây\", \"5 giây – 10 giây\", \"40 giây – 60 giây\", \"Tối thiểu 3 phút\"], 0, \"VST III.3.\"],\n[\"Lượng dung dịch vệ sinh tay mỗi lần thường quy:\", [\"3 ml – 5 ml\", \"1 ml – 2 ml\", \"6 ml – 8 ml\", \"10 ml\"], 0, \"VST III.3.\"],\n[\"Nồng độ cồn có hiệu lực kháng khuẩn tốt nhất trong dung dịch vệ sinh tay:\", [\"60% – 90%\", \"30% – 40%\", \"50% – 55%\", \"Trên 95%\"], 0, \"VST Phụ lục 1 (mục 2).\"],\n[\"Kỹ thuật vệ sinh tay thường quy gồm:\", [\"6 bước, mỗi bước chà 5 lần\", \"5 bước, mỗi bước chà 3 lần\", \"6 bước, mỗi bước chà 10 lần\", \"8 bước, mỗi bước chà 5 lần\"], 0, \"VST III.3.\"],\n[\"Khi bàn tay nhìn rõ vết bẩn hoặc dính dịch tiết, phải:\", [\"Rửa tay bằng nước và xà phòng thường\", \"Chà tay bằng dung dịch chứa cồn\", \"Mang găng rồi chà cồn ngoài găng\", \"Lau bằng khăn ẩm\"], 0, \"VST III.3.\"],\n[\"Sau khi đã chà tay bằng dung dịch vệ sinh tay chứa cồn:\", [\"Không rửa lại tay bằng nước và xà phòng\", \"Phải rửa lại bằng xà phòng khử khuẩn\", \"Phải sấy khô tay bằng máy\", \"Phải lau tay bằng khăn ướt\"], 0, \"VST III.3.\"],\n[\"Thời điểm nào KHÔNG thuộc 5 thời điểm vệ sinh tay thường quy chính?\", [\"Trước khi mang găng và sau khi tháo găng\", \"Trước khi tiếp xúc trực tiếp với mỗi người bệnh\", \"Ngay sau khi tiếp xúc với máu, dịch cơ thể\", \"Sau khi tiếp xúc với bề mặt đồ dùng trong buồng bệnh\"], 0, \"VST III.2.\"],\n[\"Bình cấp hóa chất vệ sinh tay phải:\", [\"Kín, có bơm định lượng hoặc cần gạt, có nhãn ghi loại dung dịch và hạn sử dụng\", \"Mở nắp để dễ lấy\", \"Dùng chung cho mọi loại hóa chất\", \"Không cần nhãn\"], 0, \"VST III.1.1.\"],\n[\"Làm khô tay sau vệ sinh tay:\", [\"Không sử dụng máy sấy tay\", \"Nên dùng máy sấy tay\", \"Để khô tự nhiên không dùng khăn\", \"Dùng chung một khăn cho nhiều lần rửa\"], 0, \"VST III.3.\"],\n[\"Vệ sinh tay ngoại khoa với dung dịch xà phòng khử khuẩn chlorhexidine 4% hoặc dung dịch cồn tối thiểu:\", [\"3 phút\", \"30 giây\", \"1 phút\", \"10 phút\"], 0, \"VST III.4.\"],\n[\"Vệ sinh tay ngoại khoa:\", [\"Chọn một trong hai phương pháp, không áp dụng đồng thời cả hai\", \"Phải làm cả hai phương pháp liên tiếp\", \"Chỉ dùng xà phòng thường\", \"Chỉ dùng bàn chải đánh toàn bộ cẳng tay\"], 0, \"VST III.4.\"],\n[\"Trong vệ sinh tay ngoại khoa, bàn chải vô khuẩn chỉ được dùng để:\", [\"Đánh kẽ móng tay khi thấy rõ vết bẩn, với ca phẫu thuật đầu tiên trong ngày\", \"Chà toàn bộ da bàn tay đến khuỷu tay\", \"Chà da trước mỗi ca mổ\", \"Rửa cẳng tay sau ca mổ\"], 0, \"VST III.4.\"],\n[\"Với các ca phẫu thuật kế tiếp tại cùng khu phẫu thuật (tay không dây bẩn nhìn thấy):\", [\"Chỉ cần thay găng và chà tay bằng dung dịch chứa cồn theo quy trình\", \"Phải rửa tay ngoại khoa đầy đủ lại\", \"Không cần vệ sinh tay\", \"Chỉ cần rửa tay thường quy\"], 0, \"VST III.4.\"],\n[\"Khử khuẩn tay ngoại khoa bằng cách:\", [\"Không ngâm tay vào chậu dung dịch cồn; chỉ dùng cồn từ bình có bơm định lượng\", \"Ngâm tay vào chậu cồn 1 phút\", \"Chấm cồn bằng bông\", \"Dùng cồn pha loãng tự chế\"], 0, \"VST III.4.\"],\n[\"Phương pháp xà phòng khử khuẩn (Phụ lục 4): đánh kẽ móng tay, rồi rửa tay lần 1 và lần 2, mỗi lần:\", [\"1 phút 30 giây\", \"30 giây\", \"1 phút\", \"3 phút\"], 0, \"VST Phụ lục 4.\"],\n[\"Phương pháp cồn (Phụ lục 4) gồm:\", [\"Rửa xà phòng thường 1 phút không dùng bàn chải, rồi chà cồn tối thiểu 3 phút\", \"Chà cồn 30 giây rồi rửa xà phòng\", \"Rửa xà phòng khử khuẩn 3 phút\", \"Chỉ chà cồn 1 phút\"], 0, \"VST Phụ lục 4.\"],\n[\"Thực hành nào, với người bệnh không nhiễm trùng và tay lành, NVYT không được mang găng?\", [\"Lấy mạch, nhiệt độ, huyết áp\", \"Thu gom đồ vải dính máu\", \"Xử lý đổ tràn máu\", \"Tiếp xúc trực tiếp với dịch cơ thể\"], 0, \"VST III.5.\"],\n[\"Về sử dụng găng tay:\", [\"Không dùng một đôi găng cho nhiều người bệnh và không chà cồn ngoài găng để dùng lại\", \"Được chà cồn ngoài găng để dùng tiếp\", \"Một đôi găng dùng cả buồng bệnh\", \"Găng thay thế hoàn toàn vệ sinh tay\"], 0, \"VST III.5.\"],\n[\"NVYT bị khô da, kích ứng do hóa chất vệ sinh tay cần:\", [\"Thông báo bằng văn bản tới khoa Kiểm soát nhiễm khuẩn\", \"Tự ngừng vệ sinh tay\", \"Chỉ dùng xà phòng bánh\", \"Báo cho phòng hành chính\"], 0, \"VST III.6.\"],\n[\"Giám sát tuân thủ thời điểm vệ sinh tay và sử dụng găng được thực hiện tối thiểu:\", [\"Hằng tháng ở mọi khoa lâm sàng\", \"Hằng năm\", \"Hằng quý ở khoa hồi sức\", \"Hai năm một lần\"], 0, \"VST III.8.\"],\n[\"Giám sát phương tiện vệ sinh tay được thực hiện định kỳ:\", [\"Hằng quý và khi cần\", \"Hằng ngày\", \"Hằng tuần\", \"Hằng năm\"], 0, \"VST III.8.\"],\n[\"Kế hoạch triển khai chương trình vệ sinh tay hằng năm do ai phê duyệt?\", [\"Hội đồng KSNK và Giám đốc\", \"Chỉ trưởng khoa KSNK\", \"Sở Y tế\", \"Cục Quản lý Khám, chữa bệnh\"], 0, \"VST III.9.\"],\n[\"Hướng dẫn vệ sinh môi trường bề mặt chỉ đề cập:\", [\"Môi trường bề mặt; không đề cập không khí, nước\", \"Cả bề mặt, không khí và nước\", \"Chỉ môi trường không khí\", \"Chỉ môi trường nước\"], 0, \"VSMT I.\"],\n[\"Khu vực yêu cầu vô khuẩn cao (khu phẫu thuật, nhà đẻ…) ký hiệu màu:\", [\"Trắng\", \"Đỏ\", \"Vàng\", \"Xanh\"], 0, \"VSMT III.2.1.\"],\n[\"Khu vực nguy cơ ô nhiễm cao (lọc máu, ICU, nhà vệ sinh, khu cách ly) ký hiệu màu:\", [\"Đỏ\", \"Trắng\", \"Vàng\", \"Xanh\"], 0, \"VSMT III.2.1.\"],\n[\"Khu vực nguy cơ ô nhiễm trung bình ký hiệu màu:\", [\"Vàng\", \"Đỏ\", \"Xanh\", \"Trắng\"], 0, \"VSMT III.2.1.\"],\n[\"Khu vực nguy cơ ô nhiễm thấp (buồng hành chính, chờ, họp) chỉ cần:\", [\"Làm sạch bằng hóa chất tẩy rửa\", \"Khử khuẩn mức độ trung bình\", \"Khử khuẩn mức độ cao\", \"Phun khử khuẩn hằng ngày\"], 0, \"VSMT III.2.1.\"],\n[\"Bề mặt tiếp xúc thường xuyên và ít tiếp xúc được tính điểm lần lượt:\", [\"3 điểm và 1 điểm\", \"1 điểm và 3 điểm\", \"2 điểm và 1 điểm\", \"5 điểm và 2 điểm\"], 0, \"VSMT III.2.2.\"],\n[\"Tần suất làm sạch bề mặt tiếp xúc thường xuyên:\", [\"Ít nhất 1 lần/ngày (khu thông thường); 2 lần/ngày (khu nguy cơ cao)\", \"1 lần/tuần\", \"1 lần/tháng\", \"3 lần/ngày ở mọi khu\"], 0, \"VSMT IV.1.5.\"],\n[\"Trình tự làm sạch bề mặt:\", [\"Từ ít ô nhiễm tới nhiều; từ ít tiếp xúc tới tiếp xúc thường xuyên; từ cao xuống thấp; từ trong ra ngoài\", \"Từ bẩn tới sạch\", \"Từ thấp lên cao\", \"Từ ngoài vào trong\"], 0, \"VSMT IV.1.3.\"],\n[\"Để giảm khuếch tán bụi khi làm vệ sinh:\", [\"Không dùng chổi trong buồng bệnh, không bật quạt, không giũ, lắc khăn\", \"Dùng chổi quét khô\", \"Bật quạt để nhanh khô\", \"Giũ khăn trước khi lau\"], 0, \"VSMT IV.1.4.\"],\n[\"Mỗi tải, khăn lau nhà chỉ lau trong diện tích khoảng:\", [\"20 m²\", \"5 m²\", \"50 m²\", \"100 m²\"], 0, \"VSMT IV.3.2.\"],\n[\"Phương tiện lưu giữ hóa chất làm sạch, khử khuẩn:\", [\"Dùng hộp/can một lần; không bổ sung hóa chất vào can đã hết hoặc đang dùng\", \"Đổ thêm vào can cũ\", \"Dùng chung một can cho mọi khu\", \"Pha sẵn cho cả tuần\"], 0, \"VSMT IV.1.2.\"],\n[\"Tại khu phẫu thuật, giữa 2 ca mổ phải khử khuẩn bàn mổ và vùng quanh bàn mổ bán kính khoảng:\", [\"1,5 m\", \"0,5 m\", \"3 m\", \"5 m\"], 0, \"VSMT IV.2.1.\"],\n[\"Sau ca phẫu thuật cuối cùng trong ngày, làm sạch bề mặt tường cao:\", [\"2 m\", \"0,5 m\", \"1 m\", \"4 m\"], 0, \"VSMT IV.2.1.\"],\n[\"Khu cách ly được làm vệ sinh bề mặt tiếp xúc, sàn nhà:\", [\"2 lần/ngày và ngay khi dây bẩn; tổng vệ sinh khi người bệnh ra viện hoặc tử vong\", \"1 lần/tuần\", \"1 lần/ngày\", \"Chỉ khi có dịch\"], 0, \"VSMT IV.2.2.\"],\n[\"Vệ sinh khu vực lây nhiễm hoặc khi có dịch cúm H5N1, SARS: lau lần 3 bằng:\", [\"Dung dịch khử khuẩn đã pha đúng quy định\", \"Nước sạch\", \"Xà phòng\", \"Nước nóng\"], 0, \"VSMT IV.3.3.1.\"],\n[\"Xử lý đổ tràn máu, dịch cơ thể: phủ khăn giấy rồi rưới dung dịch hypochlorite:\", [\"0,5% – 1%, để 10 phút (tối thiểu 2 phút)\", \"0,05%, để 1 phút\", \"5%, để 30 giây\", \"2%, để 1 giờ\"], 0, \"VSMT IV.3.3.7.\"],\n[\"Nồng độ chlorin dùng lau khử khuẩn bề mặt thông thường:\", [\"0,05%\", \"0,5%\", \"1%\", \"5%\"], 0, \"VSMT PL 2.\"],\n[\"Dung dịch chlorin pha đã quá bao lâu thì phải đổ bỏ?\", [\"24 giờ\", \"1 giờ\", \"6 giờ\", \"72 giờ\"], 0, \"VSMT PL 2.\"],\n[\"Pha dung dịch chlorin phải dùng:\", [\"Nước lạnh\", \"Nước nóng\", \"Nước sôi để nguội 1 giờ\", \"Dung dịch tẩy rửa axit\"], 0, \"VSMT PL 2.\"],\n[\"Vệ sinh nhà vệ sinh: tối thiểu mấy lần/ngày?\", [\"2 lần với nhà vệ sinh nhân viên và 3 lần với nhà vệ sinh công cộng/người bệnh\", \"1 lần cho mọi loại\", \"Chỉ khi bẩn\", \"4 lần cho nhân viên\"], 0, \"VSMT IV.3.3.5.\"],\n[\"Tiêu chuẩn vi khuẩn buồng phẫu thuật thường (phòng mổ trống):\", [\"Dưới 35/m³\", \"Dưới 1/m³\", \"Dưới 180/m³\", \"Dưới 10/m³\"], 0, \"VSMT PL 3.\"],\n[\"Ma trận phân tầng nguy cơ: tổng 7 điểm (nguy cơ cao) làm sạch:\", [\"Sau mỗi ca bệnh/thủ thuật và ít nhất 2 lần/ngày\", \"Theo lịch cố định\", \"1 lần/tuần\", \"Chỉ khi yêu cầu\"], 0, \"VSMT PL 1.\"],\n[\"Trách nhiệm xây dựng hướng dẫn, quy trình VSMT và trực tiếp giám sát thuộc về:\", [\"Khoa Kiểm soát nhiễm khuẩn\", \"Phòng Hành chính\", \"Công ty vệ sinh\", \"Nhân
