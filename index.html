g:10px 12px;border-radius:8px;margin:10px 0;font-size:.95rem}\n.tw{overflow-x:auto}\ntable{border-collapse:collapse;width:100%;min-width:480px;font-size:.95rem}\nth,td{border:1px solid var(--bd);padding:7px 9px;text-align:left}th{background:var(--ac2)}\n.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}\n.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}\n.q{font-weight:600;margin:6px 0 10px}\n.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}\n.opt:hover:not(:disabled){border-color:var(--ac)}\n.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}\n.ex{margin-top:10px;font-size:.95rem;color:var(--mu)}\n.btn{padding:10px 18px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:10px}\n.hide{display:none}\n.score{font-size:2rem;font-weight:700;color:var(--ac)}\nfooter{color:var(--mu);font-size:.85rem;margin:24px 0}\n\u003c/style>\n\u003cstyle id=\"x-layout\">\nhtml{-webkit-text-size-adjust:100%}\nmain{padding:12px 12px 28px}\nh1{font-size:1.4rem}\n.tabs{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 0 8px;padding:8px 0}\n.opt{padding:13px 14px;min-height:48px;line-height:1.45}\n.btn{min-height:46px}\n.card{overflow-wrap:anywhere}\n@media(max-width:640px){\n table{min-width:0;font-size:.9rem}th,td{padding:6px 7px}\n #box .btn,#res .btn{width:100%}\n .tabs button{padding:9px 6px;font-size:.92rem}\n}\n@media(min-width:800px){\n main{max-width:1100px;padding:20px 28px 40px}\n h1{font-size:1.8rem}\n #sum{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;align-items:start}\n #sum>*{grid-column:1/-1;margin-top:0;margin-bottom:0}\n #sum>details.card{grid-column:auto}\n #sum>h2{margin-top:.6em}\n #quiz{max-width:900px;margin:0 auto}\n #box{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}\n #box>.q,#box>#ex,#box>.btn,#box>select.opt{grid-column:1/-1}\n #box>.btn{justify-self:start}\n #box .opt{margin:0}\n}\n@media(min-width:1080px){\n main{max-width:1760px;padding:20px 32px 40px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(380px,.9fr);column-gap:32px;align-content:start}\n main>h1,main>.sub,main>footer{grid-column:1/-1}\n .tabs{display:none}\n #sum,#sum.hide{display:grid!important;grid-column:1;grid-template-columns:1fr}\n #quiz,#quiz.hide{display:block!important;grid-column:2;position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;max-width:none;margin:0}\n #box{grid-template-columns:1fr}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003ch1>Thông tư 16/2018/TT-BYT\u003c/h1>\n\u003cp class=\"sub\">Quy định về kiểm soát nhiễm khuẩn trong các cơ sở khám bệnh, chữa bệnh · Ban hành 20/7/2018 · Hiệu lực 01/10/2018 · 4 chương, 25 điều · Thay thế Thông tư 18/2009/TT-BYT\u003c/p>\n\u003cdiv class=\"tabs\">\u003cbutton id=\"t1\" class=\"on\">📘 Tóm tắt\u003c/button>\u003cbutton id=\"t2\">📝 Trắc nghiệm (127 câu · xáo trộn)\u003c/button>\u003c/div>\n\n\u003csection id=\"sum\">\n\u003cdiv class=\"note\">Trang tra cứu văn bản ghi ngày hết hiệu lực là “đang cập nhật”; tôi chưa xác nhận được tình trạng hiệu lực mới nhất, hãy đối chiếu bản hiện hành. Thông tư này không có phụ lục. Các mốc đào tạo ở Điều 24 là điều khoản chuyển tiếp đã đến hạn.\u003c/div>\n\n\u003ch2>Nhớ nhanh\u003c/h2>\n\u003cdiv class=\"card tw\">\u003ctable>\n\u003ctr>\u003cth>Nội dung\u003c/th>\u003cth>Quy định\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Hệ thống KSNK (Đ16)\u003c/td>\u003ctd>Hội đồng KSNK; khoa hoặc bộ phận KSNK; mạng lưới KSNK\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Từ 150 giường kế hoạch\u003c/td>\u003ctd>Tổ chức đủ cả 3 thành phần\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Dưới 150 giường\u003c/td>\u003ctd>Bộ phận KSNK thuộc phòng kế hoạch tổng hợp + mạng lưới + người phụ trách toàn thời gian (khối ngành sức khỏe, có chứng chỉ KSNK)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Không giường nội trú\u003c/td>\u003ctd>Phân công 1 người phụ trách KSNK\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hội đồng KSNK (Đ17)\u003c/td>\u003ctd>Giám đốc quyết định thành lập; Chủ tịch là Giám đốc; thư ký là trưởng khoa KSNK hoặc người phụ trách KSNK\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Mạng lưới (Đ19)\u003c/td>\u003ctd>Mỗi khoa ít nhất 1 bác sĩ và 1 điều dưỡng/hộ sinh/kỹ thuật y kiêm nhiệm\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Trưởng khoa, ĐD trưởng khoa KSNK\u003c/td>\u003ctd>Đại học trở lên, khối ngành sức khỏe, có chứng chỉ KSNK, toàn thời gian\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Nhân viên giám sát (Đ22)\u003c/td>\u003ctd>Cao đẳng trở lên; 1 người trên mỗi 150 giường (dưới 150 giường: ít nhất 1)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Chuyển tiếp (Đ24)\u003c/td>\u003ctd>Lãnh đạo khoa KSNK, người phụ trách &lt;150 giường: 03 tháng, trước 01/01/2021 · Không giường nội trú: 05 ngày, trước 01/01/2021 · Giám sát, khử khuẩn tiệt khuẩn: 03 tháng, trước 01/01/2022 · Hội đồng, mạng lưới: 05 ngày, trước 01/01/2022 · Sở Y tế: 01 tháng, trước 01/01/2021\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hiệu lực\u003c/td>\u003ctd>01/10/2018; thay Thông tư 18/2009/TT-BYT\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\n\u003ch2>Nội dung theo chương\u003c/h2>\n\u003cdetails class=\"card\" open>\u003csummary>Chương I – Quy định chung (Điều 1–2)\u003c/summary>\u003cul>\n\u003cli>\u003cb>Phạm vi:\u003c/b> biện pháp phòng ngừa, KSNK; hệ thống KSNK; trách nhiệm thực hiện trong cơ sở KBCB của Nhà nước và tư nhân.\u003c/li>\n\u003cli>\u003cb>NKBV:\u003c/b> nhiễm khuẩn xảy ra trong quá trình người bệnh được chăm sóc, điều trị tại cơ sở KBCB.\u003c/li>\n\u003cli>\u003cb>Giám sát NKBV:\u003c/b> thu thập, phân tích, diễn giải dữ liệu một cách hệ thống, liên tục và thông báo kịp thời tới người liên quan.\u003c/li>\n\u003cli>\u003cb>KSNK:\u003c/b> xây dựng, triển khai, giám sát thực hiện quy định, hướng dẫn, quy trình để giảm nguy cơ lây nhiễm cho người bệnh, nhân viên y tế và cộng đồng.\u003c/li>\n\u003cli>\u003cb>Phòng ngừa chuẩn:\u003c/b> áp dụng cho mọi người bệnh, không phụ thuộc chẩn đoán, tình trạng nhiễm trùng, thời điểm khám; coi máu, chất tiết, chất bài tiết đều có nguy cơ lây truyền.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Chương II – 13 biện pháp KSNK (Điều 3–15)\u003c/summary>\u003cul>\n\u003cli>\u003cb>Điều 3:\u003c/b> xây dựng, phê duyệt, phổ biến quy định, quy trình; xây dựng kế hoạch KSNK dựa trên kế hoạch hành động quốc gia, mục tiêu chất lượng, phù hợp nguồn lực, theo từng giai đoạn.\u003c/li>\n\u003cli>\u003cb>Điều 4 – Giám sát NKBV và bệnh truyền nhiễm có nguy cơ gây dịch:\u003c/b> giám sát, phát hiện, báo cáo, quản lý dữ liệu NKBV, vi khuẩn kháng kháng sinh, ca mắc hoặc nghi mắc; can thiệp kịp thời, dùng kháng sinh hợp lý.\u003c/li>\n\u003cli>\u003cb>Điều 5 – Giám sát tuân thủ thực hành KSNK:\u003c/b> đặc biệt khi phẫu thuật, thủ thuật, kỹ thuật xâm lấn; đối tượng: nhân viên y tế, học viên, người bệnh, người nhà, khách thăm; hướng dẫn, nhắc nhở.\u003c/li>\n\u003cli>\u003cb>Điều 6 – Vệ sinh tay:\u003c/b> trang bị sẵn phương tiện, hóa chất tại vị trí khám, điều trị, chăm sóc và nơi nhiều người tiếp xúc; kiểm tra, giám sát tuân thủ.\u003c/li>\n\u003cli>\u003cb>Điều 7:\u003c/b> phòng ngừa chuẩn, phòng ngừa theo đường lây, phương tiện phòng hộ cá nhân; cách ly phòng ngừa với người mắc hoặc nghi mắc bệnh truyền nhiễm và người nhiễm vi khuẩn đa kháng; hướng dẫn, nhắc nhở, kiểm tra.\u003c/li>\n\u003cli>\u003cb>Điều 8 – Dụng cụ y tế:\u003c/b> xử lý tập trung, kiểm soát tái sử dụng; bảo quản vô khuẩn sau xử lý; kiểm tra, giám sát tại khoa, phòng.\u003c/li>\n\u003cli>\u003cb>Điều 9 – Đồ vải:\u003c/b> cung cấp hằng ngày và khi cần; xử lý tập trung tại khu giặt là, đồ vải nhiễm khuẩn, có máu, dịch tiết xử lý riêng; bảo quản trong tủ, kệ sạch, vô khuẩn, vận chuyển riêng bằng phương tiện chuyên dụng; kiểm soát chất lượng; nhân viên có kiến thức chuyên môn; bố trí nơi giặt, sấy, phơi cho người nhà.\u003c/li>\n\u003cli>\u003cb>Điều 10 – Chất thải:\u003c/b> theo pháp luật; kiểm tra phân loại, lưu giữ, vận chuyển, xử lý.\u003c/li>\n\u003cli>\u003cb>Điều 11 – Vệ sinh môi trường:\u003c/b> chất lượng nước, bề mặt, không khí từng khu vực theo quy định Bộ Y tế và quy chuẩn; đủ nhà vệ sinh; diệt chuột, côn trùng định kỳ; người làm vệ sinh môi trường có kiến thức.\u003c/li>\n\u003cli>\u003cb>Điều 12 – An toàn thực phẩm:\u003c/b> kiểm tra vi sinh vật; giám sát, báo cáo nhiễm khuẩn liên quan thực phẩm; phối hợp cơ quan quản lý an toàn thực phẩm tuyên truyền.\u003c/li>\n\u003cli>\u003cb>Điều 13 – Phơi nhiễm:\u003c/b> hệ thống quản lý, giám sát, xử trí, báo cáo tai nạn rủi ro nghề nghiệp; tiêm vắc xin (viêm gan B, cúm, lao…) cho nhân viên có nguy cơ; danh mục, bảo đảm sẵn có thuốc, vắc xin, sinh phẩm dự phòng.\u003c/li>\n\u003cli>\u003cb>Điều 14 – Phòng chống dịch:\u003c/b> kế hoạch ứng phó, phối hợp y tế dự phòng; chuẩn bị cơ sở vật chất, trang thiết bị, thuốc, hóa chất, vật tư, nhân lực; tập huấn; thông tin, báo cáo, khai báo bệnh truyền nhiễm.\u003c/li>\n\u003cli>\u003cb>Điều 15 – Hóa chất, vật tư KSNK:\u003c/b> xây dựng định mức, kiểm tra chất lượng, quản lý sử dụng an toàn, tiết kiệm, hiệu quả.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Chương III – Hệ thống KSNK (Điều 16–22)\u003c/summary>\u003cul>\n\u003cli>\u003cb>Điều 16:\u003c/b> hệ thống KSNK (Hội đồng, khoa/bộ phận, mạng lưới); quy mô như bảng nhớ nhanh.\u003c/li>\n\u003cli>\u003cb>Hội đồng (Đ17):\u003c/b> Giám đốc quyết định thành lập và làm Chủ tịch; thư ký là trưởng khoa KSNK hoặc người phụ trách; thành viên là đại diện lãnh đạo khoa lâm sàng, cận lâm sàng, phòng chức năng (tối thiểu: phòng chức năng, khoa vi sinh/xét nghiệm, khoa dược, một số khoa lâm sàng nguy cơ NKBV cao). Nhiệm vụ: tư vấn Giám đốc về KSNK và sửa chữa, thiết kế, xây dựng công trình; tham gia giám sát, đào tạo, nghiên cứu; xem xét, đánh giá, định hướng.\u003c/li>\n\u003cli>\u003cb>Khoa/bộ phận KSNK (Đ18):\u003c/b> khoa gồm các bộ phận giám sát, khử khuẩn tiệt khuẩn, quản lý đồ vải, vệ sinh môi trường (tối thiểu có bộ phận giám sát); bộ phận KSNK có trưởng bộ phận là người phụ trách (Giám đốc phân công bằng văn bản). Nhiệm vụ: đầu mối tham mưu; tổ chức/phối hợp triển khai, kiểm tra, giám sát; mô tả công việc; định mức, tiêu chuẩn kỹ thuật, đề xuất mua sắm; chỉ đạo mạng lưới; đào tạo, truyền thông; nghiên cứu, hợp tác quốc tế, chỉ đạo tuyến.\u003c/li>\n\u003cli>\u003cb>Mạng lưới (Đ19):\u003c/b> Giám đốc quyết định thành lập; đại diện khoa lâm sàng, cận lâm sàng; nhiệm vụ: tham gia tổ chức thực hiện, hướng dẫn, kiểm tra, giám sát tại khoa; báo cáo định kỳ và đột xuất cho lãnh đạo khoa và trưởng khoa KSNK.\u003c/li>\n\u003cli>\u003cb>Trưởng khoa/bộ phận (Đ20):\u003c/b> tham mưu Giám đốc; tổ chức thực hiện và chịu trách nhiệm; tổng kết, báo cáo toàn cơ sở; quyền hạn chung của trưởng khoa, kiểm tra và yêu cầu thực hiện đúng quy định, đề xuất khen thưởng, kỷ luật. Người phụ trách ở cơ sở &lt;150 giường: như trưởng khoa (trừ quyền hạn chung); không giường nội trú: triển khai, kiểm tra, giám sát phù hợp phạm vi chuyên môn.\u003c/li>\n\u003cli>\u003cb>ĐD trưởng khoa (Đ21):\u003c/b> lập kế hoạch quản lý, sử dụng trang thiết bị, vật tư, hóa chất; tham gia xây dựng hướng dẫn, kiểm tra, giám sát; quyền hạn như điều dưỡng trưởng khoa khác và được kiểm tra, giám sát KSNK tại các khoa, phòng.\u003c/li>\n\u003cli>\u003cb>Bộ phận giám sát (Đ22):\u003c/b> chuyên trách kiểm tra, giám sát; nhân viên cao đẳng trở lên, khối ngành sức khỏe, có chứng chỉ giám sát KSNK; 1 người/150 giường (dưới 150: ít nhất 1; không giường nội trú: người phụ trách làm). Nhiệm vụ: giám sát NKBV, tuân thủ theo Đ4, Đ5; giám sát môi trường, vi sinh; quyền kiểm tra tất cả đối tượng.\u003c/li>\u003c/ul>\u003c/details>\n\n\u003cdetails class=\"card\">\u003csummary>Chương IV – Điều 23–25: hiệu lực, chuyển tiếp, trách nhiệm\u003c/summary>\u003cul>\n\u003cli>\u003cb>Điều 23:\u003c/b> hiệu lực 01/10/2018; Thông tư 18/2009/TT-BYT hết hiệu lực.\u003c/li>\n\u003cli>\u003cb>Điều 24:\u003c/b> điều khoản chuyển tiếp về đào tạo (xem bảng nhớ nhanh).\u003c/li>\n\u003cli>\u003cb>Điều 25 – Trách nhiệm:\u003c/b> Cục Quản lý Khám, chữa bệnh triển khai, kiểm tra toàn quốc; Cục Khoa học công nghệ và đào tạo thẩm định chương trình, chỉ đạo đào tạo liên tục và các trường; nâng cao năng lực giảng viên KSNK; đề xuất đầu tư cơ sở thực hành, tiền lâm sàng; Sở Y tế triển khai, kiểm tra, phân công đầu mối KSNK (đại học trở lên, khối ngành sức khỏe, có chứng chỉ), báo cáo; Y tế bộ, ngành triển khai tại cơ sở trực thuộc.\u003c/li>\n\u003cli>\u003cb>Người đứng đầu cơ sở KBCB:\u003c/b> chịu trách nhiệm toàn diện; tổ chức triển khai, kiểm tra, giám sát; đầu tư hạ tầng, trang thiết bị, nhân lực (xây mới, sửa chữa, mua sắm phải có tư vấn của Hội đồng, khoa KSNK hoặc người phụ trách); chi đủ kinh phí đã tính trong giá dịch vụ; bảo đảm nhân viên trong hệ thống có chứng chỉ; đào tạo, truyền thông; nghiên cứu, hợp tác quốc tế; hợp đồng dịch vụ ngoài (giặt là, khử khuẩn tiệt khuẩn, vệ sinh môi trường, xử lý chất thải): chọn đơn vị đủ tư cách pháp nhân, thường xuyên giám sát, cơ sở chịu trách nhiệm chất lượng; can thiệp cải tiến dựa trên giám sát; xây dựng nội quy cho người bệnh, người nhà, khách thăm (giờ thăm, cách ly, vệ sinh tay, vệ sinh cá nhân, phương tiện phòng hộ, vệ sinh bệnh viện, phân loại chất thải); báo cáo kết quả KSNK và tỷ lệ NKBV.\u003c/li>\n\u003cli>\u003cb>Nhân viên y tế, giáo viên, học viên:\u003c/b> tuân thủ quy định KSNK, đặc biệt khi phẫu thuật, thủ thuật, xâm lấn. \u003cb>Người bệnh, người nhà, khách thăm:\u003c/b> tuân thủ giờ thăm, cách ly, vệ sinh, phân loại chất thải; người mắc, nghi mắc bệnh nhóm A và một số bệnh nhóm B tuân thủ điều trị, cách ly, di chuyển hoặc ra viện theo quy định.\u003c/li>\n\u003cli>\u003cb>Các trường khối ngành sức khỏe:\u003c/b> đưa KSNK vào chương trình; sinh viên, học sinh phải được đào tạo KSNK trước khi thực hành; đào tạo chuyên sâu cho nhân viên làm KSNK theo nhu cầu tại cơ sở KBCB.\u003c/li>\u003c/ul>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"quiz\" class=\"hide\">\n\u003cdiv class=\"bar\">\u003ci id=\"pb\">\u003c/i>\u003c/div>\n\u003cdiv class=\"sub\" id=\"pg\">\u003c/div>\n\u003cdiv class=\"card\" id=\"box\">\u003c/div>\n\u003cdiv id=\"res\" class=\"card hide\">\u003c/div>\n\u003c/section>\n\n\u003cfooter>Nguồn: toàn văn Thông tư 16/2018/TT-BYT (Bộ Y tế). Nội dung tóm tắt chỉ phục vụ ôn tập, không thay thế văn bản gốc.\u003c/footer>\n\u003c/main>\n\u003cscript>\nvar Q=[\n[\"Thông tư 16/2018/TT-BYT quy định nội dung nào?\", [\"Quy trình kỹ thuật khử khuẩn, tiệt khuẩn cho từng loại dụng cụ y tế và điều kiện cấp phép cho cơ sở KBCB\", \"Các biện pháp phòng ngừa, KSNK và trách nhiệm thực hiện, chỉ trong các cơ sở KBCB công lập của Nhà nước\", \"Các biện pháp phòng ngừa, kiểm soát nhiễm khuẩn, hệ thống kiểm soát nhiễm khuẩn và trách nhiệm thực hiện trong cơ sở KBCB của Nhà nước và tư nhân\", \"Điều kiện, trình tự cấp chứng chỉ hành nghề và phạm vi hoạt động chuyên môn của người hành nghề KBCB\"], 2, \"Điều 1.\"],\n[\"Nhiễm khuẩn liên quan tới chăm sóc y tế (nhiễm khuẩn bệnh viện) là:\", [\"Các nhiễm khuẩn người bệnh đã mắc phải và đang ủ bệnh trước khi được tiếp nhận vào cơ sở KBCB\", \"Các nhiễm khuẩn vết mổ xảy ra trong vòng 30 ngày sau khi người bệnh được phẫu thuật\", \"Các nhiễm khuẩn lây truyền từ nhân viên y tế sang người bệnh trong quá trình khám, chữa bệnh\", \"Các nhiễm khuẩn xảy ra trong quá trình người bệnh được chăm sóc, điều trị tại cơ sở KBCB\"], 3, \"Điều 2 khoản 1.\"],\n[\"Giám sát nhiễm khuẩn bệnh viện là quá trình:\", [\"Kiểm tra định kỳ hằng tháng vệ sinh bề mặt, không khí và nguồn nước tại các khu vực trong cơ sở KBCB\", \"Điều tra, xử lý riêng từng ổ dịch khi phát hiện ca nhiễm khuẩn và báo cáo lên Sở Y tế sau khi kết thúc\", \"Thu thập số liệu nhiễm khuẩn theo từng năm để tổng hợp, lưu trữ phục vụ công tác thống kê của cơ sở\", \"Thu thập, phân tích, diễn giải dữ liệu NKBV một cách hệ thống, liên tục và thông báo kịp thời kết quả tới người liên quan\"], 3, \"Điều 2 khoản 2.\"],\n[\"Kiểm soát nhiễm khuẩn là việc:\", [\"Xây dựng và tổ chức khử khuẩn, tiệt khuẩn dụng cụ y tế nhằm giảm nguy cơ lây nhiễm cho người bệnh trong cơ sở KBCB\", \"Điều trị và theo dõi các người bệnh bị nhiễm khuẩn bệnh viện nhằm hạn chế lây nhiễm sang người bệnh khác\", \"Xây dựng, triển khai và giám sát thực hiện các quy định, hướng dẫn, quy trình chuyên môn nhằm giảm nguy cơ lây nhiễm vi sinh vật gây bệnh cho người bệnh, nhân viên y tế và cộng đồng\", \"Giám sát thực hành vệ sinh tay của nhân viên y tế nhằm giảm nguy cơ lây nhiễm cho người bệnh và nhân viên y tế\"], 2, \"Điều 2 khoản 3.\"],\n[\"Phòng ngừa chuẩn là các biện pháp phòng ngừa cơ bản:\", [\"Áp dụng cho người bệnh đã được xác định nhiễm trùng, dựa trên chẩn đoán và tình trạng nhiễm trùng khi khám, điều trị\", \"Áp dụng trong phòng phẫu thuật và khu cách ly, dựa trên nguyên tắc chỉ máu của người bệnh mới có nguy cơ lây bệnh\", \"Áp dụng cho người bệnh theo chẩn đoán của bác sĩ điều trị, tùy tình trạng nhiễm trùng và thời điểm khám, điều trị, chăm sóc\", \"Áp dụng cho mọi người bệnh, không phụ thuộc chẩn đoán, tình trạng nhiễm trùng và thời điểm khám, điều trị, chăm sóc; coi máu, chất tiết, chất bài tiết đều có nguy cơ lây truyền\"], 3, \"Điều 2 khoản 4.\"],\n[\"Tình huống: Người bệnh có kết quả xét nghiệm HIV âm tính nhập khoa. Nhân viên y tế:\", [\"Không cần áp dụng phòng ngừa chuẩn\", \"Vẫn áp dụng phòng ngừa chuẩn như với mọi người bệnh\", \"Chỉ áp dụng khi có vết thương hở\", \"Chỉ áp dụng khi thực hiện thủ thuật xâm lấn\"], 1, \"Điều 2 khoản 4.\"],\n[\"Điều 3 yêu cầu cơ sở KBCB phải:\", [\"Chỉ áp dụng nguyên văn các quy định, quy trình do Bộ Y tế ban hành mà không được xây dựng thêm quy định riêng của cơ sở\", \"Xây dựng kế hoạch KSNK chỉ khi có dịch bệnh, thay cho việc xây dựng kế hoạch theo từng giai đoạn của cơ sở\", \"Giao toàn bộ việc xây dựng, phê duyệt quy định, quy trình và kế hoạch KSNK cho Sở Y tế của địa phương thực hiện\", \"Xây dựng, phê duyệt, phổ biến các quy định, quy trình KSNK; xây dựng kế hoạch KSNK trên cơ sở kế hoạch hành động quốc gia, mục tiêu chất lượng phù hợp nguồn lực và thực tiễn theo từng giai đoạn\"], 3, \"Điều 3.\"],\n[\"Giám sát nhiễm khuẩn bệnh viện (Điều 4) bao gồm giám sát, phát hiện, báo cáo và quản lý dữ liệu về:\", [\"NKBV, vi khuẩn kháng thuốc kháng sinh và các trường hợp mắc hoặc nghi ngờ mắc bệnh truyền nhiễm có nguy cơ gây dịch\", \"Các ca nhiễm khuẩn vết mổ và nhiễm khuẩn huyết liên quan đến đặt catheter mạch máu trong cơ sở KBCB\", \"Các trường hợp mắc bệnh truyền nhiễm nhóm A và nhóm B do Bộ trưởng Bộ Y tế quy định, kể cả ca nghi ngờ mắc\", \"Tỷ lệ sử dụng kháng sinh, mức tiêu thụ kháng sinh và các vi khuẩn kháng thuốc kháng sinh phân lập được\"], 0, \"Điều 4 khoản 1.\"],\n[\"Dựa trên kết quả giám sát, cơ sở KBCB phải:\", [\"Lưu trữ đầy đủ số liệu giám sát và báo cáo định kỳ cho Hội đồng khoa học của cơ sở xem xét, quyết định\", \"Chờ hướng dẫn của Bộ Y tế rồi mới triển khai biện pháp can thiệp để giảm NKBV và bệnh truyền nhiễm\", \"Thực hiện can thiệp để giảm NKBV và bệnh truyền nhiễm, đồng thời hạn chế tối đa sử dụng kháng sinh cho người bệnh\", \"Thực hiện biện pháp can thiệp kịp thời để giảm NKBV, bệnh truyền nhiễm có nguy cơ gây dịch và sử dụng kháng sinh hợp lý\"], 3, \"Điều 4 khoản 2.\"],\n[\"Việc kiểm tra, giám sát tuân thủ quy định KSNK (Điều 5) đặc biệt chú trọng khi:\", [\"Hội chẩn liên khoa hoặc hội chẩn toàn viện đối với các ca bệnh nặng, phức tạp\", \"Thăm khám ngoại trú thông thường và tư vấn sức khỏe cho người bệnh\", \"Thực hiện phẫu thuật, thủ thuật và các kỹ thuật xâm lấn khác\", \"Cấp phát thuốc, vật tư y tế cho người bệnh nội trú tại các khoa\"], 2, \"Điều 5 khoản 1.\"],\n[\"Việc kiểm tra, giám sát tuân thủ quy định KSNK áp dụng đối với:\", [\"Chỉ nhân viên y tế và học viên đang thực tập tại cơ sở KBCB, không bao gồm người bệnh và khách thăm\", \"Nhân viên y tế, học viên, người bệnh, người nhà người bệnh và khách thăm\", \"Nhân viên y tế, học viên và người bệnh; người nhà người bệnh và khách thăm không thuộc đối tượng giám sát\", \"Người bệnh, người nhà người bệnh và khách thăm; nhân viên y tế tự giám sát và không thuộc đối tượng kiểm tra\"], 1, \"Điều 5 khoản 1.\"],\n[\"Về vệ sinh tay, cơ sở KBCB phải trang bị sẵn có phương tiện, hóa chất vệ sinh tay tại:\", [\"Khu vực phòng mổ, phòng thủ thuật và khu hồi sức, là những nơi có nguy cơ nhiễm khuẩn cao\", \"Các vị trí khám bệnh, điều trị, chăm sóc người bệnh và nơi có nhiều người tiếp xúc\", \"Phòng làm việc, phòng trực của nhân viên y tế và các khu vực hành chính của cơ sở\", \"Nhà vệ sinh, nhà ăn và các khu vực phục vụ người nhà người bệnh trong khuôn viên cơ sở\"], 1, \"Điều 6 khoản 1.\"],\n[\"Tình huống: Hành lang khoa có đông người bệnh, người nhà qua lại nhưng chưa có hóa chất vệ sinh tay. Theo Điều 6:\", [\"Cần trang bị sẵn phương tiện, hóa chất vệ sinh tay tại nơi có nhiều người tiếp xúc\", \"Chưa cần trang bị, vì hành lang không phải vị trí khám bệnh, điều trị, chăm sóc người bệnh\", \"Chỉ cần treo biển hướng dẫn và nhắc nhở mọi người rửa tay trước khi vào khoa\", \"Chỉ cần trang bị cho nhân viên y tế, còn người bệnh và người nhà tự chuẩn bị\"], 0, \"Điều 6 khoản 1.\"],\n[\"Điều 6 còn yêu cầu kiểm tra, giám sát tuân thủ vệ sinh tay của:\", [\"Nhân viên y tế và học viên; người bệnh, người nhà và khách thăm chỉ được hướng dẫn, không bị giám sát\", \"Nhân viên làm việc tại các khoa lâm sàng, không bao gồm khoa cận lâm sàng và các phòng chức năng\", \"Nhân viên y tế, học viên, người bệnh, người nhà người bệnh và khách thăm\", \"Người bệnh, người nhà người bệnh và khách thăm, còn nhân viên y tế tự kiểm tra lẫn nhau\"], 2, \"Điều 6 khoản 2.\"],\n[\"Điều 7 yêu cầu tổ chức thực hiện các quy định về:\", [\"Phòng ngừa chuẩn và sử dụng phương tiện phòng hộ cá nhân, không bao gồm phòng ngừa theo đường lây truyền\", \"Phòng ngừa dựa theo đường lây truyền và cách ly người bệnh, không bao gồm phòng ngừa chuẩn\", \"Phòng ngừa chuẩn, phòng ngừa dựa theo đường lây truyền và sử dụng phương tiện phòng hộ cá nhân\", \"Phòng ngừa chuẩn và phòng ngừa theo đường lây truyền, còn phương tiện phòng hộ cá nhân do nhân viên tự trang bị\"], 2, \"Điều 7 khoản 1.\"],\n[\"Người mắc hoặc nghi ngờ mắc bệnh truyền nhiễm, người bệnh nhiễm vi khuẩn đa kháng thuốc kháng sinh phải được:\", [\"Xếp chung buồng bệnh để thuận tiện chăm sóc\", \"Chuyển ngay sang cơ sở khác\", \"Thực hiện các biện pháp cách ly phòng ngừa phù hợp\", \"Chỉ cách ly khi có chỉ định của Sở Y tế\"], 2, \"Điều 7 khoản 2.\"],\n[\"Tình huống: Người bệnh nghi ngờ mắc lao phổi vào khoa. Cơ sở KBCB phải:\", [\"Xếp chung buồng với người bệnh khác nếu chưa có chẩn đoán xác định\", \"Thực hiện biện pháp cách ly phòng ngừa phù hợp với người nghi ngờ mắc bệnh truyền nhiễm\", \"Chỉ cho người bệnh đeo khẩu trang rồi để ở buồng chung\", \"Chỉ cách ly khi có thông báo của Sở Y tế\"], 1, \"Điều 7 khoản 2.\"],\n[\"Việc hướng dẫn, nhắc nhở tuân thủ phòng ngừa chuẩn, phòng ngừa theo đường lây và sử dụng phương tiện phòng hộ cá nhân áp dụng cho:\", [\"Nhân viên y tế và học viên; người bệnh, người nhà người bệnh và khách thăm không thuộc đối tượng hướng dẫn\", \"Người bệnh, người nhà người bệnh và khách thăm; nhân viên y tế đã được đào tạo nên không cần nhắc nhở\", \"Nhân viên y tế, học viên, người bệnh, người nhà người bệnh và khách thăm\", \"Nhân viên y tế trực tiếp chăm sóc người bệnh tại các khoa lâm sàng khi khám bệnh, điều trị\"], 2, \"Điều 7 khoản 3, 4.\"],\n[\"Về thiết bị, dụng cụ y tế, cơ sở KBCB phải thực hiện quản lý, xử lý dụng cụ y tế:\", [\"Tập trung, kiểm soát việc xử lý thiết bị, dụng cụ tái sử dụng bảo đảm an toàn, chất lượng\", \"Phân tán tại từng khoa, phòng để thuận tiện sử dụng, do điều dưỡng của khoa tự xử lý\", \"Tập trung tại phòng mổ, còn dụng cụ ở các khoa khác do từng nhân viên tự xử lý\", \"Giao hoàn toàn cho đơn vị bên ngoài, cơ sở KBCB không chịu trách nhiệm về chất lượng\"], 0, \"Điều 8 khoản 1.\"],\n[\"Thiết bị, dụng cụ y tế sau xử lý phải được bảo quản:\", [\"Trong tủ chung với dụng cụ chưa xử lý\", \"Bảo đảm vô khuẩn trước khi sử dụng cho người bệnh\", \"Ở điều kiện bình thường, không cần điều kiện đặc biệt\", \"Tại khoa đã sử dụng\"], 1, \"Điều 8 khoản 2.\"],\n[\"Việc kiểm tra, giám sát quy định về quản lý, xử lý thiết bị, dụng cụ y tế được thực hiện tại:\", [\"Chỉ khoa phẫu thuật\", \"Chỉ khu xử lý tập trung\", \"Các khoa, phòng\", \"Chỉ khoa kiểm soát nhiễm khuẩn\"], 2, \"Điều 8 khoản 3.\"],\n[\"Về đồ vải y tế, cơ sở KBCB phải cung cấp đồ vải cho người bệnh, nhân viên y tế:\", [\"Hằng ngày và khi cần\", \"Hằng tuần\", \"Khi người nhà yêu cầu\", \"Chỉ khi người bệnh nằm viện trên 3 ngày\"], 0, \"Điều 9 khoản 1.\"],\n[\"Đồ vải nhiễm khuẩn, đồ vải có máu, dịch tiết sinh học phải:\", [\"Được giặt chung với đồ vải thông thường tại khu giặt là để tiết kiệm nhân lực và hóa chất\", \"Được xử lý riêng, bảo đảm an toàn; xử lý tập trung tại khu giặt là\", \"Được giặt tại từng khoa, phòng để hạn chế vận chuyển qua các khu vực khác trong cơ sở\", \"Được giao cho người nhà người bệnh tự giặt, sấy riêng và mang về sử dụng lại\"], 1, \"Điều 9 khoản 2.\"],\n[\"Đồ vải sau xử lý phải được:\", [\"Bảo quản trong tủ, kệ sạch, vô khuẩn và vận chuyển riêng bằng phương tiện chuyên dụng\", \"Vận chuyển chung với đồ vải bẩn trên cùng phương tiện nhưng đóng gói trong túi kín\", \"Để trong thùng hở có nắp thông khí tại khoa lâm sàng để cấp phát thuận tiện cho người bệnh\", \"Bảo quản tại khu giặt là cùng đồ vải chờ xử lý và vận chuyển bằng xe đẩy thông thường\"], 0, \"Điều 9 khoản 3.\"],\n[\"Nhân viên quản lý, xử lý đồ vải phải:\", [\"Là điều dưỡng được đào tạo chuyên khoa\", \"Có bằng đại học khối ngành sức khỏe\", \"Có chứng chỉ vệ sinh môi trường\", \"Có kiến thức chuyên môn về xử lý đồ vải y tế\"], 3, \"Điều 9 khoản 5.\"],\n[\"Về đồ vải của người nhà người bệnh, cơ sở KBCB phải:\", [\"Cấm người nhà giặt đồ trong bệnh viện\", \"Giặt thay cho người nhà bằng khu giặt là bệnh viện\", \"Cho phép phơi tại hành lang các khoa\", \"Bố trí nơi giặt, sấy hoặc phơi đồ vải tập trung cho người nhà người bệnh\"], 3, \"Điều 9 khoản 6.\"],\n[\"Về quản lý chất thải y tế, cơ sở KBCB phải thực hiện:\", [\"Theo quy định riêng do từng cơ sở tự ban hành; kiểm tra, giám sát khi có đoàn thanh tra, kiểm tra\", \"Theo quy định của pháp luật, nhưng chỉ áp dụng đối với chất thải lây nhiễm và chất thải nguy hại\", \"Theo quy định của pháp luật; kiểm tra, giám sát việc phân loại, lưu giữ, vận chuyển, xử lý an toàn\", \"Theo quy định của Sở Y tế địa phương; việc kiểm tra phân loại do đơn vị thu gom thực hiện\"], 2, \"Điều 10.\"],\n[\"Cơ sở KBCB phải bảo đảm chất lượng môi trường nào khi tổ chức vệ sinh môi trường?\", [\"Môi trường bề mặt tại các khu vực có nguy cơ nhiễm khuẩn cao theo hướng dẫn của cơ sở\", \"Môi trường nước, bề mặt, không khí cho từng khu vực theo quy định của Bộ Y tế và quy chuẩn kỹ thuật quốc gia\", \"Môi trường không khí tại khu phẫu thuật, khu hồi sức theo quy chuẩn kỹ thuật quốc gia\", \"Môi trường nước sinh hoạt và nước thải theo quy định của Bộ Tài nguyên và Môi trường\"], 1, \"Điều 11 khoản 1.\"],\n[\"Về nhà vệ sinh, Thông tư yêu cầu:\", [\"Bố trí nhà vệ sinh riêng cho người bệnh nội trú; người nhà và nhân viên y tế dùng chung nhà vệ sinh công cộng\", \"Bố trí đủ nhà vệ sinh cho nhân viên y tế, còn người bệnh, người nhà sử dụng nhà vệ sinh ngoài khuôn viên\", \"Bố trí đủ nhà vệ sinh cho người bệnh, người nhà người bệnh và nhân viên y tế\", \"Bố trí nhà vệ sinh dùng chung giữa người bệnh, người nhà và khu dân cư xung quanh cơ sở\"], 2, \"Điều 11 khoản 2.\"],\n[\"Việc diệt chuột, côn trùng trong cơ sở KBCB được thực hiện:\", [\"Khi phát hiện chuột, côn trùng\", \"Hằng ngày\", \"Định kỳ\", \"Khi có dịch bệnh\"], 2, \"Điều 11 khoản 3.\"],\n[\"Người làm công tác vệ sinh môi trường tại cơ sở KBCB phải có:\", [\"Chứng chỉ hành nghề điều dưỡng\", \"Bằng đại học khối ngành sức khỏe\", \"Kiến thức về vệ sinh môi trường\", \"Chứng chỉ phòng cháy chữa cháy\"], 2, \"Điều 11 khoản 4.\"],\n[\"Về an toàn thực phẩm, cơ sở KBCB phải:\", [\"Tổ chức kiểm tra hóa chất bảo quản và phụ gia trong thực phẩm; không phải giám sát, báo cáo ca nhiễm khuẩn\", \"Chỉ kiểm tra thực phẩm do người nhà mang vào, còn thực phẩm của nhà ăn bệnh viện do đơn vị cung cấp chịu trách nhiệm\", \"Giao hoàn toàn cho đơn vị cung cấp thực phẩm tự kiểm tra, giám sát và báo cáo khi có ca nhiễm khuẩn\", \"Tổ chức kiểm tra an toàn thực phẩm về vi sinh vật; giám sát, báo cáo các trường hợp nhiễm khuẩn liên quan đến thực phẩm sử dụng tại cơ sở\"], 3, \"Điều 12 khoản 1.\"],\n[\"Cơ sở KBCB phối hợp với cơ quan quản lý an toàn thực phẩm tại địa bàn để:\", [\"Tuyên truyền, phổ biến cho các cơ sở chế biến, cung cấp thực phẩm, nhân viên y tế, người bệnh, người nhà về an toàn thực phẩm\", \"Cấp giấy chứng nhận đủ điều kiện an toàn thực phẩm cho nhà ăn và khu chế biến thực phẩm của bệnh viện\", \"Xử phạt vi phạm hành chính đối với các cơ sở cung cấp thực phẩm cho người bệnh khi phát hiện vi phạm\", \"Thu hồi, tiêu hủy thực phẩm không đạt chất lượng và công bố công khai kết quả kiểm tra hằng năm\"], 0, \"Điều 12 khoản 2.\"],\n[\"Đối với tai nạn, rủi ro nghề nghiệp liên quan đến vi sinh vật, cơ sở KBCB phải:\", [\"Ghi nhận và báo cáo khi nhân viên y tế đã xác định nhiễm bệnh, không cần giám sát các trường hợp phơi nhiễm\", \"Chuyển nhân viên bị phơi nhiễm sang khoa khác làm việc và để nhân viên tự theo dõi sức khỏe\", \"Thiết lập hệ thống quản lý, giám sát, xử trí và báo cáo đối với nhân viên y tế\", \"Thiết lập hệ thống quản lý, giám sát, xử trí và báo cáo đối với cả người bệnh và nhân viên y tế\"], 2, \"Điều 13 khoản 1.\"],\n[\"Thông tư yêu cầu tiêm vắc xin phòng bệnh truyền nhiễm (viêm gan B, cúm, lao và bệnh khác) cho:\", [\"Toàn bộ người bệnh nội trú\", \"Chỉ nhân viên y tế mới tuyển\", \"Chỉ nhân viên làm việc tại khoa truyền nhiễm\", \"Nhân viên y tế có nguy cơ phơi nhiễm\"], 3, \"Điều 13 khoản 2.\"],\n[\"Cơ sở KBCB phải xây dựng danh mục và bảo đảm sẵn có thuốc, vắc xin, sinh phẩm y tế để:\", [\"Điều trị cho người bệnh bị nhiễm khuẩn bệnh viện và các trường hợp nhiễm vi khuẩn đa kháng thuốc\", \"Cung cấp cho người nhà người bệnh khi họ bị phơi nhiễm trong quá trình chăm sóc người bệnh\", \"Dự trữ cho các tình huống thiên tai, thảm họa và khẩn cấp theo phân công của cơ quan quản lý\", \"Điều trị dự phòng cho nhân viên y tế khi bị phơi nhiễm với bệnh truyền nhiễm\"], 3, \"Điều 13 khoản 3.\"],\n[\"Tình huống: Điều dưỡng bị kim tiêm đâm vào tay sau khi tiêm cho người bệnh nhiễm viêm gan B. Cơ sở KBCB phải:\", [\"Để điều dưỡng tự theo dõi sức khỏe, tự mua thuốc dự phòng và báo cáo khi có dấu hiệu bệnh\", \"Có hệ thống quản lý, giám sát, xử trí, báo cáo tai nạn rủi ro nghề nghiệp và bảo đảm sẵn có thuốc, vắc xin, sinh phẩm điều trị dự phòng\", \"Ghi nhận vào sổ giao ca và chuyển điều dưỡng sang khoa khác làm việc trong thời gian theo dõi\", \"Thông báo cho người bệnh nguồn và người nhà để họ chi trả xét nghiệm, điều trị dự phòng cho điều dưỡng\"], 1, \"Điều 13 khoản 1, 3.\"],\n[\"Về phòng chống dịch bệnh, cơ sở KBCB phải:\", [\"Chờ chỉ đạo của cơ quan quản lý khi có dịch rồi mới xây dựng kế hoạch ứng phó và huy động nguồn lực\", \"Xây dựng kế hoạch ứng phó dịch bệnh, chỉ thực hiện trong phạm vi khuôn viên của cơ sở, không phối hợp đơn vị khác\", \"Xây dựng kế hoạch ứng phó với các dịch bệnh; phối hợp với cơ sở y tế dự phòng và cơ sở y tế khác theo phân công của cơ quan quản lý\", \"Giao toàn bộ công tác phòng, chống dịch bệnh cho cơ sở y tế dự phòng thực hiện trên địa bàn\"], 2, \"Điều 14 khoản 1.\"],\n[\"Để phòng chống dịch bệnh, cơ sở KBCB phải chuẩn bị sẵn:\", [\"Cơ sở vật chất, trang thiết bị, thuốc, hóa chất, vật tư và nhân lực\", \"Thuốc, hóa chất và vật tư tiêu hao; trang thiết bị và nhân lực do cơ quan quản lý cấp khi có dịch\", \"Nhân lực và khu cách ly riêng cho người bệnh truyền nhiễm; thuốc, vật tư do tuyến trên cấp khi có dịch\", \"Chỉ khu cách ly, phòng áp lực âm và phương tiện phòng hộ cá nhân cho nhân viên y tế\"], 0, \"Điều 14 khoản 2.\"],\n[\"Điều 14 còn yêu cầu cơ sở KBCB:\", [\"Tổ chức tập huấn cho nhân viên khoa truyền nhiễm về phòng, chống dịch; báo cáo khi dịch đã lan rộng trên địa bàn\", \"Tổ chức tập huấn cho nhân viên y tế và người nhà người bệnh; khai báo bệnh truyền nhiễm hằng năm\", \"Tổ chức tập huấn cho nhân viên y tế về phòng, chống dịch bệnh; thực hiện chế độ thông tin báo cáo và khai báo bệnh, dịch bệnh truyền nhiễm\", \"Thực hiện chế độ thông tin báo cáo và khai báo bệnh, dịch bệnh truyền nhiễm; việc tập huấn do Sở Y tế tổ chức\"], 2, \"Điều 14 khoản 3, 4.\"],\n[\"Về hóa chất, vật tư dùng trong KSNK, cơ sở KBCB phải:\", [\"Xây dựng định mức, kiểm tra chất lượng và quản lý việc sử dụng\", \"Mua theo giá thấp nhất và cấp phát không giới hạn cho các khoa để bảo đảm luôn có sẵn\", \"Giao khoa dược toàn quyền quyết định việc mua sắm, cấp phát và sử dụng hóa chất, vật tư\", \"Xây dựng định mức và quản lý sử dụng, việc kiểm tra chất lượng do nhà cung cấp chịu trách nhiệm\"], 0, \"Điều 15 khoản 1.\"],\n[\"Việc sử dụng hóa chất, vật tư KSNK phải bảo đảm:\", [\"An toàn, tiết kiệm và hiệu quả\", \"Nhanh, rẻ và dễ mua\", \"An toàn và phổ biến\", \"Đúng hạn dùng và đủ số lượng\"], 0, \"Điều 15 khoản 2.\"],\n[\"Hệ thống KSNK trong cơ sở KBCB bao gồm:\", [\"Hội đồng khoa học; khoa KSNK; mạng lưới y tế\", \"Hội đồng KSNK; phòng điều dưỡng; khoa dược\", \"Hội đồng KSNK; khoa hoặc bộ phận KSNK; mạng lưới KSNK\", \"Khoa KSNK; phòng quản lý chất lượng; mạng lưới KSNK\"], 2, \"Điều 16 khoản 1.\"],\n[\"Cơ sở KBCB phải tổ chức đầy đủ hệ thống KSNK (cả 3 thành phần) khi có:\", [\"Từ 100 giường bệnh kế hoạch trở lên\", \"Từ 150 giường bệnh kế hoạch trở lên\", \"Từ 200 giường bệnh kế hoạch trở lên\", \"Từ 50 giường bệnh kế hoạch trở lên\"], 1, \"Điều 16 khoản 2.\"],\n[\"Cơ sở KBCB dưới 150 giường bệnh kế hoạch tối thiểu phải có:\", [\"Khoa KSNK độc lập có đủ bộ phận giám sát, khử khuẩn tiệt khuẩn, đồ vải, vệ sinh môi trường và mạng lưới KSNK\", \"Hội đồng KSNK, bộ phận KSNK thuộc phòng kế hoạch tổng hợp và một người phụ trách KSNK làm kiêm nhiệm\", \"Mạng lưới KSNK và một người phụ trách KSNK làm kiêm nhiệm, không cần có bộ phận KSNK\", \"Bộ phận KSNK thuộc phòng kế hoạch tổng hợp, mạng lưới KSNK và người phụ trách KSNK làm việc toàn thời gian\"], 3, \"Điều 16 khoản 3.\"],\n[\"Người phụ trách KSNK ở cơ sở dưới 150 giường phải:\", [\"Làm kiêm nhiệm, tốt nghiệp ngành thuộc khối ngành sức khỏe, có chứng chỉ, giấy chứng nhận về KSNK\", \"Làm việc toàn thời gian, tốt nghiệp ngành thuộc khối ngành sức khỏe, có chứng chỉ, giấy chứng nhận hoặc văn bằng về KSNK\", \"Làm việc toàn thời gian, có trình độ thạc sĩ trở lên thuộc khối ngành sức khỏe và có chứng chỉ KSNK\", \"Làm việc toàn thời gian, là bác sĩ chuyên khoa truyền nhiễm hoặc vi sinh, đã được đào tạo KSNK\"], 1, \"Điều 16 khoản 3.\"],\n[\"Cơ sở KBCB không có giường bệnh nội trú tối thiểu phải:\", [\"Thành lập mạng lưới KSNK\", \"Thành lập khoa KSNK\", \"Phân công một người phụ trách KSNK\", \"Không phải tổ chức gì về KSNK\"], 2, \"Điều 16 khoản 4.\"],\n[\"Tình huống: Bệnh viện có 200 giường bệnh kế hoạch. Hệ thống KSNK phải gồm:\", [\"Chỉ cần bộ phận KSNK thuộc phòng kế hoạch tổng hợp, mạng lưới KSNK và một người phụ trách toàn thời gian\", \"Hội đồng KSNK và mạng lưới KSNK, còn khoa hoặc bộ phận KSNK là không bắt buộc\", \"Hội đồng KSNK, khoa hoặc bộ phận KSNK và mạng lưới KSNK\", \"Hội đồng KSNK và khoa KSNK; mạng lưới KSNK chỉ được lập khi có dịch bệnh\"], 2, \"Điều 16 khoản 2.\"],\n[\"Tình huống: Bệnh viện có 120 giường bệnh kế hoạch. Hệ thống KSNK tối thiểu là:\", [\"Khoa KSNK có đủ các bộ phận giám sát, khử khuẩn tiệt khuẩn, quản lý đồ vải và vệ sinh môi trường\", \"Một cán bộ phụ trách KSNK kiêm nhiệm tại phòng kế hoạch tổng hợp, không cần có mạng lưới KSNK\", \"Bộ phận KSNK thuộc phòng kế hoạch tổng hợp, mạng lưới KSNK và người phụ trách KSNK toàn thời gian\", \"Hội đồng KSNK, khoa KSNK và mạng lưới KSNK như bệnh viện từ 150 giường bệnh kế hoạch trở lên\"], 2, \"Điều 16 khoản 3.\"],\n[\"Hội đồng KSNK do ai quyết định thành lập?\", [\"Trưởng khoa KSNK hoặc người phụ trách KSNK\", \"Sở Y tế tỉnh, thành phố nơi cơ sở đặt trụ sở\", \"Cục Quản lý Khám, chữa bệnh thuộc Bộ Y tế\", \"Người đứng đầu cơ sở KBCB (Giám đốc)\"], 3, \"Điều 17 khoản 1.\"],\n[\"Chủ tịch Hội đồng KSNK là:\", [\"Trưởng khoa KSNK\", \"Phó giám đốc phụ trách chuyên môn\", \"Trưởng phòng kế hoạch tổng hợp\", \"Giám đốc\"], 3, \"Điều 17 khoản 1.\"],\n[\"Thư ký Hội đồng KSNK là:\", [\"Trưởng khoa KSNK hoặc người được giao nhiệm vụ phụ trách KSNK\", \"Trưởng phòng điều dưỡng hoặc điều dưỡng trưởng bệnh viện được Giám đốc phân công\", \"Trưởng khoa vi sinh hoặc xét nghiệm, là thành viên bắt buộc của Hội đồng\", \"Điều dưỡng trưởng khoa KSNK hoặc người đứng đầu bộ phận giám sát NKBV\"], 0, \"Điều 17 khoản 1.\"],\n[\"Thành viên Hội đồng KSNK tối thiểu phải có sự tham gia của:\", [\"Lãnh đạo các khoa lâm sàng và cận lâm sàng; không bắt buộc có đại diện phòng chức năng\", \"Lãnh đạo các phòng chức năng, khoa vi sinh/xét nghiệm, khoa dược và một số khoa lâm sàng có nguy cơ NKBV cao\", \"Lãnh đạo khoa vi sinh/xét nghiệm và khoa dược; các phòng chức năng và khoa lâm sàng không bắt buộc\", \"Trưởng của toàn bộ các khoa, phòng trong bệnh viện, không phân biệt mức nguy cơ NKBV\"], 1, \"Điều 17 khoản 1.\"],\n[\"Hội đồng KSNK có nhiệm vụ tư vấn cho Giám đốc về:\", [\"Quyết định mua sắm thuốc, vật tư y tế và trang thiết bị phục vụ khám bệnh, chữa bệnh trong cơ sở\", \"Tuyển dụng, bố trí nhân sự cho khoa KSNK và đề xuất khen thưởng, kỷ luật nhân viên vi phạm\", \"Xây dựng giá dịch vụ khám bệnh, chữa bệnh và quyết định nguồn kinh phí cho hoạt động KSNK\", \"KSNK trong cơ sở KBCB và việc sửa chữa, thiết kế, xây dựng mới công trình y tế phù hợp với KSNK\"], 3, \"Điều 17 khoản 2.\"],\n[\"Hội đồng KSNK còn có nhiệm vụ:\", [\"Tham gia giám sát, đào tạo, nghiên cứu khoa học về KSNK; xem xét, đánh giá và định hướng việc thực hiện KSNK\", \"Trực tiếp thực hiện giám sát NKBV hằng ngày tại các khoa và báo cáo kết quả cho Giám đốc\", \"Thẩm định chương trình, tài liệu đào tạo KSNK và chỉ đạo các trường khối ngành sức khỏe\", \"Quản lý hóa chất, vật tư KSNK và xây dựng định mức, tiêu chuẩn kỹ thuật cho toàn cơ sở\"], 0, \"Điều 17 khoản 2.\"],\n[\"Khoa KSNK tùy theo quy mô có các bộ phận do Giám đốc quyết định, trong đó tối thiểu phải có:\", [\"Bộ phận khử khuẩn, tiệt khuẩn\", \"Bộ phận quản lý đồ vải\", \"Bộ phận vệ sinh môi trường\", \"Bộ phận giám sát\"], 3, \"Điều 18 khoản 1.\"],\n[\"Trưởng khoa và điều dưỡng trưởng khoa KSNK phải có trình độ:\", [\"Cao đẳng trở lên, tốt nghiệp ngành thuộc khối ngành sức khỏe, có chứng chỉ KSNK, làm kiêm nhiệm tại khoa\", \"Thạc sĩ trở lên chuyên ngành vi sinh, có chứng chỉ KSNK, làm việc toàn thời gian tại khoa\", \"Đại học trở lên, tốt nghiệp ngành thuộc khối ngành sức khỏe, chưa cần chứng chỉ KSNK nhưng làm toàn thời gian\", \"Đại học trở lên, tốt nghiệp ngành thuộc khối ngành sức khỏe, có chứng chỉ KSNK, làm việc toàn thời gian tại khoa\"], 3, \"Điều 18 khoản 1.\"],\n[\"Trưởng bộ phận KSNK là:\", [\"Người phụ trách KSNK, có văn bản phân công của Giám đốc\", \"Trưởng phòng kế hoạch tổng hợp, được Giám đốc phân công kiêm nhiệm phụ trách KSNK\", \"Trưởng khoa dược hoặc trưởng khoa xét nghiệm, được Hội đồng KSNK đề cử\", \"Điều dưỡng trưởng bệnh viện, theo quyết định của Sở Y tế\"], 0, \"Điều 18 khoản 1.\"],\n[\"Nhiệm vụ nào thuộc khoa hoặc bộ phận KSNK?\", [\"Quyết định kỷ luật nhân viên vi phạm quy định KSNK và phê duyệt kế hoạch đầu tư xây dựng cơ sở\", \"Ban hành quy chế hoạt động chung của bệnh viện và quyết định việc mua sắm trang thiết bị y tế\", \"Tư vấn cho Giám đốc về việc sửa chữa, thiết kế, xây dựng mới các công trình y tế trong cơ sở\", \"Là đầu mối tham mưu cho Giám đốc về biện pháp phòng ngừa, KSNK; tổ chức hoặc phối hợp triển khai, kiểm tra, giám sát thực hiện\"], 3, \"Điều 18 khoản 2.\"],\n[\"Khoa KSNK còn có nhiệm vụ:\", [\"Xây dựng mô tả công việc, định mức, tiêu chuẩn kỹ thuật, đề xuất mua sắm trang thiết bị, vật tư, hóa chất KSNK và kiểm tra việc sử dụng\", \"Trực tiếp mua sắm trang thiết bị, vật tư, hóa chất KSNK và cấp phát cho các khoa theo nhu cầu\", \"Ban hành định mức, tiêu chuẩn kỹ thuật cho toàn bệnh viện mà không cần Giám đốc phê duyệt\", \"Xây dựng mô tả công việc cho toàn bộ nhân viên bệnh viện và quản lý ngân sách mua sắm vật tư KSNK\"], 0, \"Điều 18 khoản 2.\"],\n[\"Khoa KSNK tổ chức đào tạo, truyền thông cho đối tượng nào?\", [\"Đào tạo, tập huấn cho nhân viên khoa KSNK và mạng lưới KSNK; truyền thông chỉ dành cho người bệnh\", \"Đào tạo, tập huấn cho học viên thực tập; truyền thông cho nhân viên y tế và người bệnh, không gồm khách thăm\", \"Đào tạo cho nhân viên y tế, học viên, người bệnh và người nhà; truyền thông chỉ dành cho nhân viên y tế\", \"Đào tạo, tập huấn cho nhân viên y tế và học viên; truyền thông cho nhân viên y tế, học viên, người bệnh, người nhà và khách thăm\"], 3, \"Điều 18 khoản 2.\"],\n[\"Khoa KSNK thực hiện nghiên cứu khoa học, hợp tác quốc tế và:\", [\"Chỉ đạo tuyến về KSNK\", \"Cấp chứng chỉ KSNK\", \"Thẩm định chương trình đào tạo\", \"Quản lý ngân sách bệnh viện\"], 0, \"Điều 18 khoản 2.\"],\n[\"Mạng lưới KSNK do ai quyết định thành lập?\", [\"Trưởng khoa KSNK\", \"Trưởng phòng điều dưỡng\", \"Hội đồng KSNK\", \"Giám đốc\"], 3, \"Điều 19 khoản 1.\"],\n[\"Mỗi khoa cử vào mạng lưới KSNK:\", [\"Ít nhất một bác sĩ và một điều dưỡng hoặc hộ sinh hoặc kỹ thuật y kiêm nhiệm\", \"Ít nhất hai bác sĩ, trong đó có một bác sĩ chuyên khoa truyền nhiễm làm việc toàn thời gian\", \"Ít nhất một điều dưỡng trưởng khoa làm việc toàn thời gian tại khoa KSNK\", \"Một bác sĩ chuyên khoa truyền nhiễm hoặc vi sinh được Giám đốc phân công kiêm nhiệm\"], 0, \"Điều 19 khoản 1.\"],\n[\"Tình huống: Khoa Nội của bệnh viện 300 giường cử người vào mạng lưới KSNK. Số người tối thiểu và cơ cấu là:\", [\"Một điều dưỡng trưởng khoa làm việc toàn thời gian, không bắt buộc có bác sĩ\", \"Ít nhất một bác sĩ và một điều dưỡng (hoặc hộ sinh, kỹ thuật y) kiêm nhiệm\", \"Hai điều dưỡng kiêm nhiệm, vì bệnh viện có trên 150 giường bệnh kế hoạch\", \"Một bác sĩ là trưởng khoa kiêm nhiệm, điều dưỡng do khoa KSNK cử sang\"], 1, \"Điều 19 khoản 1.\"],\n[\"Thành viên mạng lưới KSNK có nhiệm vụ:\", [\"Quản lý kinh phí KSNK và quyết định việc mua sắm hóa chất, vật tư KSNK của toàn bệnh viện\", \"Hướng dẫn, kiểm tra, giám sát nhân viên y tế, học viên, người bệnh, người nhà, khách thăm tại khoa thực hiện quy định KSNK\", \"Thay mặt Giám đốc xử phạt hành chính các nhân viên, người nhà vi phạm quy định KSNK\", \"Ban hành quy định, quy trình KSNK áp dụng cho khoa và chỉ đạo các khoa khác thực hiện\"], 1, \"Điều 19 khoản 2.\"],\n[\"Mạng lưới KSNK báo cáo định kỳ và đột xuất về tình hình NKBV, tuân thủ thực hành KSNK cho:\", [\"Chỉ báo cáo trực tiếp cho Giám đốc cơ sở KBCB, là người quyết định thành lập mạng lưới\", \"Hội đồng KSNK của cơ sở, theo định kỳ hằng quý và khi có yêu cầu của Chủ tịch Hội đồng\", \"Sở Y tế địa phương, theo định kỳ hằng tháng và khi xảy ra ổ dịch NKBV\", \"Lãnh đạo khoa và trưởng khoa KSNK hoặc người phụ trách KSNK\"], 3, \"Điều 19 khoản 2.\"],\n[\"Nhiệm vụ của trưởng khoa hoặc trưởng bộ phận KSNK gồm:\", [\"Tham mưu cho Giám đốc về KSNK; tổ chức thực hiện nhiệm vụ của khoa; chỉ báo cáo kết quả cho Hội đồng KSNK\", \"Giám sát KSNK tại khoa mình; tổng kết, báo cáo kết quả của khoa cho trưởng phòng kế hoạch tổng hợp\", \"Tham mưu cho Giám đốc; tổ chức thực hiện và chịu trách nhiệm về nhiệm vụ của khoa; tổng kết, báo cáo kết quả KSNK toàn cơ sở\", \"Tham mưu cho Giám đốc và đề xuất khen thưởng, kỷ luật; không chịu trách nhiệm về nhiệm vụ của khoa KSNK\"], 2, \"Điều 20 khoản 1.\"],\n[\"Quyền hạn của trưởng khoa hoặc trưởng bộ phận KSNK bao gồm:\", [\"Quyền hạn chung của trưởng khoa; kiểm tra, yêu cầu các khoa phòng, nhân viên, học viên, người bệnh, người nhà, khách thăm thực hiện đúng quy định KSNK\", \"Ra quyết định kỷ luật nhân viên vi phạm quy định KSNK và đình chỉ hoạt động của khoa, phòng vi phạm\", \"Ra quyết định khen thưởng cá nhân, tập thể có thành tích và điều chuyển nhân sự giữa các khoa\", \"Quyền hạn chung của trưởng khoa; kiểm tra nhân viên y tế và học viên, không bao gồm người bệnh, người nhà, khách thăm\"], 0, \"Điều 20 khoản 2.\"],\n[\"Trưởng khoa KSNK có quyền:\", [\"Đề xuất với Giám đốc khen thưởng, kỷ luật cá nhân, tập thể có thành tích hoặc vi phạm quy định KSNK\", \"Trực tiếp ra quyết định kỷ luật cá nhân, tập thể vi phạm quy định KSNK trong cơ sở KBCB\", \"Trực tiếp ra quyết định khen thưởng cá nhân, tập thể có thành tích về KSNK trong cơ sở KBCB\", \"Đình chỉ hoạt động của khoa, phòng vi phạm quy định KSNK cho đến khi khắc phục xong\"], 0, \"Điều 20 khoản 2.\"],\n[\"Người phụ trách KSNK ở cơ sở dưới 150 giường không có khoa KSNK có nhiệm vụ, quyền hạn:\", [\"Như trưởng khoa KSNK, kể cả quyền hạn chung của trưởng khoa\", \"Chỉ nhiệm vụ giám sát\", \"Chỉ tham mưu cho Giám đốc\", \"Như trưởng khoa KSNK, trừ quyền hạn chung của trưởng khoa\"], 3, \"Điều 20 khoản 3.\"],\n[\"Người phụ trách KSNK ở cơ sở không có giường bệnh nội trú:\", [\"Tổ chức Hội đồng KSNK và mạng lưới KSNK để triển khai các biện pháp KSNK trong cơ sở\", \"Thành lập bộ phận giám sát chuyên trách có ít nhất một nhân viên giám sát trình độ cao đẳng trở lên\", \"Triển khai, kiểm tra giám sát các biện pháp phòng và KSNK phù hợp phạm vi chuyên môn của cơ sở\", \"Báo cáo trực tiếp cho Bộ Y tế về tình hình NKBV và việc thực hiện KSNK của cơ sở\"], 2, \"Điều 20 khoản 4.\"],\n[\"Điều dưỡng trưởng khoa KSNK giúp trưởng khoa:\", [\"Ban hành các quy định, quy trình KSNK và hướng dẫn kỹ thuật cho toàn bộ cơ sở KBCB\", \"Ra quyết định khen thưởng, kỷ luật các cá nhân, tập thể có thành tích hoặc vi phạm quy định KSNK\", \"Tổng kết, báo cáo kết quả thực hiện KSNK trong toàn cơ sở KBCB cho Giám đốc\", \"Lập kế hoạch quản lý và sử dụng trang thiết bị, phương tiện, vật tư, hóa chất phục vụ KSNK\"], 3, \"Điều 21 khoản 1.\"],\n[\"Điều dưỡng trưởng khoa KSNK còn tham gia:\", [\"Xây dựng hướng dẫn các quy định KSNK và kiểm tra, giám sát việc thực hiện\", \"Đào tạo chuyên sâu về KSNK cho nhân viên tuyến dưới và chỉ đạo tuyến về KSNK\", \"Thẩm định chương trình, tài liệu đào tạo KSNK trước khi trình Giám đốc phê duyệt\", \"Quản lý ngân sách của khoa KSNK và quyết định việc mua sắm hóa chất, vật tư KSNK\"], 0, \"Điều 21 khoản 1.\"],\n[\"Quyền hạn của điều dưỡng trưởng khoa KSNK là:\", [\"Chỉ trong phạm vi khoa KSNK, không được kiểm tra, giám sát hoạt động ở khoa, phòng khác\", \"Như điều dưỡng trưởng khoa khác và có quyền kiểm tra giám sát hoạt động KSNK tại các khoa, phòng\", \"Như trưởng khoa KSNK, kể cả quyền đề xuất khen thưởng, kỷ luật với Giám đốc\", \"Như điều dưỡng trưởng khoa khác và chỉ được kiểm tra, giám sát các khoa lâm sàng, không gồm cận lâm sàng\"], 1, \"Điều 21 khoản 2.\"],\n[\"Bộ phận giám sát KSNK là:\", [\"Bộ phận độc lập trực thuộc Giám đốc, có nhiệm vụ chuyên trách kiểm tra, giám sát về KSNK\", \"Bộ phận của phòng quản lý chất lượng, có nhiệm vụ kiểm tra, giám sát việc thực hiện KSNK\", \"Bộ phận chuyên môn của khoa KSNK, có nhiệm vụ chuyên trách kiểm tra, giám sát về KSNK\", \"Bộ phận của Hội đồng KSNK, có nhiệm vụ chuyên trách kiểm tra, giám sát về KSNK\"], 2, \"Điều 22 khoản 1.\"],\n[\"Nhân viên giám sát KSNK chuyên trách phải có trình độ:\", [\"Cao đẳng trở lên, tốt nghiệp ngành thuộc khối ngành sức khỏe, có chứng chỉ, chứng nhận hoặc văn bằng đào tạo về giám sát KSNK\", \"Đại học trở lên, tốt nghiệp ngành thuộc khối ngành sức khỏe, làm việc kiêm nhiệm tại khoa KSNK\", \"Trung cấp trở lên, tốt nghiệp ngành thuộc khối ngành sức khỏe, có chứng chỉ về giám sát KSNK\", \"Cao đẳng trở lên, tốt nghiệp bất kỳ ngành nào, có chứng chỉ, chứng nhận về giám sát KSNK\"], 0, \"Điều 22 khoản 1.\"],\n[\"Về số lượng nhân viên giám sát chuyên trách, cơ sở từ 150 giường bệnh trở lên phải bảo đảm:\", [\"1 nhân viên giám sát chuyên trách trên mỗi 150 giường bệnh\", \"1 nhân viên trên mỗi 100 giường bệnh\", \"2 nhân viên trên mỗi 150 giường bệnh\", \"1 nhân viên cho toàn bệnh viện\"], 0, \"Điều 22 khoản 1.\"],\n[\"Tình huống: Bệnh viện có 450 giường bệnh. Số nhân viên giám sát KSNK chuyên trách tối thiểu là:\", [\"3 người\", \"2 người\", \"4 người\", \"1 người\"], 0, \"Điều 22 khoản 1 (1 người trên mỗi 150 giường).\"],\n[\"Cơ sở KBCB dưới 150 giường bệnh phải có:\", [\"Ít nhất 2 nhân viên giám sát chuyên trách\", \"Ít nhất 1 nhân viên giám sát chuyên trách\", \"Nhân viên giám sát kiêm nhiệm\", \"Không bắt buộc có nhân viên giám sát\"], 1, \"Điều 22 khoản 1.\"],\n[\"Ở cơ sở KBCB không có giường bệnh nội trú, nhiệm vụ giám sát do ai thực hiện?\", [\"Người phụ trách KSNK\", \"Nhân viên giám sát chuyên trách\", \"Mạng lưới KSNK\", \"Trưởng khoa lâm sàng\"], 0, \"Điều 22 khoản 1.\"],\n[\"Bộ phận giám sát thực hiện giám sát NKBV và kiểm tra, giám sát tuân thủ thực hành KSNK theo:\", [\"Điều 6 và Điều 7\", \"Điều 8 và Điều 9\", \"Điều 10 và Điều 11\", \"Điều 4 và Điều 5 của Thông tư\"], 3, \"Điều 22 khoản 2.\"],\n[\"Bộ phận giám sát còn tham gia:\", [\"Giám sát môi trường, giám sát vi sinh, kiểm tra thực hiện quy định KSNK của người bệnh, người nhà, khách thăm\", \"Trực tiếp xử lý dụng cụ y tế, đồ vải và quản lý chất thải y tế tại các khoa, phòng\", \"Tổ chức đào tạo, tập huấn về KSNK cho nhân viên y tế và học viên của cơ sở\", \"Quản lý chất thải y tế và xây dựng định mức hóa chất, vật tư dùng trong KSNK\"], 0, \"Điều 22 khoản 2.\"],\n[\"Quyền hạn của bộ phận giám sát là:\", [\"Kiểm tra, giám sát hoạt động liên quan đến KSNK của tất cả nhân viên y tế, học viên, người bệnh, người nhà, khách thăm\", \"Kiểm tra, giám sát hoạt động KSNK của nhân viên y tế và học viên, không gồm người bệnh, người nhà\", \"Đình chỉ hoạt động của khoa, phòng vi phạm quy định KSNK cho đến khi khắc phục xong\", \"Xử phạt hành chính nhân viên y tế, học viên, người nhà vi phạm quy định KSNK\"], 0, \"Điều 22 khoản 3.\"],\n[\"Thông tư 16/2018/TT-BYT có hiệu lực từ ngày:\", [\"01/10/2018\", \"20/07/2018\", \"01/01/2019\", \"01/07/2018\"], 0, \"Điều 23 khoản 1.\"],\n[\"Thông tư nào hết hiệu lực kể từ khi Thông tư 16/2018/TT-BYT có hiệu lực?\", [\"Thông tư 07/2011/TT-BYT hướng dẫn công tác điều dưỡng về chăm sóc người bệnh trong bệnh viện\", \"Thông tư 07/2014/TT-BYT quy định quy tắc ứng xử của người làm việc trong các cơ sở y tế\", \"Thông tư 20/2021/TT-BYT quy định quản lý chất thải y tế trong phạm vi khuôn viên cơ sở y tế\", \"Thông tư 18/2009/TT-BYT hướng dẫn tổ chức thực hiện công tác KSNK trong cơ sở KBCB\"], 3, \"Điều 23 khoản 2.\"],\n[\"Lãnh đạo khoa KSNK, người phụ trách KSNK ở cơ sở dưới 150 giường phải được đào tạo tối thiểu:\", [\"05 ngày về KSNK trước ngày 01/01/2021\", \"03 tháng về KSNK trước ngày 01/01/2021\", \"03 tháng về KSNK trước ngày 01/01/2022\", \"01 tháng về KSNK trước ngày 01/01/2021\"], 1, \"Điều 24 khoản 1.\"],\n[\"Người phụ trách KSNK ở cơ sở không có giường bệnh nội trú phải được đào tạo tối thiểu:\", [\"03 tháng về KSNK trước ngày 01/01/2021\", \"05 ngày về KSNK trước ngày 01/01/2022\", \"05 ngày về KSNK trước ngày 01/01/2021\", \"01 tháng về KSNK trước ngày 01/01/2021\"], 2, \"Điều 24 khoản 2.\"],\n[\"Nhân viên bộ phận giám sát và bộ phận khử khuẩn, tiệt khuẩn phải được đào tạo tối thiểu:\", [\"05 ngày về KSNK trước ngày 01/01/2022\", \"03 tháng về KSNK trước ngày 01/01/2022\", \"03 tháng về KSNK trước ngày 01/01/2021\", \"01 tháng về KSNK trước ngày 01/01/2022\"], 1, \"Điều 24 khoản 3.\"],\n[\"Nhân viên thuộc Hội đồng KSNK và mạng lưới KSNK phải được đào tạo tối thiểu:\", [\"03 tháng về KSNK trước ngày 01/01/2022\", \"05 ngày về KSNK trước ngày 01/01/2022\", \"05 ngày về KSNK trước ngày 01/01/2021\", \"03 tháng về KSNK trước ngày 01/01/2021\"], 1, \"Điều 24 khoản 4.\"],\n[\"Cán bộ phụ trách KSNK tại Sở Y tế phải được đào tạo tối thiểu:\", [\"01 tháng về KSNK trước ngày 01/01/2021\", \"03 tháng về KSNK trước ngày 01/01/2021\", \"05 ngày về KSNK trước ngày 01/01/2022\", \"01 tháng về KSNK trước ngày 01/01/2022\"], 0, \"Điều 24 khoản 5.\"],\n[\"Đơn vị nào chịu trách nhiệm tổ chức triển khai, kiểm tra, giám sát việc thực hiện Thông tư trên toàn quốc?\", [\"Cục Khoa học công nghệ và đào tạo\", \"Cục Quản lý Khám, chữa bệnh\", \"Vụ Pháp chế\", \"Thanh tra Bộ Y tế\"], 1, \"Điều 25 khoản 1.\"],\n[\"Cục Khoa học công nghệ và đào tạo có nhiệm vụ nào?\", [\"Tổ chức triển khai, kiểm tra, giám sát việc thực hiện Thông tư tại các bệnh viện trên toàn quốc\", \"Chủ trì thẩm định chương trình, tài liệu đào tạo KSNK; chỉ đạo đào tạo liên tục và việc đưa KSNK vào chương trình của các trường\", \"Phân công bộ phận và cán bộ làm đầu mối phụ trách KSNK, chỉ đạo Sở Y tế các tỉnh, thành phố\", \"Cấp chứng chỉ đào tạo KSNK, thẩm định hồ sơ và chỉ đạo các Sở Y tế thực hiện đào tạo\"], 1, \"Điều 25 khoản 2.\"],\n[\"Sở Y tế phân công bộ phận và cán bộ làm đầu mối phụ trách KSNK, cán bộ này phải có:\", [\"Trình độ đại học trở lên, tốt nghiệp ngành thuộc khối ngành sức khỏe, có chứng chỉ, giấy chứng nhận hoặc văn bằng đào tạo KSNK\", \"Trình độ cao đẳng trở lên, tốt nghiệp ngành thuộc khối ngành sức khỏe, có chứng chỉ KSNK\", \"Trình độ thạc sĩ trở lên, tốt nghiệp ngành thuộc khối ngành sức khỏe, làm việc toàn thời gian\", \"Trình độ đại học trở lên, tốt nghiệp bất kỳ ngành nào, có chứng chỉ hoặc văn bằng đào tạo KSNK\"], 0, \"Điều 25 khoản 3.\"],\n[\"Sở Y tế có trách nhiệm:\", [\"Tổ chức triển khai, kiểm tra, đánh giá thực hiện Thông tư trên địa bàn; báo cáo định kỳ hoặc đột xuất theo yêu cầu của cơ quan quản lý nhà nước có thẩm quyền\", \"Phổ biến Thông tư đến các cơ sở KBCB trên địa bàn; việc kiểm tra, đánh giá do Bộ Y tế thực hiện\", \"Trực tiếp quản lý hệ thống KSNK và điều hành hoạt động KSNK của các cơ sở KBCB trên địa bàn\", \"Cấp phép hoạt động cho khoa KSNK và thẩm định chương trình đào tạo KSNK của các cơ sở trên địa bàn\"], 0, \"Điều 25 khoản 3.\"],\n[\"Y tế các Bộ, Ngành chịu trách nhiệm:\", [\"Báo cáo trực tiếp cho Quốc hội và Chính phủ về việc thực hiện KSNK tại các cơ sở trực thuộc\", \"Tổ chức triển khai, kiểm tra, giám sát thực hiện Thông tư tại các cơ sở KBCB trực thuộc\", \"Đào tạo nhân viên KSNK và thẩm định chương trình đào tạo tại các cơ sở KBCB trực thuộc\", \"Chỉ tổ chức triển khai Thông tư; việc kiểm tra, giám sát tại cơ sở trực thuộc do Bộ Y tế thực hiện\"], 1, \"Điều 25 khoản 4.\"],\n[\"Người đứng đầu cơ sở KBCB chịu trách nhiệm:\", [\"Về hoạt động chuyên môn khám bệnh, chữa bệnh; công tác KSNK do trưởng khoa KSNK chịu trách nhiệm\", \"Về hoạt động của khoa KSNK; việc triển khai Thông tư do Hội đồng KSNK chịu trách nhiệm\", \"Toàn diện về công tác KSNK của cơ sở; tổ chức triển khai, kiểm tra, giám sát thực hiện Thông tư\", \"Cùng với Hội đồng KSNK, mỗi bên chịu trách nhiệm ngang nhau về công tác KSNK của cơ sở\"], 2, \"Điều 25 khoản 5.\"],\n[\"Khi xây mới hoặc sửa chữa, cải tạo cơ sở vật chất, mua sắm trang thiết bị, phương tiện, phải có sự tham gia tư vấn của:\", [\"Phòng vật tư - thiết bị y tế và phòng tài chính - kế toán của cơ sở KBCB\", \"Khoa dược và phòng quản lý chất lượng, vì liên quan đến hóa chất, vật tư\", \"Sở Y tế hoặc cơ quan quản lý cấp trên, đối với mọi trường hợp xây mới, sửa chữa\", \"Hội đồng KSNK, khoa KSNK hoặc người phụ trách KSNK\"], 3, \"Điều 25 khoản 5.\"],\n[\"Tình huống: Bệnh viện dự định cải tạo khoa Hồi sức, lắp phòng cách ly áp lực âm. Điều nào đúng?\", [\"Chỉ cần ý kiến của phòng hành chính - quản trị và đơn vị thiết kế, thi công công trình\", \"Không cần tư vấn về KSNK nếu đã có thiết kế đạt chuẩn của đơn vị thi công\", \"Phải chờ Sở Y tế phê duyệt thiết kế, còn tư vấn của khoa KSNK là không bắt buộc\", \"Phải có sự tham gia tư vấn của Hội đồng KSNK, khoa KSNK hoặc người phụ trách KSNK\"], 3, \"Điều 25 khoản 5.\"],\n[\"Về kinh phí, người đứng đầu cơ sở KBCB phải:\", [\"Chi đủ kinh phí cho các hoạt động KSNK đã được tính vào cơ cấu giá dịch vụ y tế\", \"Chi theo khả năng cân đối của đơn vị, mức chi do Giám đốc quyết định hằng năm\", \"Chỉ chi cho khoa KSNK, còn các khoa lâm sàng tự cân đối kinh phí cho hoạt động KSNK\", \"Đề nghị người bệnh đóng góp thêm kinh phí cho các hoạt động KSNK của cơ sở\"], 0, \"Điều 25 khoản 5.\"],\n[\"Người đứng đầu cơ sở KBCB phải bảo đảm nhân viên y tế tham gia hệ thống KSNK:\", [\"Được đào tạo về KSNK tại chính bệnh viện, không cần có chứng chỉ hoặc văn bằng\", \"Có trình độ đại học trở lên và tốt nghiệp ngành thuộc khối ngành sức khỏe\", \"Làm việc toàn thời gian và có kinh nghiệm công tác tối thiểu 5 năm tại cơ sở\", \"Có chứng chỉ hoặc giấy chứng nhận hoặc văn bằng đào tạo về KSNK\"], 3, \"Điều 25 khoản 5.\"],\n[\"Nội quy của cơ sở KBCB dành cho người bệnh, người nhà, khách thăm phải quy định về:\", [\"Giờ thăm; biện pháp cách ly; vệ sinh tay; vệ sinh cá nhân, không bao gồm phương tiện phòng hộ cá nhân\", \"Giờ thăm; biện pháp cách ly; thanh toán viện phí; vệ sinh bệnh viện và phân loại chất thải y tế\", \"Giờ thăm; vệ sinh tay; vệ sinh cá nhân; riêng cách ly và phân loại chất thải do nhân viên y tế thực hiện\", \"Giờ thăm; biện pháp cách ly; vệ sinh tay; vệ sinh cá nhân; sử dụng phương tiện phòng hộ cá nhân; vệ sinh bệnh viện và phân loại chất thải y tế\"], 3, \"Điều 25 khoản 5.\"],\n[\"Người đứng đầu cơ sở KBCB phải báo cáo kết quả thực hiện KSNK và:\", [\"Doanh thu của khoa KSNK\", \"Số lượng nhân viên được đào tạo KSNK\", \"Tỷ lệ tuân thủ vệ sinh tay của người bệnh\", \"Tỷ lệ nhiễm khuẩn bệnh viện theo quy định\"], 3, \"Điều 25 khoản 5.\"],\n[\"Tình huống: Bệnh viện ký hợp đồng thuê công ty giặt là đồ vải và xử lý chất thải. Theo Thông tư, bệnh viện phải:\", [\"Giao toàn bộ trách nhiệm cho công ty thuê ngoài, bệnh viện không phải giám sát hay chịu trách nhiệm\", \"Chọn đơn vị đủ tư cách pháp nhân, chỉ kiểm tra khi có sự cố và công ty chịu trách nhiệm chất lượng\", \"Chọn đơn vị đủ tư cách pháp nhân và giám sát định kỳ hằng năm; chất lượng do công ty chịu trách nhiệm\", \"Lựa chọn đơn vị đủ tư cách pháp nhân, thường xuyên giám sát; bệnh viện chịu trách nhiệm về chất lượng dịch vụ do đơn vị bên ngoài cung cấp\"], 3, \"Điều 25 khoản 5.\"],\n[\"Nhân viên y tế, giáo viên, học viên thực tập phải tuân thủ quy định KSNK, đặc biệt khi:\", [\"Làm việc ca đêm hoặc trực cấp cứu tại các khoa có nhiều người bệnh nặng\", \"Tham gia hội chẩn liên khoa hoặc hội chẩn toàn viện đối với ca bệnh khó\", \"Thực hiện phẫu thuật, thủ thuật và các kỹ thuật xâm lấn khác trên người bệnh\", \"Thực hiện thăm khám ban đầu và tư vấn sức khỏe cho người bệnh ngoại trú\"], 2, \"Điều 25 khoản 6.\"],\n[\"Người mắc, nghi ngờ mắc bệnh truyền nhiễm nhóm A và một số bệnh nhóm B do Bộ trưởng Bộ Y tế quy định phải:\", [\"Tuân thủ chế độ điều trị, cách ly, di chuyển hoặc ra viện theo quy định\", \"Tự quyết định thời điểm ra viện hoặc chuyển viện sau khi thông báo cho người nhà\", \"Chỉ cách ly khi người nhà hoặc người bệnh có yêu cầu và đồng ý bằng văn bản\", \"Chuyển sang cơ sở khác hoặc về nhà tự điều trị, cách ly mà không cần theo dõi\"], 0, \"Điều 25 khoản 7.\"],\n[\"Trách nhiệm của các trường đào tạo khối ngành sức khỏe là:\", [\"Đưa nội dung KSNK vào chương trình; bảo đảm sinh viên, học sinh được đào tạo về KSNK trước khi thực hành tại cơ sở KBCB\", \"Đào tạo KSNK cho giảng viên và cấp chứng chỉ KSNK cho sinh viên sau khi hoàn thành thực hành\", \"Đưa nội dung KSNK vào chương trình; sinh viên được đào tạo về KSNK sau khi thực hành tại cơ sở KBCB\", \"Chỉ đào tạo KSNK chuyên sâu cho nhân viên làm KSNK; sinh viên tự học KSNK trước khi thực hành\"], 0, \"Điều 25 khoản 8.\"],\n[\"Theo khoản 1 Điều 3, đối với các hướng dẫn, quy định, quy trình KSNK, cơ sở KBCB phải thực hiện:\", [\"Chỉ phổ biến các quy định do Bộ Y tế ban hành, không được tự xây dựng thêm quy định của cơ sở\", \"Xây dựng và phổ biến, còn việc phê duyệt do Sở Y tế địa phương thực hiện thay cơ sở\", \"Xây dựng, phê duyệt và phổ biến theo quy định tại Thông tư\", \"Xây dựng, phê duyệt và gửi Sở Y tế lưu trữ, không cần phổ biến cho nhân viên\"], 2, \"Điều 3 khoản 1.\"],\n[\"Theo khoản 2 Điều 3, kế hoạch KSNK của cơ sở KBCB được xây dựng, phê duyệt, phổ biến trên cơ sở nào?\", [\"Kế hoạch hành động quốc gia, mục tiêu chất lượng về KSNK, phù hợp nguồn lực và điều kiện thực tiễn của cơ sở, theo từng giai đoạn\", \"Kế hoạch hành động của Sở Y tế địa phương và chỉ tiêu thi đua hằng năm của cơ sở, theo từng quý\", \"Số liệu NKBV của năm trước, áp dụng thống nhất cho mọi cơ sở KBCB không phân biệt nguồn lực\", \"Yêu cầu của cơ quan quản lý khi xảy ra dịch bệnh, xây dựng một lần và không điều chỉnh theo giai đoạn\"], 0, \"Điều 3 khoản 2.\"],\n[\"Ngoài kiểm tra, giám sát tuân thủ quy định KSNK, Điều 5 còn yêu cầu cơ sở KBCB phải:\", [\"Xử phạt hành chính ngay những người vi phạm và thông báo công khai trong toàn cơ sở\", \"Yêu cầu người bệnh, người nhà và khách thăm ký cam kết tuân thủ trước khi vào khoa\", \"Chỉ nhắc nhở nhân viên y tế; người bệnh và khách thăm do bảo vệ cơ sở nhắc nhở\", \"Hướng dẫn, nhắc nhở nhân viên y tế, học viên, người bệnh, người nhà người bệnh và khách thăm tuân thủ quy định KSNK\"], 3, \"Điều 5 khoản 2.\"],\n[\"Về quy trình xử lý đồ vải y tế, Điều 9 yêu cầu cơ sở KBCB phải:\", [\"Giao hoàn toàn cho khu giặt là tự kiểm soát, chỉ kiểm tra khi có khiếu nại của khoa, phòng\", \"Kiểm soát chất lượng và thường xuyên kiểm tra, giám sát quy trình xử lý đồ vải\", \"Kiểm tra chất lượng đồ vải ở khâu cấp phát, không cần giám sát quy trình xử lý\", \"Chỉ kiểm tra, giám sát định kỳ hằng năm do Sở Y tế thực hiện thay cho cơ sở\"], 1, \"Điều 9 khoản 4.\"],\n[\"Tình huống: Khoa phát hiện nhân viên bỏ chung chất thải lây nhiễm và chất thải thông thường vào một túi. Theo Điều 10, cơ sở KBCB phải:\", [\"Chỉ nhắc nhở nhân viên, vì việc phân loại là trách nhiệm của đơn vị thu gom bên ngoài\", \"Xử lý theo quy định riêng của khoa, vì chất thải thông thường không thuộc phạm vi Thông tư\", \"Kiểm tra, giám sát để bảo đảm chất thải được phân loại, lưu giữ, vận chuyển, xử lý an toàn theo đúng quy định của pháp luật\", \"Chờ Sở Y tế kiểm tra định kỳ rồi mới điều chỉnh việc phân loại chất thải\"], 2, \"Điều 10 khoản 2.\"],\n[\"Tình huống: Nhiều người bệnh bị tiêu chảy sau bữa ăn từ nhà ăn bệnh viện. Theo Điều 12, cơ sở KBCB phải:\", [\"Tổ chức kiểm tra an toàn thực phẩm về vi sinh vật; giám sát, báo cáo các trường hợp nhiễm khuẩn liên quan đến thực phẩm\", \"Chuyển toàn bộ hồ sơ cho đơn vị cung cấp thực phẩm xử lý, cơ sở không có trách nhiệm giám sát\", \"Chỉ kiểm tra hóa chất bảo quản, vì Thông tư không yêu cầu kiểm tra vi sinh vật trong thực phẩm\", \"Chờ cơ quan quản lý an toàn thực phẩm xử lý, cơ sở không cần giám sát hay báo cáo\"], 0, \"Điều 12 khoản 1.\"],\n[\"Tình huống: Khoa KSNK đề xuất mua dung dịch sát khuẩn tay cho toàn bệnh viện. Theo Điều 15, việc quản lý hóa chất, vật tư KSNK gồm:\", [\"Mua số lượng lớn, dự trữ không giới hạn tại khoa để không bị thiếu khi cần\", \"Chỉ kiểm tra chất lượng khi nhập kho, việc sử dụng do từng khoa tự quản lý\", \"Ưu tiên mua loại rẻ nhất, định mức do nhà cung cấp quy định\", \"Xây dựng định mức, kiểm tra chất lượng, quản lý việc sử dụng an toàn, tiết kiệm và hiệu quả\"], 3, \"Điều 15 khoản 1, 2.\"],\n[\"Theo khoản 2 Điều 25, Cục Khoa học công nghệ và đào tạo chỉ đạo các trường khối ngành sức khỏe:\", [\"Cấp chứng chỉ KSNK cho sinh viên và kiểm tra việc thực hiện Thông tư tại các trường\", \"Đưa KSNK vào chương trình đào tạo; nâng cao năng lực giảng viên KSNK; đề xuất đầu tư cơ sở thực hành, tiền lâm sàng chuẩn hóa, hiện đại\", \"Đưa KSNK vào chương trình đào tạo; giảng viên KSNK do Cục Quản lý Khám, chữa bệnh đào tạo\", \"Tổ chức thực hành KSNK tại cơ sở KBCB và thẩm định hồ sơ cấp phép hoạt động của trường\"], 1, \"Điều 25 khoản 2.\"],\n[\"Ngoài việc đào tạo KSNK cho sinh viên, học sinh, các trường có đào tạo khối ngành sức khỏe còn có trách nhiệm:\", [\"Cấp phép hành nghề KSNK cho nhân viên y tế sau khi tốt nghiệp\", \"Thẩm định chương trình, tài liệu đào tạo liên tục về KSNK của các cơ sở KBCB\", \"Đào tạo chuyên sâu về KSNK cho nhân viên y tế làm công tác KSNK theo nhu cầu\", \"Kiểm tra việc thực hiện KSNK tại các cơ sở KBCB nơi sinh viên thực tập\"], 2, \"Điều 25 khoản 8.\"],\n[\"Phát biểu nào sau đây KHÔNG đúng về hệ thống KSNK theo Điều 16?\", [\"Cơ sở KBCB dưới 150 giường bệnh kế hoạch bắt buộc phải có khoa KSNK độc lập\", \"Cơ sở KBCB không có giường bệnh nội trú tối thiểu phải phân công một người phụ trách KSNK\", \"Cơ sở từ 150 giường bệnh kế hoạch trở lên phải có Hội đồng, khoa hoặc bộ phận và mạng lưới KSNK\", \"Người phụ trách KSNK ở cơ sở dưới 150 giường làm việc toàn thời gian và có chứng chỉ KSNK\"], 0, \"Điều 16 khoản 2, 3, 4.\"],\n[\"Phát biểu nào sau đây KHÔNG đúng về điều khoản chuyển tiếp (Điều 24)?\", [\"Cán bộ phụ trách KSNK tại Sở Y tế phải được đào tạo tối thiểu 01 tháng trước ngày 01/01/2021\", \"Nhân viên bộ phận giám sát và bộ phận khử khuẩn, tiệt khuẩn phải được đào tạo tối thiểu 03 tháng trước ngày 01/01/2022\", \"Người phụ trách KSNK ở cơ sở không có giường bệnh nội trú phải được đào tạo tối thiểu 05 ngày trước ngày 01/01/2021\", \"Nhân viên thuộc Hội đồng KSNK và mạng lưới KSNK phải được đào tạo tối thiểu 03 tháng trước ngày 01/01/2022\"], 3, \"Điều 24 khoản 4 (đúng là 05 ngày).\"],\n[\"Phát biểu nào sau đây KHÔNG đúng về Hội đồng KSNK (Điều 17)?\", [\"Hội đồng do Giám đốc quyết định thành lập và Giám đốc làm Chủ tịch Hội đồng\", \"Chủ tịch Hội đồng là trưởng khoa KSNK, còn thư ký Hội đồng là Giám đốc cơ sở KBCB\", \"Thành viên Hội đồng tối thiểu phải có lãnh đạo khoa vi sinh/xét nghiệm và khoa dược\", \"Hội đồng tư vấn cho Giám đốc về sửa chữa, thiết kế, xây dựng mới các công trình y tế\"], 1, \"Điều 17 khoản 1, 2.\"],\n[\"Phát biểu nào sau đây KHÔNG đúng về bộ phận giám sát KSNK (Điều 22)?\", [\"Cơ sở từ 150 giường bệnh trở lên phải có 1 nhân viên giám sát chuyên trách trên mỗi 150 giường bệnh\", \"Cơ sở không có giường bệnh nội trú thì người phụ trách KSNK thực hiện nhiệm vụ giám sát\", \"Nhân viên giám sát KSNK chuyên trách phải có trình độ đại học trở lên\", \"Bộ phận giám sát có quyền kiểm tra, giám sát hoạt động KSNK của người bệnh, người nhà và khách thăm\"], 2, \"Điều 22 khoản 1 (đúng là cao đẳng trở lên).\"],\n[\"Phát biểu nào sau đây KHÔNG đúng về trách nhiệm của người đứng đầu cơ sở KBCB (Điều 25 khoản 5)?\", [\"Nhân viên y tế đã công tác lâu năm tham gia hệ thống KSNK thì không cần có chứng chỉ đào tạo KSNK\", \"Xây dựng nội quy cho người bệnh, người nhà, khách thăm về giờ thăm, cách ly, vệ sinh tay, vệ sinh cá nhân\", \"Thực hiện nghiên cứu khoa học và hợp tác quốc tế về KSNK\", \"Báo cáo kết quả thực hiện KSNK và tỷ lệ nhiễm khuẩn bệnh viện theo quy định\"], 0, \"Điều 25 khoản 5.\"],\n[\"Biện pháp nào sau đây KHÔNG thuộc 13 biện pháp KSNK quy định tại Chương II của Thông tư?\", [\"Quản lý và xử lý đồ vải y tế\", \"Thẩm định điều kiện cấp giấy phép hoạt động của cơ sở KBCB\", \"Phòng ngừa và xử trí phơi nhiễm liên quan đến vi sinh vật\", \"An toàn thực phẩm\"], 1, \"Điều 3–15 (Chương II).\"],\n[\"Nội dung “giám sát nhiễm khuẩn bệnh viện và các bệnh truyền nhiễm có nguy cơ gây dịch” được quy định tại:\", [\"Điều 5\", \"Điều 13\", \"Điều 4\", \"Điều 14\"], 2, \"Điều 4.\"],\n[\"Nội dung “phòng ngừa và xử trí phơi nhiễm liên quan đến vi sinh vật” được quy định tại:\", [\"Điều 13\", \"Điều 12\", \"Điều 14\", \"Điều 15\"], 0, \"Điều 13.\"],\n[\"Nội dung “quản lý và xử lý đồ vải y tế” được quy định tại:\", [\"Điều 8\", \"Điều 10\", \"Điều 11\", \"Điều 9\"], 3, \"Điều 9.\"],\n[\"Tình huống: Bệnh viện có 100 giường bệnh kế hoạch, chỉ có một điều dưỡng kiêm nhiệm phụ trách KSNK và chưa có chứng chỉ KSNK. Theo Điều 16, bệnh viện này:\", [\"Đạt yêu cầu, vì cơ sở dưới 150 giường chỉ cần phân công một người kiêm nhiệm phụ trách KSNK\", \"Chưa đạt yêu cầu: cần có bộ phận KSNK, mạng lưới KSNK và người phụ trách toàn thời gian, thuộc khối ngành sức khỏe, có chứng chỉ KSNK\", \"Đạt yêu cầu nếu có Hội đồng KSNK do Giám đốc làm Chủ tịch, dù người phụ trách chưa có chứng chỉ\", \"Chưa đạt yêu cầu: cần thành lập khoa KSNK độc lập có đủ các bộ phận như bệnh viện từ 150 giường\"], 1, \"Điều 16 khoản 3.\"],\n[\"Tình huống: Bệnh viện có 300 giường bệnh và có 2 nhân viên giám sát KSNK chuyên trách đạt chuẩn. Theo Điều 22:\", [\"Chưa đạt, cần ít nhất 3 nhân viên vì cứ 100 giường bệnh phải có 1 nhân viên giám sát chuyên trách\", \"Chưa đạt, cần ít nhất 6 nhân viên vì cứ 50 giường bệnh phải có 1 nhân viên giám sát chuyên trách\", \"Đạt yêu cầu về số lượng, vì phải bảo đảm 1 nhân viên giám sát chuyên trách trên mỗi 150 giường bệnh\", \"Đạt, và có thể giảm còn 1 nhân viên vì bệnh viện đã có mạng lưới KSNK kiêm nhiệm\"], 2, \"Điều 22 khoản 1.\"]\n];\nvar ALL=Q.slice(),i=0,sc=0,AN=[],mode=\"p\",tl=0,tm=null,CFG={c:0,n:999,m:\"p\"};\nvar CN=[\"\", \"Điều 1–2 – Phạm vi, giải thích từ ngữ\", \"Điều 3–5 – Quy định, giám sát NKBV\", \"Điều 6–7 – Vệ sinh tay, phòng ngừa chuẩn\", \"Điều 8–9 – Dụng cụ y tế, đồ vải\", \"Điều 10–12 – Chất thải, vệ sinh môi trường, ATTP\", \"Điều 13–15 – Phơi nhiễm, dịch bệnh, hóa chất\", \"Điều 16 – Hệ thống KSNK\", \"Điều 17–19 – Hội đồng, khoa, mạng lưới\", \"Điều 20–22 – Trưởng khoa, ĐD trưởng, giám sát\", \"Điều 23–24 – Hiệu lực, chuyển tiếp\", \"Điều 25 – Trách nhiệm thực hiện\"];\nfunction sh(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=a[k];a[k]=a[j];a[j]=t}return a}\nfunction prep(){Q=sh(ALL).map(function(q){var ix=sh(q[1].map(function(_,k){return k}));return [q[0],ix.map(function(k){return q[1][k]}),ix.indexOf(q[2]),q[3]]})}\nfunction chap(q){var m=/^Điều (\\d+)/.exec(q[3]),n=m?+m[1]:0;return n\u003c=2?1:n\u003c=5?2:n\u003c=7?3:n\u003c=9?4:n\u003c=12?5:n\u003c=15?6:n==16?7:n\u003c=19?8:n\u003c=22?9:n\u003c=24?10:11}\nvar $=function(id){return document.getElementById(id)};\nfunction tab(n){$(\"sum\").classList.toggle(\"hide\",n!=1);$(\"quiz\").classList.toggle(\"hide\",n!=2);$(\"t1\").classList.toggle(\"on\",n==1);$(\"t2\").classList.toggle(\"on\",n==2);window.scrollTo(0,0)}\n$(\"t1\").onclick=function(){tab(1)};$(\"t2\").onclick=function(){tab(2)};\nfunction tk(){var t=$(\"tk\");if(t){var m=Math.floor(tl/60),s=tl%60;t.textContent=m+\":\"+(s\u003c10?\"0\":\"\")+s}}\nfunction setup(){\n clearI ion(o,k){h+='\u003cbutton class=\"opt\" data-k=\"'+k+'\">'+L[k]+'. '+o+'\u003c/button>'});\n h+='\u003cdiv id=\"ex\">\u003c/div>';\n $(\"box\").innerHTML=h;\n Array.prototype.forEach.call(document.querySelectorAll(\".opt\"),function(b){b.onclick=function(){pick(+b.dataset.k)}});\n tk();\n}\nfunction pick(k){\n var q=Q[i];AN[i]=k;if(k==q[2])sc++;\n if(mode==\"t\"){i++;show();return}\n var bs=document.querySelectorAll(\".opt\");\n Array.prototype.forEach.call(bs,function(b,j){b.disabled=true;if(j==q[2])b.classList.add(\"ok\")});\n if(k!=q[2])bs[k].classList.add(\"no\");\n $(\"ex\").innerHTML='\u003cdiv class=\"ex\">'+(k==q[2]?\"✅ Chính xác. \":\"❌ Chưa đúng. \")+q[3]+'\u003c/div>\u003cbutton class=\"btn\" id=\"nx\">'+(i==Q.length-1?\"Xem kết quả\":\"Câu tiếp theo\")+'\u003c/button>';\n $(\"nx\").onclick=function(){i++;show()};\n}\nfunction fin(){\n clearInterval(tm);\n $(\"pb\").style.width=\"100%\";$(\"box\").classList.add(\"hide\");$(\"res\").classList.remove(\"hide\");\n var n=Q.length,p=n?Math.round(sc/n*100):0,L=\"ABCD\";\n $(\"pg\").textContent=\"Hoàn thành\";\n var h='\u003cdiv class=\"score\">'+sc+'/'+n+' ('+p+'%)\u003c/div>\u003cp>'+(p>=80?\"Rất tốt! Bạn nắm vững nội dung thông tư.\":p>=60?\"Khá ổn. Hãy xem lại bảng “Nhớ nhanh” để củng cố.\":\"Cần ôn thêm. Hãy đọc lại phần tóm tắt rồi làm lại.\")+'\u003c/p>';\n if(mode==\"t\"){\n  var w=\"\";\n  Q.forEach(function(q,j){if(AN[j]!==q[2]){w+='\u003cdiv class=\"card\">\u003cdiv class=\"q\">'+(j+1)+'. '+q[0]+'\u003c/div>\u003cdiv class=\"ex\">'+(AN[j]==null?\"⏱ Chưa trả lời. \":\"Bạn chọn: \"+L[AN[j]]+\". \")+\"Đáp án đúng: \"+L[q[2]]+\". \"+q[1][q[2]]+\"\u003cbr>\"+q[3]+\"\u003c/div>\u003c/div>\"}});\n  h+=w?\"\u003ch2>Các câu cần xem lại\u003c/h2>\"+w:\"\u003cp>🎉 Không có câu nào sai!\u003c/p>\";\n }\n h+='\u003cbutton class=\"btn\" id=\"rs\">Làm lại (xáo trộn mới)\u003c/button> \u003cbutton class=\"btn\" id=\"st\">Chọn lại chủ đề/chế độ\u003c/button>';\n $(\"res\").innerHTML=h;\n $(\"rs\").onclick=function(){start(CFG)};\n $(\"st\").onclick=setup;\n}\nsetup();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "qd3916": "\u003c!DOCTYPE html>\n\u003chtml lang=\"vi\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Quyết định 3916/QĐ-BYT – Hướng dẫn kiểm soát nhiễm khuẩn: Tóm tắt & Trắc nghiệm\u003c/title>\n\u003cstyle>\n:root{--bg:#f6f8fa;--card:#fff;--tx:#1b2a33;--mu:#5b6b75;--ac:#0b7a75;--ac2:#e3f4f2;--ok:#1e8e3e;--okb:#e6f4ea;--no:#c5221f;--nob:#fce8e6;--bd:#d9e1e6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10191e;--card:#18242b;--tx:#e6eef2;--mu:#9bb0bb;--ac:#4fd1c5;--ac2:#14363a;--ok:#6fd58a;--okb:#143323;--no:#ff8a84;--nob:#3a1b1a;--bd:#2c3d46;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#10191e;--card:#18242b;--tx:#e6eef2;--mu:#9bb0bb;--ac:#4fd1c5;--ac2:#14363a;--ok:#6fd58a;--okb:#143323;--no:#ff8a84;--nob:#3a1b1a;--bd:#2c3d46;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nmain{max-width:860px;margin:0 auto;padding:16px}\nh1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.2rem;margin:1.6em 0 .6em;color:var(--ac)}\n.sub{color:var(--mu);margin:0 0 12px}\n.tabs{display:flex;gap:8px;margin:12px 0}\n.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}\n.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}\ndetails.card summary{cursor:pointer;font-weight:600}\ndetails.card ul{margin:.5em 0 0;padding
