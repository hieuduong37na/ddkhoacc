grid-column:2;position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;max-width:none;margin:0}\n #box{grid-template-columns:1fr}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003ch1>Thông tư 20/2021/TT-BYT\u003c/h1>\n\u003cp class=\"sub\">Quản lý chất thải y tế trong phạm vi khuôn viên cơ sở y tế · Ban hành 26/11/2021 · Hiệu lực 10/01/2022 · 4 chương, 16 điều, 7 phụ lục · Thay thế TTLT 58/2015/TTLT-BYT-BTNMT\u003c/p>\n\u003cdiv class=\"tabs\">\u003cbutton id=\"t1\" class=\"on\">📘 Tóm tắt\u003c/button>\u003cbutton id=\"t2\">📝 Trắc nghiệm (133 câu · xáo trộn)\u003c/button>\u003c/div>\n\n\u003csection id=\"sum\">\n\u003cdiv class=\"note\">Phạm vi: quản lý chất thải y tế \u003cb>trong khuôn viên\u003c/b> cơ sở y tế. Không áp dụng cho chất thải phóng xạ (theo quy định của Bộ Khoa học và Công nghệ). Trang nguồn tra cứu ghi Thông tư đang có hiệu lực, nhưng bạn vẫn nên đối chiếu bản hiện hành trước khi dùng cho công việc.\u003c/div>\n\u003ch2>Nhớ nhanh\u003c/h2>\n\u003cdiv class=\"card tw\">\u003ctable>\n\u003ctr>\u003cth>Nội dung\u003c/th>\u003cth>Quy định\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Màu bao bì, thùng\u003c/td>\u003ctd>Vàng: lây nhiễm · Đen: nguy hại không lây nhiễm (rắn) · Xanh: thông thường không tái chế · Trắng: thông thường tái chế\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Thu gom lây nhiễm\u003c/td>\u003ctd>Tối thiểu 1 lần/ngày; cơ sở dưới 5 kg/ngày: sắc nhọn tối thiểu 1 lần/tháng\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lưu giữ lây nhiễm\u003c/td>\u003ctd>≤ 2 ngày; lạnh dưới 8°C: ≤ 7 ngày; dưới 5 kg/ngày: ≤ 3 ngày; từ nơi khác về (cụm): xử lý trong ngày, hoặc dưới 20°C ≤ 2 ngày\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lưu giữ nguy hại không lây nhiễm\u003c/td>\u003ctd>≤ 1 năm; quá hạn phải báo cáo cơ quan có thẩm quyền\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Sổ, mẫu\u003c/td>\u003ctd>PL 04: sổ bàn giao tái chế · PL 05: nhật ký vận hành · PL 06: sổ giao nhận CTNH (2 sổ) · PL 07: mẫu báo cáo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Báo cáo\u003c/td>\u003ctd>1 năm/lần, kỳ 15/12–14/12; cơ sở gửi Sở Y tế trước 16/12; Sở Y tế gửi Bộ Y tế (Cục Quản lý môi trường y tế) trước 20/12\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hiệu lực\u003c/td>\u003ctd>10/01/2022; thay Thông tư liên tịch 58/2015/TTLT-BYT-BTNMT\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch2>Chi tiết theo chương và điều\u003c/h2>\n\u003cdetails class=\"card\" open>\u003csummary>Chương I – Quy định chung (Điều 1–3)\u003c/summary>\u003cul>\n\u003cli>\u003cb>Điều 1:\u003c/b> quy định chi tiết việc phân loại, thu gom, lưu giữ, quản lý chất thải y tế trong khuôn viên cơ sở y tế; không quy định chất thải phóng xạ.\u003c/li>\n\u003cli>\u003cb>Điều 2 – Đối tượng:\u003c/b> cơ sở khám bệnh, chữa bệnh có giấy phép hoạt động; cơ sở y tế dự phòng; cơ sở đào tạo khối ngành sức khỏe; cơ sở nghiên cứu, xét nghiệm, kiểm nghiệm, kiểm định, thử nghiệm y, dược có phát sinh chất thải y tế; cơ quan, tổ chức, cá nhân trong và ngoài nước có hoạt động liên quan trên lãnh thổ Việt Nam.\u003c/li>\n\u003cli>\u003cb>Điều 3 – Giải thích:\u003c/b> (1) chất thải y tế = nguy hại + rắn thông thường + khí thải + lỏng không nguy hại + nước thải y tế; (2) chất thải lây nhiễm = thấm, dính, chứa máu của cơ thể hoặc chứa vi sinh vật gây bệnh; (3) thu gom = tập hợp từ nơi phát sinh về khu lưu giữ tạm thời hoặc nơi xử lý trong khuôn viên.\u003c/li>\u003c/ul>\u003c/details>\n\u003cdetails class=\"card\">\u003csummary>Điều 4 – Phân định chất thải y tế\u003c/summary>\u003cul>\n\u003cli>\u003cb>K1:\u003c/b> nguy hại = lây nhiễm + nguy hại không lây nhiễm.\u003c/li>\n\u003cli>\u003cb>K2 – Lây nhiễm (4 nhóm):\u003c/b>\u003cbr>a) \u003cb>Sắc nhọn:\u003c/b> kim tiêm, bơm liền kim tiêm, đầu sắc nhọn của dây truyền, kim chọc dò, kim châm cứu, lưỡi dao mổ, đinh, cưa dùng trong phẫu thuật, ống tiêm, mảnh thủy tinh vỡ, vật sắc nhọn khác đã qua sử dụng có dính, chứa máu hoặc vi sinh vật gây bệnh.\u003cbr>b) \u003cb>Không sắc nhọn:\u003c/b> bông, băng, gạc, găng tay và chất thải không sắc nhọn thấm, dính, chứa máu hoặc vi sinh vật gây bệnh; vỏ lọ vắc xin bất hoạt hoặc giảm độc lực thải bỏ; chất thải lây nhiễm dạng lỏng (dịch dẫn lưu sau phẫu thuật, thủ thuật, dịch thải bỏ chứa máu hoặc vi sinh vật).\u003cbr>c) \u003cb>Nguy cơ lây nhiễm cao:\u003c/b> mẫu bệnh phẩm, dụng cụ đựng, dính mẫu bệnh phẩm từ phòng xét nghiệm tương đương an toàn sinh học cấp II trở lên; chất thải từ buồng bệnh cách ly, khu điều trị cách ly, khu lấy mẫu xét nghiệm người mắc bệnh truyền nhiễm nguy hiểm nhóm A, B.\u003cbr>d) \u003cb>Giải phẫu:\u003c/b> mô, bộ phận cơ thể người thải bỏ, xác động vật thí nghiệm.\u003c/li>\n\u003cli>\u003cb>K3 – Nguy hại không lây nhiễm:\u003c/b> (a) hóa chất thải bỏ có thành phần, tính chất nguy hại vượt ngưỡng hoặc có cảnh báo nguy hại của nhà sản xuất; (b) dược phẩm nhóm gây độc tế bào hoặc có cảnh báo nguy hại; (c) vỏ chai, lọ, dụng cụ dính thuốc, hóa chất nhóm gây độc tế bào hoặc có cảnh báo nguy hại; (d) thiết bị y tế vỡ, hỏng chứa thủy ngân, cadimi; pin, ắc quy; vật liệu tráng chì ngăn tia xạ; (đ) dung dịch rửa phim X-quang, nước thải từ thiết bị xét nghiệm, phân tích và dung dịch thải có yếu tố nguy hại vượt ngưỡng; (e) chất thải khác có tính chất nguy hại vượt ngưỡng hoặc có cảnh báo.\u003c/li>\n\u003cli>\u003cb>K4 – Rắn thông thường:\u003c/b> (a) rác sinh hoạt của nhân viên, người bệnh, người nhà, học viên, khách và rác ngoại cảnh (\u003cu>trừ\u003c/u> khu cách ly, điều trị bệnh truyền nhiễm nguy hiểm); (b) hóa chất không nguy hại vượt ngưỡng; (c) vỏ chai, lọ, dụng cụ dính thuốc, hóa chất không thuộc nhóm gây độc tế bào, không có cảnh báo; (d) vỏ lọ vắc xin không bất hoạt, không giảm độc lực; (đ) sắc nhọn không lây nhiễm, không nguy hại vượt ngưỡng; (e) chất thải lây nhiễm đã xử lý đạt quy chuẩn kỹ thuật quốc gia về môi trường; (g) bùn thải từ xử lý nước thải, tro xỉ từ lò đốt không nguy hại vượt ngưỡng; (h) chất thải rắn thông thường khác; (i) danh mục được thu gom tái chế (PL 01).\u003c/li>\n\u003cli>\u003cb>K5 – Khí thải:\u003c/b> từ phòng xét nghiệm tác nhân gây bệnh truyền nhiễm nguy hiểm lây qua đường không khí; từ phòng xét nghiệm an toàn sinh học cấp III trở lên.\u003c/li>\n\u003cli>\u003cb>K6 – Lỏng không nguy hại:\u003c/b> dung dịch thuốc, hóa chất thải bỏ không gây độc tế bào, không cảnh báo nguy hại, không yếu tố nguy hại vượt ngưỡng, không chứa vi sinh vật gây bệnh.\u003c/li>\n\u003cli>\u003cb>K7 – Nước thải y tế:\u003c/b> nước thải từ hoạt động chuyên môn; nước thải sinh hoạt thải chung vào hệ thống thu gom nước thải y tế thì quản lý như nước thải y tế.\u003c/li>\u003c/ul>\u003c/details>\n\u003cdetails class=\"card\">\u003csummary>Điều 5 – Bao bì, dụng cụ, thiết bị lưu chứa\u003c/summary>\u003cul>\n\u003cli>\u003cb>K1:\u003c/b> lưu chứa an toàn, chống thấm, chống rò rỉ, kích thước phù hợp lượng chất thải; có tên loại chất thải và biểu tượng theo PL 02.\u003c/li>\n\u003cli>\u003cb>K2:\u003c/b> màu sắc theo khoản 3, 4, 5, 6 Điều 6.\u003c/li>\n\u003cli>\u003cb>K3:\u003c/b> nắp đóng, mở thuận tiện; có thể tái sử dụng sau khi làm sạch và khử khuẩn.\u003c/li>\n\u003cli>\u003cb>K4:\u003c/b> đựng sắc nhọn: thành, đáy cứng, kháng thủng; miệng thiết kế an toàn tránh tràn đổ, rơi vãi.\u003c/li>\n\u003cli>\u003cb>K5:\u003c/b> đựng lây nhiễm: nắp đậy kín, chống động vật xâm nhập.\u003c/li>\n\u003cli>\u003cb>K6:\u003c/b> đựng hóa chất: vật liệu không phản ứng với chất thải, chống ăn mòn nếu chất thải có tính ăn mòn.\u003c/li>\n\u003cli>\u003cb>K7:\u003c/b> đựng chất thải nguy hại dạng lỏng: nắp đậy kín, chống bay hơi, tràn đổ.\u003c/li>\n\u003cli>\u003cb>K8:\u003c/b> xử lý bằng phương pháp đốt: không dùng nhựa PVC.\u003c/li>\u003c/ul>\u003c/details>\n\u003cdetails class=\"card\">\u003csummary>Điều 6 – Phân loại chất thải y tế\u003c/summary>\u003cul>\n\u003cli>\u003cb>K1 – Nguyên tắc:\u003c/b> (a) phân loại ngay tại nơi và thời điểm phát sinh; (b) từng loại phân loại riêng vào bao bì theo Điều 5; chất thải nguy hại không phản ứng, tương tác nhau và cùng phương pháp xử lý có thể phân loại chung (\u003cu>trừ\u003c/u> sắc nhọn lây nhiễm); (c) chất thải lây nhiễm lẫn chất thải khác: cả hỗn hợp quản lý như lây nhiễm, sau xử lý tiếp tục quản lý theo tính chất chất thải sau xử lý.\u003c/li>\n\u003cli>\u003cb>K2 – Vị trí đặt:\u003c/b> khoa, phòng, bộ phận bố trí vị trí phù hợp, an toàn; tại vị trí đặt phải có hướng dẫn cách phân loại và thu gom.\u003c/li>\u003c/ul>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Loại chất thải\u003c/th>\u003cth>Dụng cụ\u003c/th>\u003cth>Màu\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Lây nhiễm sắc nhọn\u003c/td>\u003ctd>Thùng hoặc hộp kháng thủng\u003c/td>\u003ctd>Vàng\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lây nhiễm không sắc nhọn; nguy cơ lây nhiễm cao\u003c/td>\u003ctd>Thùng có lót túi\u003c/td>\u003ctd>Vàng\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Giải phẫu\u003c/td>\u003ctd>2 lần túi hoặc thùng có lót túi\u003c/td>\u003ctd>Vàng\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lây nhiễm dạng lỏng\u003c/td>\u003ctd>Túi kín hoặc dụng cụ chứa chất lỏng có nắp đậy kín\u003c/td>\u003ctd>Không quy định màu\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Nguy hại không lây nhiễm, rắn\u003c/td>\u003ctd>Túi, thùng hoặc thùng lót túi; phân loại theo mã CTNH\u003c/td>\u003ctd>Đen\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Nguy hại không lây nhiễm, lỏng\u003c/td>\u003ctd>Dụng cụ chứa chất lỏng nắp đậy kín, có mã và tên loại\u003c/td>\u003ctd>Không quy định màu\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Rắn thông thường không tái chế\u003c/td>\u003ctd>Túi, thùng hoặc thùng lót túi (sắc nhọn: dụng cụ kháng thủng)\u003c/td>\u003ctd>Xanh\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Rắn thông thường tái chế\u003c/td>\u003ctd>Túi, thùng hoặc thùng lót túi\u003c/td>\u003ctd>Trắng\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lỏng không nguy hại\u003c/td>\u003ctd>Dụng cụ nắp đậy kín, có tên loại chất thải\u003c/td>\u003ctd>Không quy định màu\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/details>\n\u003cdetails class=\"card\">\u003csummary>Điều 7 – Thu gom\u003c/summary>\u003cul>\n\u003cli>\u003cb>K1 – Lây nhiễm:\u003c/b> (a) quy định luồng đi, thời điểm thu gom để hạn chế ảnh hưởng khu chăm sóc người bệnh; (b) dụng cụ thu gom kín, không rò rỉ dịch; (c) thu gom riêng về khu lưu giữ tạm thời, túi buộc kín miệng, thùng có nắp đậy kín; (d) nguy cơ lây nhiễm cao: xử lý sơ bộ gần nơi phát sinh bằng thiết bị khử khuẩn; nếu không có thiết bị: buộc kín túi, bỏ tiếp vào túi lây nhiễm thứ 2, buộc kín, bỏ vào thùng thu gom, dán nhãn “CHẤT THẢI CÓ NGUY CƠ LÂY NHIỄM CAO”, thu gom và lưu giữ riêng để xử lý hoặc chuyển đơn vị có chức năng; (đ) dạng lỏng vào hệ thống thu gom nước thải y tế; (e) tần suất tối thiểu 1 lần/ngày; dưới 5 kg/ngày: sắc nhọn tối thiểu 1 lần/tháng.\u003c/li>\n\u003cli>\u003cb>K2 – Nguy hại không lây nhiễm:\u003c/b> thu gom, lưu giữ riêng; thiết bị chứa thủy ngân vỡ, hỏng: hộp nhựa hoặc vật liệu phù hợp, không rò rỉ, không phát tán hơi thủy ngân.\u003c/li>\n\u003cli>\u003cb>K3:\u003c/b> rắn thông thường tái chế và không tái chế thu gom riêng. \u003cb>K4:\u003c/b> lỏng không nguy hại vào hệ thống thu gom nước thải. \u003cb>K5:\u003c/b> khí thải xử lý loại bỏ vi sinh vật gây bệnh trước khi xả. \u003cb>K6:\u003c/b> hệ thống thu gom nước thải là hệ thống kín, thu gom toàn bộ nước thải; xử lý theo pháp luật về nước thải.\u003c/li>\u003c/ul>\u003c/details>\n\u003cdetails class=\"card\">\u003csummary>Điều 8 – Lưu giữ\u003c/summary>\u003cul>\n\u003cli>\u003cb>K1 – Khu lưu giữ:\u003c/b> bệnh viện và cơ sở xử lý theo mô hình cụm: Mục A PL 03; cơ sở khác: Mục B PL 03.\u003c/li>\n\u003cli>\u003cb>K2:\u003c/b> lưu giữ riêng từng loại, trừ khi cùng tính chất, không phản ứng, tương tác và xử lý cùng một phương pháp.\u003c/li>\u003c/ul>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Trường hợp\u003c/th>\u003cth>Thời gian lưu giữ\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Lây nhiễm phát sinh tại cơ sở\u003c/td>\u003ctd>≤ 2 ngày; thiết bị lạnh dưới 8°C: ≤ 7 ngày\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lây nhiễm từ cơ sở khác về (mô hình cụm, tập trung)\u003c/td>\u003ctd>Xử lý ngay trong ngày; chưa xử lý: dưới 20°C, ≤ 2 ngày\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cơ sở dưới 5 kg/ngày\u003c/td>\u003ctd>≤ 3 ngày (bình thường), bao bì buộc kín hoặc thiết bị đậy nắp kín\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Nguy hại không lây nhiễm\u003c/td>\u003ctd>≤ 1 năm; quá hạn do chưa có phương án hoặc cơ sở xử lý: báo cáo bằng văn bản riêng hoặc trong báo cáo hằng năm (Điều 13) cho cơ quan có thẩm quyền\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Vùng sâu, vùng xa, miền núi, hải đảo khó khăn\u003c/td>\u003ctd>Sắc nhọn lưu giữ trong bể bê tông trong khuôn viên sau tiệt khuẩn, có biển cảnh báo\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/details>\n\u003cdetails class=\"card\">\u003csummary>Điều 9–12 – Giảm thiểu, tái chế, vận hành, chuyển giao\u003c/summary>\u003cul>\n\u003cli>\u003cb>Điều 9 – Giảm thiểu (4 biện pháp):\u003c/b> (1) mua sắm, lắp đặt, sử dụng vật tư, thiết bị, thuốc, hóa chất phù hợp nhu cầu; (2) đổi mới thiết bị, quy trình chuyên môn; (3) có biện pháp, lộ trình hạn chế sản phẩm nhựa dùng một lần, túi ni lông khó phân hủy; (4) phân loại chất thải nhựa để tái chế hoặc xử lý theo pháp luật.\u003c/li>\n\u003cli>\u003cb>Điều 10 – Tái chế:\u003c/b> (1) cơ sở ban hành danh mục thu gom tái chế dựa trên PL 01, phù hợp tình hình phát sinh; (2) chất thải lây nhiễm đã xử lý đạt quy chuẩn được quản lý như rắn thông thường và thu gom tái chế; khi chuyển giao: bao bì buộc kín, bên ngoài có biểu tượng chất thải tái chế (PL 02), ghi đầy đủ vào sổ PL 04; (3) chất thải nhựa phân loại, thu gom để tái chế hoặc xử lý theo pháp luật.\u003c/li>\n\u003cli>\u003cb>Điều 11 – Vận hành:\u003c/b> (1) cơ sở tự xử lý hoặc xử lý theo cụm vận hành thường xuyên theo hướng dẫn nhà sản xuất, bảo đảm đạt quy chuẩn, tuân thủ giám sát, quan trắc môi trường; (2) bảo trì, bảo dưỡng định kỳ theo hướng dẫn nhà sản xuất, ghi đầy đủ vào sổ nhật ký vận hành (PL 05).\u003c/li>\n\u003cli>\u003cb>Điều 12 – Chuyển giao (cơ sở không tự xử lý):\u003c/b> (a) nguy hại: giao đơn vị có giấy phép phù hợp, ghi lượng sau mỗi lần vào sổ giao nhận (PL 06), dùng chứng từ CTNH; (b) rắn thông thường: giao đơn vị có chức năng phù hợp vận chuyển, xử lý; (3) đơn vị nhận vận chuyển theo quy định, không làm thất thoát, xử lý đạt quy chuẩn kỹ thuật về môi trường; (4) xử lý nguy hại theo mô hình cụm do UBND tỉnh, thành phố trực thuộc Trung ương phê duyệt, bàn giao ghi vào sổ PL 06.\u003c/li>\u003c/ul>\u003c/details>\n\u003cdetails class=\"card\">\u003csummary>Chương III – Báo cáo và hồ sơ (Điều 13–14)\u003c/summary>\u003cul>\n\u003cli>\u003cb>Điều 13:\u003c/b> (1) 1 năm/lần, từ 15/12 năm trước đến 14/12 năm báo cáo; (2) gửi bằng văn bản giấy, bản điện tử hoặc qua phần mềm; (3a) cơ sở báo cáo theo Mục A PL 07, gửi Sở Y tế (hoặc Bộ Y tế – Cục Quản lý môi trường y tế với cơ sở trực thuộc Bộ) trước 16/12; (3b) Sở Y tế tổng hợp theo Mục B PL 07, gửi Bộ Y tế (Cục Quản lý môi trường y tế) trước 20/12.\u003c/li>\n\u003cli>\u003cb>Điều 14 – Hồ sơ lưu tại cơ sở (6 nhóm):\u003c/b> (1) giấy phép môi trường và văn bản, hồ sơ môi trường liên quan (nếu thuộc diện phải xin); (2) sổ giao nhận chất thải y tế, chứng từ CTNH (nếu có); (3) sổ nhật ký vận hành (cơ sở tự xử lý); (4) biên bản thanh tra, kiểm tra (nếu có); (5) báo cáo hằng năm và báo cáo quan trắc định kỳ (nếu có); (6) tài liệu liên quan khác.\u003c/li>\u003c/ul>\u003c/details>\n\u003cdetails class=\"card\">\u003csummary>Chương IV – Trách nhiệm và thi hành (Điều 15–16)\u003c/summary>\u003cul>\n\u003cli>\u003cb>Cục Quản lý môi trường y tế:\u003c/b> chỉ đạo, hướng dẫn, kiểm tra thực hiện Thông tư; ban hành hướng dẫn chuyên môn kỹ thuật; đào tạo, tập huấn, phổ biến, truyền thông cho Sở Y tế và cơ sở y tế thuộc thẩm quyền.\u003c/li>\n\u003cli>\u003cb>Sở Y tế:\u003c/b> chỉ đạo, hướng dẫn, kiểm tra trên địa bàn; tập huấn, phổ biến, truyền thông; chỉ đạo cơ sở trực thuộc lập kế hoạch quản lý chất thải y tế; phối hợp Sở Tài chính đề xuất phân bổ kinh phí đầu tư, nâng cấp, vận hành công trình, thiết bị, hệ thống xử lý; báo cáo theo Điều 13.\u003c/li>\n\u003cli>\u003cb>Cơ sở y tế:\u003c/b> (a) thực hiện Thông tư và pháp luật liên quan; (b) phân công lãnh đạo phụ trách, bố trí cán bộ chuyên trách, giao khoa Kiểm soát nhiễm khuẩn hoặc khoa, phòng, bộ phận phụ trách, bố trí người vận hành hoặc phối hợp đơn vị ngoài (nếu tự xử lý); (c) xây dựng kế hoạch riêng hoặc tích hợp trong kế hoạch chung hằng năm, bố trí kinh phí; (d) xác định các loại chất thải phát sinh để áp dụng biện pháp phù hợp; (đ) kế hoạch, biện pháp, trang thiết bị ứng phó sự cố môi trường, gồm phương án khi lượng chất thải nguy hại tăng bất thường do dịch bệnh hoặc bất khả kháng; (e) đào tạo, tập huấn, truyền thông cho viên chức, người lao động và đối tượng liên quan; (g) báo cáo theo Điều 13.\u003c/li>\n\u003cli>\u003cb>Điều 16:\u003c/b> hiệu lực 10/01/2022; TTLT 58/2015/TTLT-BYT-BTNMT hết hiệu lực từ ngày này; vướng mắc phản ánh về Bộ Y tế (Cục Quản lý môi trường y tế).\u003c/li>\u003c/ul>\u003c/details>\n\u003ch2>Phụ lục\u003c/h2>\n\u003cdetails class=\"card\">\u003csummary>PL 01 – Danh mục rắn thông thường được thu gom tái chế\u003c/summary>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Vật liệu\u003c/th>\u003cth>Loại chất thải\u003c/th>\u003cth>Yêu cầu\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Giấy\u003c/td>\u003ctd>Giấy, báo, bìa, thùng carton, vỏ hộp thuốc\u003c/td>\u003ctd>Không thấm, dính, chứa máu, vi sinh vật gây bệnh hoặc yếu tố nguy hại vượt ngưỡng\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd rowspan=\"4\">Nhựa\u003c/td>\u003ctd>Chai nhựa đựng thuốc, hóa chất không thuộc nhóm gây độc tế bào, không cảnh báo nguy hại\u003c/td>\u003ctd>Không thấm, dính, chứa máu, không chứa vi sinh vật gây bệnh\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Chai nước giải khát nhựa và sản phẩm nhựa sinh hoạt thường ngày\u003c/td>\u003ctd>Không thải ra từ khu cách ly, điều trị bệnh truyền nhiễm nguy hiểm nhóm A, B\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Chai dịch truyền, dây truyền, bơm tiêm nhựa (không gồm đầu sắc nhọn), vật liệu nhựa khác\u003c/td>\u003ctd>Không thấm, dính, chứa máu, vi sinh vật gây bệnh, yếu tố nguy hại\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Nhóm trên đã xử lý đạt quy chuẩn kỹ thuật quốc gia về môi trường\u003c/td>\u003ctd>Không chứa yếu tố nguy hại\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Kim loại\u003c/td>\u003ctd>Chai, lon nước giải khát và kim loại sinh hoạt thường ngày\u003c/td>\u003ctd>Không thải ra từ khu cách ly nhóm A, B\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Thủy tinh\u003c/td>\u003ctd>Vỏ chai, lọ, lọ thuốc thủy tinh thải bỏ\u003c/td>\u003ctd>Không dính, chứa thuốc, hóa chất gây độc tế bào hoặc cảnh báo nguy hại; không thấm, dính máu, không chứa vi sinh vật gây bệnh\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/details>\n\u003cdetails class=\"card\">\u003csummary>PL 02, 03, 04 – Biểu tượng, khu lưu giữ, sổ bàn giao tái chế\u003c/summary>\u003cul>\n\u003cli>\u003cb>PL 02:\u003c/b> biểu tượng trên bao bì, dụng cụ lưu chứa; trình bày, thiết kế, màu dấu hiệu cảnh báo chất thải nguy hại theo TCVN 5053:1990.\u003c/li>\n\u003cli>\u003cb>PL 03 Mục A (bệnh viện, mô hình cụm):\u003c/b> (1) biển cảnh báo, mái che, nền không ngập lụt, tránh nước mưa chảy tràn vào và không chảy tràn chất lỏng ra ngoài khi rò rỉ, có hệ thống thu gom nước thải; (2) chia ô hoặc dụng cụ riêng cho từng loại hoặc nhóm cùng tính chất, có tên loại, mã CTNH, biểu tượng; chất thải khác nhau nhưng cùng phương pháp xử lý được lưu chung; (3) vật liệu hấp thụ (cát khô, mùn cưa) và xẻng khi rò rỉ, đổ tràn CTNH lỏng; (4) thiết bị phòng cháy chữa cháy; (5) thường xuyên vệ sinh, khử khuẩn dụng cụ; (6) vòi nước, dung dịch vệ sinh, khử khuẩn.\u003c/li>\n\u003cli>\u003cb>PL 03 Mục B (cơ sở khác):\u003c/b> vị trí có biển cảnh báo; thùng, dụng cụ riêng có nắp đậy kín cho từng loại hoặc nhóm cùng tính chất, có tên loại, mã CTNH, biểu tượng; chất thải cùng phương pháp xử lý được lưu chung; thường xuyên vệ sinh, khử khuẩn dụng cụ.\u003c/li>\n\u003cli>\u003cb>PL 04:\u003c/b> sổ bàn giao chất thải đã khử khuẩn đạt quy chuẩn phục vụ tái chế; cột gồm ngày bàn giao, đơn vị tính (túi, hộp, thùng, kiện), số lượng, trọng lượng mỗi đơn vị, mẻ số, tổng (kg), người giao, người nhận.\u003c/li>\u003c/ul>\u003c/details>\n\u003cdetails class=\"card\">\u003csummary>PL 05, 06 – Nhật ký vận hành, sổ giao nhận CTNH\u003c/summary>\u003cul>\n\u003cli>\u003cb>PL 05 (3 mẫu):\u003c/b> I. nhật ký vận hành lò đốt (thời điểm bắt đầu, kết thúc, nhiệt độ và bất thường, lượng chất thải đốt, nhận xét, người vận hành); II. nhật ký thiết bị xử lý chất thải rắn lây nhiễm công nghệ không đốt (giờ, nhiệt độ, thời gian khử khuẩn, số lượng mỗi mẻ, người vận hành); III. nhật ký hệ thống xử lý nước thải (thời điểm vận hành, tình trạng, khử trùng, bảo trì, lưu lượng, người vận hành). Cơ sở có từ 2 công trình, thiết bị trở lên: mỗi công trình lập một sổ.\u003c/li>\n\u003cli>\u003cb>PL 06:\u003c/b> cột gồm ngày bàn giao, lượng chất thải (lây nhiễm: sắc nhọn, không sắc nhọn, nguy cơ cao, giải phẫu; nguy hại không lây nhiễm theo từng loại), tổng số, người giao, người nhận. Sổ thay chứng từ CTNH với cơ sở xử lý theo mô hình cụm khi bàn giao; với cơ sở thuê đơn vị có giấy phép xử lý tập trung, sổ dùng để theo dõi lượng bàn giao trong tháng làm cơ sở xuất chứng từ CTNH hằng tháng. Lập 2 sổ (chủ nguồn thải giữ 1, cơ sở xử lý giữ 1), ký nhận cả hai sổ mỗi lần giao nhận, không tẩy xóa, sửa chữa.\u003c/li>\u003c/ul>\u003c/details>\n\u003cdetails class=\"card\">\u003csummary>PL 07 – Mẫu báo cáo\u003c/summary>\u003cul>\n\u003cli>\u003cb>Mục A (cơ sở y tế), kỳ 15/12–14/12:\u003c/b> Phần 1 thông tin chung (tên, địa chỉ, mã số quản lý CTNH, lãnh đạo phụ trách, đầu mối, số giường kế hoạch và thực kê, số cán bộ nhân viên, số lượt khám, lượng nước sử dụng); Phần 2 kết quả: 2.1 tình hình chung (đào tạo, tập huấn cho 5 nhóm: lãnh đạo, chuyên trách, nhân viên y tế, nhân viên thu gom lưu giữ, nhân viên vận hành; truyền thông, phổ biến; thanh tra, kiểm tra; quan trắc môi trường), 2.2 thống kê chất thải phát sinh và xử lý, 2.3 xử lý theo mô hình cụm, 2.4 chất thải nhựa, 2.5 nhân lực, 2.6 công trình, thiết bị xử lý; Phần 3 kế hoạch năm tiếp theo; Phần 4 vấn đề khác; Phần 5 kết luận, kiến nghị; thủ trưởng cơ sở ký, đóng dấu.\u003c/li>\n\u003cli>\u003cb>Ký hiệu phương pháp tự xử lý:\u003c/b> chất thải nguy hại: KĐ (hấp ướt, vi sóng), C (chôn lấp), LĐ (lò đốt 2 buồng), TC (đốt 1 buồng hoặc đốt thủ công), K (khác); nước thải: HTXLNT (qua hệ thống xử lý), KT (chỉ khử trùng trước khi xả), KXL (không xử lý, thải thẳng).\u003c/li>\n\u003cli>\u003cb>Mục B (Sở Y tế), gửi Cục Quản lý môi trường y tế:\u003c/b> Phần 1 thông tin chung; Phần 2 hoạt động quản lý, chỉ đạo điều hành (kế hoạch năm, chỉ đạo, hướng dẫn, kiểm tra); Phần 3 kết quả: 3.1 tình hình chung (số cơ sở và giường bệnh, đào tạo và truyền thông, thanh kiểm tra, quan trắc nước thải, khí thải, giám sát hiệu quả thiết bị xử lý), 3.2 thống kê chất thải, 3.3 hoạt động của cơ sở xử lý theo cụm, 3.4 chất thải nhựa, 3.5 nhân lực, công trình, thiết bị; Phần 4 kế hoạch năm tiếp theo; Phần 5 vấn đề khác; Phần 6 kết luận, kiến nghị; giám đốc Sở ký, đóng dấu. Số liệu thống kê chia theo loại hình cơ sở (công lập, ngoài công lập).\u003c/li>\u003c/ul>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"quiz\" class=\"hide\">\n\u003cdiv class=\"bar\">\u003ci id=\"pb\">\u003c/i>\u003c/div>\n\u003cdiv class=\"sub\" id=\"pg\">\u003c/div>\n\u003cdiv class=\"card\" id=\"box\">\u003c/div>\n\u003cdiv id=\"res\" class=\"card hide\">\u003c/div>\n\u003c/section>\n\n\u003cfooter>Nguồn: toàn văn Thông tư 20/2021/TT-BYT (Bộ Y tế). Nội dung tóm tắt chỉ phục vụ ôn tập, không thay thế văn bản gốc.\u003c/footer>\n\u003c/main>\n\u003cscript>\nvar Q=[\n[\"Thông tư 20/2021/TT-BYT quy định chi tiết việc:\", [\"Phân loại, thu gom, lưu giữ, quản lý chất thải y tế trong phạm vi khuôn viên cơ sở y tế\", \"Vận chuyển và xử lý chất thải y tế ngoài khuôn viên cơ sở y tế\", \"Cấp giấy phép môi trường cho bệnh viện\", \"Quản lý chất thải phóng xạ phát sinh từ hoạt động y tế\"], 0, \"Điều 1 khoản 1.\"],\n[\"Chất thải phóng xạ phát sinh từ hoạt động y tế được quản lý theo:\", [\"Quy định của Bộ Khoa học và Công nghệ, không thuộc Thông tư này\", \"Thông tư 20/2021/TT-BYT\", \"Quy định của Sở Y tế\", \"Quy định riêng của từng bệnh viện\"], 0, \"Điều 1 khoản 2.\"],\n[\"Đối tượng áp dụng gồm:\", [\"Cơ sở KBCB, y tế dự phòng, đào tạo khối ngành sức khỏe, nghiên cứu, xét nghiệm, kiểm nghiệm, thử nghiệm y, dược có phát sinh chất thải y tế và các tổ chức, cá nhân liên quan\", \"Chỉ bệnh viện công lập\", \"Chỉ cơ sở KBCB có giường bệnh nội trú\", \"Chỉ cơ sở xử lý chất thải nguy hại\"], 0, \"Điều 2.\"],\n[\"Chất thải y tế bao gồm:\", [\"Chất thải y tế nguy hại, chất thải rắn thông thường, khí thải, chất thải lỏng không nguy hại và nước thải y tế\", \"Chỉ chất thải lây nhiễm và chất thải sinh hoạt\", \"Chỉ chất thải rắn và nước thải\", \"Chất thải y tế nguy hại và chất thải phóng xạ\"], 0, \"Điều 3 khoản 1.\"],\n[\"Chất thải lây nhiễm là chất thải:\", [\"Thấm, dính, chứa máu của cơ thể hoặc chứa vi sinh vật gây bệnh\", \"Chỉ phát sinh từ phòng mổ\", \"Chỉ gồm vật sắc nhọn đã qua sử dụng\", \"Có hóa chất độc hại vượt ngưỡng\"], 0, \"Điều 3 khoản 2.\"],\n[\"Thu gom chất thải y tế là quá trình tập hợp chất thải:\", [\"Từ nơi phát sinh về khu lưu giữ tạm thời hoặc nơi xử lý trong khuôn viên cơ sở y tế\", \"Từ khu lưu giữ đến cơ sở xử lý bên ngoài\", \"Từ cơ sở y tế này sang cơ sở y tế khác\", \"Từ nơi phát sinh ra bãi chôn lấp\"], 0, \"Điều 3 khoản 3.\"],\n[\"Chất thải y tế nguy hại gồm:\", [\"Chất thải lây nhiễm và chất thải nguy hại không lây nhiễm\", \"Chất thải lây nhiễm và chất thải rắn thông thường\", \"Chất thải rắn thông thường và nước thải\", \"Khí thải và nước thải y tế\"], 0, \"Điều 4 khoản 1.\"],\n[\"Chất thải lây nhiễm gồm mấy nhóm?\", [\"4 nhóm: sắc nhọn, không sắc nhọn, nguy cơ lây nhiễm cao, giải phẫu\", \"2 nhóm: sắc nhọn và không sắc nhọn\", \"3 nhóm: sắc nhọn, giải phẫu, dạng lỏng\", \"5 nhóm\"], 0, \"Điều 4 khoản 2.\"],\n[\"Chất thải có nguy cơ lây nhiễm cao gồm:\", [\"Mẫu bệnh phẩm, dụng cụ dính mẫu từ phòng xét nghiệm an toàn sinh học cấp II trở lên; chất thải từ khu cách ly bệnh truyền nhiễm nguy hiểm nhóm A, B\", \"Mọi chất thải từ phòng xét nghiệm\", \"Bông, băng, gạc thấm máu\", \"Chất thải sinh hoạt của người bệnh\"], 0, \"Điều 4 khoản 2 điểm c.\"],\n[\"Chất thải giải phẫu gồm:\", [\"Mô, bộ phận cơ thể người thải bỏ, xác động vật thí nghiệm\", \"Chỉ bộ phận cơ thể người\", \"Bông, băng dính máu\", \"Dịch dẫn lưu sau phẫu thuật\"], 0, \"Điều 4 khoản 2 điểm d.\"],\n[\"Dịch dẫn lưu sau phẫu thuật, thủ thuật, dịch thải bỏ chứa máu thuộc nhóm:\", [\"Chất thải lây nhiễm không sắc nhọn (dạng lỏng)\", \"Chất thải lây nhiễm sắc nhọn\", \"Chất thải giải phẫu\", \"Chất thải nguy hại không lây nhiễm\"], 0, \"Điều 4 khoản 2 điểm b.\"],\n[\"Thuộc chất thải nguy hại không lây nhiễm là:\", [\"Dược phẩm thải bỏ nhóm gây độc tế bào; thiết bị y tế chứa thủy ngân, cadimi; pin, ắc quy; dung dịch rửa phim X-quang\", \"Vỏ lọ vắc xin thải bỏ loại không bất hoạt\", \"Chất thải sinh hoạt của người nhà\", \"Bùn thải không có thành phần nguy hại vượt ngưỡng\"], 0, \"Điều 4 khoản 3.\"],\n[\"Vỏ lọ vắc xin bất hoạt hoặc giảm độc lực thải bỏ thuộc:\", [\"Chất thải lây nhiễm không sắc nhọn\", \"Chất thải rắn thông thường\", \"Chất thải nguy hại không lây nhiễm\", \"Chất thải lỏng không nguy hại\"], 0, \"Điều 4 khoản 2 điểm b.\"],\n[\"Chất thải lây nhiễm sau khi xử lý đạt quy chuẩn kỹ thuật quốc gia về môi trường được:\", [\"Quản lý như chất thải rắn thông thường\", \"Tiếp tục coi là chất thải lây nhiễm\", \"Coi là chất thải nguy hại không lây nhiễm\", \"Phải chôn lấp tại cơ sở\"], 0, \"Điều 4 khoản 4 điểm e.\"],\n[\"Khí thải trong Thông tư gồm khí thải từ:\", [\"Phòng xét nghiệm tác nhân gây bệnh truyền nhiễm nguy hiểm lây qua đường không khí; phòng xét nghiệm an toàn sinh học cấp III trở lên\", \"Máy phát điện của cơ sở y tế\", \"Phương tiện giao thông trong bệnh viện\", \"Mọi phòng xét nghiệm\"], 0, \"Điều 4 khoản 5.\"],\n[\"Nước thải sinh hoạt thải chung vào hệ thống thu gom nước thải y tế thì:\", [\"Được quản lý như nước thải y tế\", \"Quản lý như chất thải rắn thông thường\", \"Phải tách riêng bằng đường ống khác\", \"Không phải xử lý\"], 0, \"Điều 4 khoản 7.\"],\n[\"Dụng cụ đựng chất thải sắc nhọn phải:\", [\"Có thành, đáy cứng, kháng thủng, thiết kế an toàn tránh tràn đổ, rơi vãi\", \"Là túi nilon dày\", \"Có thể thủng nhưng phải buộc kín\", \"Là thùng nhựa mềm có nắp\"], 0, \"Điều 5 khoản 4.\"],\n[\"Bao bì, dụng cụ đựng chất thải y tế xử lý bằng phương pháp đốt:\", [\"Không sử dụng vật liệu nhựa PVC\", \"Bắt buộc dùng nhựa PVC\", \"Chỉ dùng kim loại\", \"Không có quy định\"], 0, \"Điều 5 khoản 8.\"],\n[\"Trên bao bì, dụng cụ lưu chứa chất thải phải có:\", [\"Tên loại chất thải lưu chứa và biểu tượng theo Phụ lục số 02\", \"Chỉ màu sắc\", \"Chỉ tên khoa phát sinh\", \"Số lượng chất thải\"], 0, \"Điều 5 khoản 1.\"],\n[\"Nguyên tắc phân loại chất thải y tế:\", [\"Phân loại để quản lý ngay tại nơi phát sinh và tại thời điểm phát sinh\", \"Phân loại tại khu lưu giữ\", \"Phân loại tại cơ sở xử lý\", \"Phân loại cuối ngày\"], 0, \"Điều 6 khoản 1 điểm a.\"],\n[\"Chất thải lây nhiễm để lẫn với chất thải khác thì:\", [\"Hỗn hợp được thu gom, lưu giữ, xử lý như chất thải lây nhiễm\", \"Quản lý như chất thải thông thường\", \"Tách ra làm hai phần\", \"Quản lý theo loại chiếm tỷ lệ lớn hơn\"], 0, \"Điều 6 khoản 1 điểm c.\"],\n[\"Chất thải lây nhiễm (sắc nhọn, không sắc nhọn, nguy cơ cao, giải phẫu) được đựng trong bao bì, dụng cụ màu:\", [\"Vàng\", \"Đen\", \"Xanh\", \"Trắng\"], 0, \"Điều 6 khoản 3.\"],\n[\"Chất thải nguy hại không lây nhiễm dạng rắn đựng trong bao bì, dụng cụ màu:\", [\"Đen\", \"Vàng\", \"Xanh\", \"Trắng\"], 0, \"Điều 6 khoản 4 điểm b.\"],\n[\"Chất thải rắn thông thường không dùng để tái chế đựng trong bao bì, dụng cụ màu:\", [\"Xanh\", \"Vàng\", \"Đen\", \"Trắng\"], 0, \"Điều 6 khoản 5 điểm a.\"],\n[\"Chất thải rắn thông thường dùng để tái chế đựng trong bao bì, dụng cụ màu:\", [\"Trắng\", \"Xanh\", \"Vàng\", \"Đen\"], 0, \"Điều 6 khoản 5 điểm b.\"],\n[\"Tình huống: Khoa nhi bỏ vỏ chai nước giải khát nhựa còn sạch của người nhà vào thùng. Thùng phù hợp là:\", [\"Thùng/túi màu trắng (rác tái chế)\", \"Thùng màu vàng\", \"Thùng màu đen\", \"Thùng kháng thủng\"], 0, \"Điều 6 khoản 5 điểm b; Phụ lục 01.\"],\n[\"Chất thải giải phẫu được bỏ vào:\", [\"2 lần túi hoặc thùng có lót túi màu vàng\", \"Thùng kháng thủng màu vàng\", \"Túi màu đen\", \"Thùng màu xanh\"], 0, \"Điều 6 khoản 3 điểm d.\"],\n[\"Thùng thu gom chất thải có nguy cơ lây nhiễm cao (khi không có thiết bị khử khuẩn) phải dán nhãn:\", [\"“CHẤT THẢI CÓ NGUY CƠ LÂY NHIỄM CAO”\", \"“CHẤT THẢI NGUY HẠI”\", \"“CHẤT THẢI LÂY NHIỄM”\", \"“CHẤT THẢI GIẢI PHẪU”\"], 0, \"Điều 7 khoản 1 điểm d.\"],\n[\"Chất thải có nguy cơ lây nhiễm cao được xử lý sơ bộ:\", [\"Ở gần nơi phát sinh để loại bỏ mầm bệnh bằng thiết bị khử khuẩn\", \"Tại khu lưu giữ trung tâm\", \"Tại cơ sở xử lý bên ngoài\", \"Không cần xử lý sơ bộ\"], 0, \"Điều 7 khoản 1 điểm d.\"],\n[\"Tần suất thu gom chất thải lây nhiễm từ nơi phát sinh về khu lưu giữ tối thiểu:\", [\"Một lần một ngày\", \"Một lần một tuần\", \"Hai lần một ngày\", \"Một lần hai ngày\"], 0, \"Điều 7 khoản 1 điểm e.\"],\n[\"Cơ sở y tế phát sinh dưới 05 kg chất thải lây nhiễm/ngày thu gom chất thải lây nhiễm sắc nhọn tối thiểu:\", [\"Một lần một tháng\", \"Một lần một ngày\", \"Một lần một tuần\", \"Một lần ba tháng\"], 0, \"Điều 7 khoản 1 điểm e.\"],\n[\"Chất thải lây nhiễm dạng lỏng được thu gom vào:\", [\"Hệ thống thu gom nước thải y tế của cơ sở\", \"Thùng màu đen\", \"Khu lưu giữ chất thải rắn\", \"Hố chôn lấp\"], 0, \"Điều 7 khoản 1 điểm đ.\"],\n[\"Thiết bị y tế vỡ, hỏng có chứa thủy ngân được:\", [\"Thu gom, lưu giữ riêng trong hộp nhựa hoặc vật liệu phù hợp, không rò rỉ, phát tán hơi thủy ngân\", \"Bỏ chung chất thải lây nhiễm\", \"Bỏ chung rác sinh hoạt\", \"Đốt tại cơ sở\"], 0, \"Điều 7 khoản 2 điểm b.\"],\n[\"Thời gian lưu giữ chất thải lây nhiễm phát sinh tại cơ sở y tế trong điều kiện bình thường:\", [\"Không quá 02 ngày\", \"Không quá 01 ngày\", \"Không quá 03 ngày\", \"Không quá 07 ngày\"], 0, \"Điều 8 khoản 3 điểm a.\"],\n[\"Lưu giữ chất thải lây nhiễm trong thiết bị bảo quản lạnh dưới 8°C, thời gian tối đa:\", [\"07 ngày\", \"02 ngày\", \"03 ngày\", \"01 tháng\"], 0, \"Điều 8 khoản 3 điểm a.\"],\n[\"Chất thải lây nhiễm vận chuyển từ cơ sở y tế khác về xử lý theo mô hình cụm, nếu chưa xử lý ngay trong ngày thì lưu giữ ở:\", [\"Dưới 20°C, tối đa không quá 02 ngày\", \"Dưới 8°C, tối đa 07 ngày\", \"Nhiệt độ thường, tối đa 03 ngày\", \"Dưới 20°C, tối đa 07 ngày\"], 0, \"Điều 8 khoản 3 điểm b.\"],\n[\"Cơ sở phát sinh dưới 05 kg chất thải lây nhiễm/ngày được lưu giữ không quá:\", [\"03 ngày trong điều kiện bình thường, trong bao bì buộc kín hoặc thiết bị đậy nắp kín\", \"02 ngày\", \"05 ngày\", \"07 ngày\"], 0, \"Điều 8 khoản 3 điểm c.\"],\n[\"Thời gian lưu giữ chất thải nguy hại không lây nhiễm:\", [\"Không quá 01 năm kể từ khi phát sinh\", \"Không quá 06 tháng\", \"Không quá 02 năm\", \"Không giới hạn\"], 0, \"Điều 8 khoản 4.\"],\n[\"Nếu lưu giữ chất thải nguy hại không lây nhiễm quá 01 năm do chưa có phương án xử lý, cơ sở y tế phải:\", [\"Báo cáo bằng văn bản riêng hoặc kết hợp trong báo cáo hằng năm cho cơ quan có thẩm quyền\", \"Tự chôn lấp\", \"Tự đốt thủ công\", \"Chỉ lưu hồ sơ nội bộ\"], 0, \"Điều 8 khoản 4.\"],\n[\"Vùng sâu, vùng xa không có biện pháp xử lý phù hợp thì chất thải lây nhiễm sắc nhọn:\", [\"Lưu giữ an toàn trong bể bê tông sau khi tiệt khuẩn và có biển cảnh báo\", \"Chôn trực tiếp xuống đất\", \"Đốt ngoài trời\", \"Bỏ cùng rác sinh hoạt\"], 0, \"Điều 8 khoản 5.\"],\n[\"Khu lưu giữ theo Mục A Phụ lục 03 áp dụng cho:\", [\"Bệnh viện và cơ sở y tế xử lý chất thải theo mô hình cụm\", \"Mọi cơ sở y tế\", \"Chỉ trạm y tế xã\", \"Chỉ phòng khám tư nhân\"], 0, \"Điều 8 khoản 1 (Phụ lục 03).\"],\n[\"Khu lưu giữ theo Mục A Phụ lục 03 phải có:\", [\"Biển cảnh báo, mái che, nền không ngập, hệ thống thu gom nước thải, vật liệu hấp thụ và xẻng, thiết bị PCCC, vòi nước\", \"Chỉ biển cảnh báo\", \"Chỉ mái che và thùng rác\", \"Hệ thống xử lý khí thải\"], 0, \"Điều 8 (Phụ lục 03, Mục A).\"],\n[\"Biện pháp giảm thiểu chất thải y tế gồm:\", [\"Mua sắm phù hợp nhu cầu; đổi mới thiết bị, quy trình; hạn chế nhựa dùng một lần, túi ni lông khó phân hủy; phân loại chất thải nhựa để tái chế\", \"Chỉ đốt toàn bộ chất thải\", \"Chỉ chôn lấp\", \"Tăng mua sắm vật tư dự phòng\"], 0, \"Điều 9.\"],\n[\"Cơ sở y tế ban hành danh mục chất thải rắn thông thường được thu gom để tái chế dựa trên:\", [\"Danh mục tại Phụ lục số 01, phù hợp tình hình phát sinh của đơn vị\", \"Quyết định của Sở Y tế\", \"Quy định của cơ sở tái chế\", \"Phụ lục số 03\"], 0, \"Điều 10 khoản 1.\"],\n[\"Khi chuyển giao chất thải đã khử khuẩn đạt quy chuẩn để tái chế, cơ sở y tế ghi vào:\", [\"Sổ bàn giao chất thải đã khử khuẩn đạt quy chuẩn phục vụ tái chế (Phụ lục 04)\", \"Sổ giao nhận chất thải y tế nguy hại (Phụ lục 06)\", \"Sổ nhật ký vận hành (Phụ lục 05)\", \"Báo cáo năm (Phụ lục 07)\"], 0, \"Điều 10 khoản 2.\"],\n[\"Công trình, thiết bị xử lý chất thải phải bảo trì định kỳ và ghi vào:\", [\"Sổ nhật ký vận hành công trình, thiết bị, hệ thống xử lý chất thải y tế (Phụ lục 05)\", \"Sổ giao nhận chất thải (Phụ lục 06)\", \"Sổ bàn giao tái chế (Phụ lục 04)\", \"Báo cáo năm (Phụ lục 07)\"], 0, \"Điều 11 khoản 2.\"],\n[\"Chất thải y tế nguy hại chuyển giao cho đơn vị không tự xử lý phải ghi lượng chất thải vào:\", [\"Sổ giao nhận chất thải theo mẫu Phụ lục 06 và dùng chứng từ chất thải nguy hại\", \"Sổ Phụ lục 04\", \"Sổ Phụ lục 05\", \"Không cần ghi\"], 0, \"Điều 12 khoản 1 điểm a.\"],\n[\"Cơ sở y tế xử lý chất thải nguy hại theo mô hình cụm do cơ quan nào phê duyệt?\", [\"Ủy ban nhân dân tỉnh, thành phố trực thuộc Trung ương\", \"Bộ Y tế\", \"Sở Y tế\", \"Giám đốc bệnh viện\"], 0, \"Điều 12 (mô hình cụm).\"],\n[\"Sổ giao nhận chất thải y tế nguy hại được lập thành:\", [\"02 sổ: chủ nguồn thải giữ 01, cơ sở xử lý giữ 01; không tẩy xóa, sửa chữa\", \"01 sổ lưu tại Sở Y tế\", \"03 sổ\", \"Không quy định số lượng\"], 0, \"Điều 12 (Phụ lục 06, ghi chú).\"],\n[\"Kỳ báo cáo kết quả quản lý chất thải y tế là:\", [\"01 năm một lần, từ 15/12 năm trước đến 14/12 năm báo cáo\", \"Từ 01/01 đến 31/12\", \"6 tháng một lần\", \"Quý một lần\"], 0, \"Điều 13 khoản 1.\"],\n[\"Cơ sở y tế gửi báo cáo về Sở Y tế (hoặc Cục Quản lý môi trường y tế với cơ sở trực thuộc Bộ Y tế) trước ngày:\", [\"16 tháng 12\", \"14 tháng 12\", \"20 tháng 12\", \"31 tháng 12\"], 0, \"Điều 13 khoản 3 điểm a.\"],\n[\"Sở Y tế tổng hợp, gửi báo cáo về Cục Quản lý môi trường y tế trước ngày:\", [\"20 tháng 12\", \"16 tháng 12\", \"25 tháng 12\", \"31 tháng 12\"], 0, \"Điều 13 khoản 3 điểm b.\"],\n[\"Hồ sơ nào KHÔNG thuộc hồ sơ cơ sở y tế phải lưu giữ theo Điều 14?\", [\"Hợp đồng lao động của nhân viên thu gom\", \"Sổ giao nhận chất thải y tế, chứng từ chất thải nguy hại\", \"Biên bản thanh tra, kiểm tra liên quan (nếu có)\", \"Báo cáo kết quả quản lý chất thải y tế hằng năm\"], 0, \"Điều 14.\"],\n[\"Cơ sở y tế phải phân công, bố trí nhân sự quản lý chất thải như thế nào?\", [\"Phân công lãnh đạo phụ trách, bố trí cán bộ chuyên trách, giao khoa Kiểm soát nhiễm khuẩn hoặc khoa, phòng phụ trách\", \"Chỉ giao cho hộ lý\", \"Chỉ thuê đơn vị bên ngoài\", \"Không bắt buộc phân công\"], 0, \"Điều 15 khoản 3 điểm b.\"],\n[\"Trách nhiệm của Sở Y tế gồm:\", [\"Chỉ đạo, hướng dẫn, kiểm tra; tập huấn, truyền thông; chỉ đạo lập kế hoạch; phối hợp Sở Tài chính đề xuất kinh phí; báo cáo\", \"Trực tiếp vận hành hệ thống xử lý của từng bệnh viện\", \"Cấp giấy phép môi trường\", \"Ban hành Thông tư\"], 0, \"Điều 15 khoản 2.\"],\n[\"Thông tư 20/2021/TT-BYT có hiệu lực từ ngày:\", [\"10/01/2022\", \"26/11/2021\", \"01/01/2022\", \"27/02/2022\"], 0, \"Điều 16 khoản 1 điểm a.\"],\n[\"Văn bản hết hiệu lực khi Thông tư 20/2021/TT-BYT có hiệu lực là:\", [\"Thông tư liên tịch 58/2015/TTLT-BYT-BTNMT\", \"Thông tư 07/2011/TT-BYT\", \"Thông tư 18/2020/TT-BYT\", \"Thông tư 31/2021/TT-BYT\"], 0, \"Điều 16 khoản 1 điểm b.\"],\n[\"Chất thải lây nhiễm sắc nhọn gồm:\", [\"Kim tiêm, bơm liền kim, lưỡi dao mổ, mảnh thủy tinh vỡ đã qua sử dụng có dính máu hoặc vi sinh vật gây bệnh\", \"Bông, băng, gạc thấm máu\", \"Vỏ lọ vắc xin bất hoạt\", \"Mô, bộ phận cơ thể người thải bỏ\"], 0, \"Điều 4 khoản 2 điểm a.\"],\n[\"Hóa chất thải bỏ thuộc chất thải nguy hại không lây nhiễm khi:\", [\"Có thành phần, tính chất nguy hại vượt ngưỡng hoặc có cảnh báo nguy hại trên bao bì từ nhà sản xuất\", \"Mọi loại hóa chất thải bỏ\", \"Chỉ hóa chất dạng lỏng\", \"Chỉ hóa chất đã hết hạn sử dụng\"], 0, \"Điều 4 khoản 3 điểm a.\"],\n[\"Chất thải sinh hoạt phát sinh từ khu vực cách ly, điều trị người mắc bệnh truyền nhiễm nguy hiểm:\", [\"Không thuộc chất thải rắn sinh hoạt thông thường\", \"Là chất thải rắn thông thường tái chế\", \"Là chất thải rắn thông thường không tái chế\", \"Là chất thải giải phẫu\"], 0, \"Điều 4 khoản 4 điểm a.\"],\n[\"Chất thải sắc nhọn không lây nhiễm, không có thành phần nguy hại vượt ngưỡng thuộc:\", [\"Chất thải rắn thông thường\", \"Chất thải lây nhiễm sắc nhọn\", \"Chất thải nguy hại không lây nhiễm\", \"Chất thải giải phẫu\"], 0, \"Điều 4 khoản 4 điểm đ.\"],\n[\"Bùn thải từ hệ thống xử lý nước thải, tro xỉ từ lò đốt không có thành phần nguy hại vượt ngưỡng thuộc:\", [\"Chất thải rắn thông thường\", \"Chất thải lây nhiễm không sắc nhọn\", \"Chất thải nguy hại không lây nhiễm\", \"Nước thải y tế\"], 0, \"Điều 4 khoản 4 điểm g.\"],\n[\"Chất thải lỏng không nguy hại là:\", [\"Dung dịch thuốc, hóa chất thải bỏ không thuộc nhóm gây độc tế bào, không có cảnh báo nguy hại, không chứa yếu tố nguy hại vượt ngưỡng, không chứa vi sinh vật gây bệnh\", \"Nước thải từ thiết bị xét nghiệm\", \"Dịch dẫn lưu sau phẫu thuật\", \"Dung dịch rửa phim X-quang\"], 0, \"Điều 4 khoản 6.\"],\n[\"Vỏ chai, lọ, dụng cụ dính thuốc hoặc hóa chất thuộc nhóm gây độc tế bào thuộc:\", [\"Chất thải nguy hại không lây nhiễm\", \"Chất thải rắn thông thường tái chế\", \"Chất thải lây nhiễm sắc nhọn\", \"Chất thải rắn thông thường không tái chế\"], 0, \"Điều 4 khoản 3 điểm c.\"],\n[\"Dụng cụ, thiết bị lưu chứa chất thải phải có nắp đóng, mở thuận tiện và:\", [\"Có thể tái sử dụng sau khi được làm sạch và khử khuẩn\", \"Chỉ dùng một lần\", \"Không cần làm sạch sau khi dùng\", \"Chỉ được làm bằng kim loại\"], 0, \"Điều 5 khoản 3.\"],\n[\"Dụng cụ, thiết bị lưu chứa chất thải lây nhiễm phải:\", [\"Có nắp đậy kín và chống được sự xâm nhập của các loài động vật\", \"Có đáy cứng kháng thủng\", \"Làm bằng vật liệu chống ăn mòn\", \"Có mái che\"], 0, \"Điều 5 khoản 5.\"],\n[\"Dụng cụ lưu chứa hóa chất thải phải:\", [\"Làm bằng vật liệu không phản ứng với chất thải và chống ăn mòn nếu chất thải có tính ăn mòn\", \"Làm bằng nhựa PVC\", \"Là túi nilon thông thường\", \"Không cần nắp đậy\"], 0, \"Điều 5 khoản 6.\"],\n[\"Chất thải y tế nguy hại được phân loại chung vào một bao bì, dụng cụ khi:\", [\"Không có khả năng phản ứng, tương tác với nhau và áp dụng cùng một phương pháp xử lý (trừ chất thải lây nhiễm sắc nhọn)\", \"Cùng được phát sinh trong một ngày\", \"Cùng khoa phát sinh\", \"Luôn được phép phân loại chung\"], 0, \"Điều 6 khoản 1 điểm b.\"],\n[\"Tại vị trí đặt bao bì, dụng cụ phân loại chất thải phải có:\", [\"Hướng dẫn cách phân loại và thu gom chất thải\", \"Biển cảnh báo cháy nổ\", \"Vật liệu hấp thụ và xẻng\", \"Sổ giao nhận chất thải\"], 0, \"Điều 6 khoản 2 điểm b.\"],\n[\"Chất thải lây nhiễm sắc nhọn được bỏ vào:\", [\"Thùng hoặc hộp kháng thủng và có màu vàng\", \"Túi nilon màu vàng\", \"Thùng màu đen\", \"Túi màu trắng\"], 0, \"Điều 6 khoản 3 điểm a.\"],\n[\"Chất thải nguy hại không lây nhiễm được phân loại theo:\", [\"Mã chất thải nguy hại\", \"Khoa phát sinh\", \"Khối lượng\", \"Thời điểm phát sinh\"], 0, \"Điều 6 khoản 4 điểm a.\"],\n[\"Chất thải nguy hại không lây nhiễm dạng lỏng chứa trong:\", [\"Dụng cụ lưu chứa chất lỏng có nắp đậy kín, có mã, tên loại chất thải\", \"Túi màu đen\", \"Thùng lót túi màu vàng\", \"Hộp kháng thủng\"], 0, \"Điều 6 khoản 4 điểm c.\"],\n[\"Chất thải lây nhiễm dạng lỏng được chứa trong:\", [\"Túi kín hoặc dụng cụ lưu chứa chất lỏng có nắp đậy kín\", \"Thùng kháng thủng\", \"Túi màu xanh\", \"Hộp có thành đáy cứng\"], 0, \"Điều 6 khoản 3 điểm đ.\"],\n[\"Cơ sở y tế quy định luồng đi và thời điểm thu gom chất thải lây nhiễm nhằm:\", [\"Hạn chế ảnh hưởng đến khu vực chăm sóc người bệnh và các khu vực khác\", \"Giảm chi phí vận chuyển\", \"Tăng tần suất thu gom\", \"Tránh phải ghi sổ giao nhận\"], 0, \"Điều 7 khoản 1 điểm a.\"],\n[\"Trước khi thu gom chất thải lây nhiễm:\", [\"Túi đựng phải buộc kín miệng, thùng đựng phải có nắp đậy kín\", \"Phải đổ chung vào thùng lớn\", \"Chỉ cần đóng nắp thùng\", \"Phải trộn với chất thải thông thường\"], 0, \"Điều 7 khoản 1 điểm c.\"],\n[\"Cơ sở không có thiết bị khử khuẩn, chất thải có nguy cơ lây nhiễm cao trước khi thu gom phải:\", [\"Buộc kín túi, bỏ tiếp vào túi lây nhiễm thứ 2, buộc kín, bỏ vào thùng thu gom và dán nhãn\", \"Đổ trực tiếp vào thùng chung\", \"Đốt ngay tại nơi phát sinh\", \"Chỉ buộc kín một lớp túi\"], 0, \"Điều 7 khoản 1 điểm d.\"],\n[\"Chất thải rắn thông thường dùng để tái chế và không dùng để tái chế:\", [\"Được thu gom riêng\", \"Được thu gom chung\", \"Được thu gom cùng chất thải lây nhiễm\", \"Chỉ thu gom khi có yêu cầu\"], 0, \"Điều 7 khoản 3.\"],\n[\"Khí thải phải được xử lý trước khi xả ra môi trường để:\", [\"Loại bỏ các vi sinh vật gây bệnh\", \"Giảm nhiệt độ\", \"Tăng lưu lượng\", \"Giảm tiếng ồn\"], 0, \"Điều 7 khoản 5.\"],\n[\"Hệ thống thu gom nước thải của cơ sở y tế phải:\", [\"Là hệ thống kín và bảo đảm thu gom toàn bộ nước thải phát sinh trong cơ sở\", \"Là hệ thống hở có nắp che\", \"Chỉ thu gom nước thải khoa lây nhiễm\", \"Chỉ thu gom nước thải xét nghiệm\"], 0, \"Điều 7 khoản 6 điểm a.\"],\n[\"Từng loại chất thải phải được lưu giữ riêng tại khu lưu giữ tạm thời, trừ trường hợp:\", [\"Cùng tính chất, không có khả năng phản ứng, tương tác và xử lý bằng cùng một phương pháp\", \"Cùng khoa phát sinh\", \"Cùng ngày phát sinh\", \"Cùng khối lượng\"], 0, \"Điều 8 khoản 2.\"],\n[\"Khu lưu giữ theo Mục B Phụ lục 03 (cơ sở y tế khác) yêu cầu:\", [\"Có biển cảnh báo; thùng, dụng cụ riêng có nắp đậy kín, có tên loại, mã CTNH, biểu tượng; thường xuyên vệ sinh, khử khuẩn\", \"Có mái che và hệ thống thu gom nước thải\", \"Có thiết bị phòng cháy chữa cháy\", \"Có vòi nước và dung dịch khử khuẩn\"], 0, \"Điều 8 khoản 1 điểm b (Phụ lục 03, Mục B).\"],\n[\"Chất thải lây nhiễm đã xử lý đạt quy chuẩn khi chuyển giao tái chế phải:\", [\"Buộc kín bao bì, bên ngoài có biểu tượng chất thải tái chế (Phụ lục 02)\", \"Để nguyên không đóng gói\", \"Dán nhãn chất thải lây nhiễm\", \"Đựng trong thùng màu vàng\"], 0, \"Điều 10 khoản 2.\"],\n[\"Chất thải nhựa trong cơ sở y tế được:\", [\"Phân loại, thu gom để phục vụ tái chế hoặc xử lý theo quy định của pháp luật\", \"Đốt toàn bộ\", \"Chôn lấp tại cơ sở\", \"Thải chung với chất thải lây nhiễm\"], 0, \"Điều 10 khoản 3.\"],\n[\"Cơ sở tự xử lý hoặc xử lý theo mô hình cụm phải vận hành công trình, thiết bị:\", [\"Thường xuyên theo hướng dẫn nhà sản xuất, bảo đảm đạt quy chuẩn kỹ thuật và tuân thủ quy định giám sát, quan trắc môi trường\", \"Khi có chất thải phát sinh\", \"Theo yêu cầu của đơn vị vận chuyển\", \"Mỗi tháng một lần\"], 0, \"Điều 11 khoản 1.\"],\n[\"Chất thải rắn thông thường mà cơ sở không tự xử lý được chuyển giao cho:\", [\"Đơn vị có chức năng phù hợp để vận chuyển, xử lý theo quy định\", \"Bất kỳ cá nhân nào\", \"Chỉ đơn vị có giấy phép xử lý chất thải nguy hại\", \"Sở Y tế\"], 0, \"Điều 12 khoản 1 điểm b.\"],\n[\"Đơn vị nhận chuyển giao chất thải y tế phải:\", [\"Vận chuyển theo quy định, không làm thất thoát chất thải ra bên ngoài; xử lý đạt quy chuẩn kỹ thuật về môi trường\", \"Chỉ vận chuyển, không cần xử lý\", \"Lưu giữ tại cơ sở y tế\", \"Chôn lấp tại cơ sở y tế\"], 0, \"Điều 12 khoản 3.\"],\n[\"Báo cáo kết quả quản lý chất thải y tế được gửi bằng:\", [\"Văn bản giấy hoặc bản điện tử hoặc qua phần mềm báo cáo\", \"Chỉ văn bản giấy\", \"Chỉ bản điện tử\", \"Chỉ gửi trực tiếp\"], 0, \"Điều 13 khoản 2.\"],\n[\"Cục Quản lý môi trường y tế có trách nhiệm:\", [\"Chỉ đạo, hướng dẫn, kiểm tra; ban hành hướng dẫn chuyên môn kỹ thuật; đào tạo, tập huấn, truyền thông cho Sở Y tế và cơ sở y tế thuộc thẩm quyền\", \"Phê duyệt mô hình xử lý theo cụm\", \"Cấp giấy phép môi trường\", \"Trực tiếp vận hành hệ thống xử lý\"], 0, \"Điều 15 khoản 1.\"],\n[\"Cơ sở y tế xây dựng kế hoạch quản lý chất thải y tế:\", [\"Riêng hoặc tích hợp trong kế hoạch hoạt động chung hằng năm; đồng thời bố trí kinh phí thực hiện\", \"Chỉ khi có thanh tra\", \"Do Sở Y tế xây dựng thay\", \"Không bắt buộc\"], 0, \"Điều 15 khoản 3 điểm c.\"],\n[\"Cơ sở y tế phải thực hiện yêu cầu về kế hoạch, biện pháp, trang thiết bị ứng phó sự cố môi trường, bao gồm:\", [\"Phương án xử lý khi lượng chất thải nguy hại tăng bất thường do dịch bệnh hoặc lý do bất khả kháng\", \"Chỉ phương án phòng cháy chữa cháy\", \"Chỉ phương án sơ tán người bệnh\", \"Phương án thu phí xử lý chất thải\"], 0, \"Điều 15 khoản 3 điểm đ.\"],\n[\"Cơ sở y tế tổ chức đào tạo, tập huấn, truyền thông, phổ biến quy định quản lý chất thải y tế cho:\", [\"Viên chức, người lao động và các đối tượng có liên quan\", \"Chỉ cán bộ chuyên trách\", \"Chỉ nhân viên hộ lý\", \"Chỉ người bệnh\"], 0, \"Điều 15 khoản 3 điểm e.\"],\n[\"Khi có khó khăn, vướng mắc trong thực hiện Thông tư, phản ánh về:\", [\"Bộ Y tế (Cục Quản lý môi trường y tế)\", \"Sở Tài chính\", \"Bộ Tài nguyên và Môi trường\", \"Ủy ban nhân dân tỉnh\"], 0, \"Điều 16 khoản 2 điểm b.\"],\n[\"Giấy, báo, bìa, vỏ hộp thuốc được thu gom để tái chế với điều kiện:\", [\"Không thấm, dính, chứa máu, vi sinh vật gây bệnh hoặc yếu tố nguy hại khác vượt ngưỡng\", \"Đã được hấp sấy\", \"Chỉ từ khu hành chính\", \"Phải đóng trong thùng màu vàng\"], 0, \"Điều 10 (Phụ lục 01, mục I).\"],\n[\"Chai nước giải khát nhựa và sản phẩm nhựa sinh hoạt được thu gom tái chế nếu:\", [\"Không thải ra từ khu vực cách ly, điều trị người mắc bệnh truyền nhiễm nguy hiểm nhóm A, B\", \"Đã qua hấp sấy\", \"Chỉ từ khoa nhi\", \"Không có điều kiện nào\"], 0, \"Điều 10 (Phụ lục 01, mục II).\"],\n[\"Vỏ chai, lọ thuốc thủy tinh thải bỏ được thu gom tái chế khi:\", [\"Không dính, chứa thuốc, hóa chất gây độc tế bào hoặc có cảnh báo nguy hại; không thấm, dính máu, không chứa vi sinh vật gây bệnh\", \"Còn nguyên nhãn\", \"Đã hết hạn\", \"Không có điều kiện nào\"], 0, \"Điều 10 (Phụ lục 01, mục IV).\"],\n[\"Trình bày, thiết kế, màu sắc dấu hiệu cảnh báo chất thải y tế nguy hại áp dụng theo:\", [\"TCVN 5053:1990\", \"TCVN 7380:2004\", \"Thông tư 18/2020/TT-BYT\", \"Quyết định của giám đốc bệnh viện\"], 0, \"Điều 5 (Phụ lục 02, ghi chú).\"],\n[\"Sổ nhật ký vận hành (Phụ lục 05) gồm các loại:\", [\"Nhật ký lò đốt; thiết bị xử lý chất thải rắn lây nhiễm công nghệ không đốt; hệ thống xử lý nước thải\", \"Nhật ký thu gom; lưu giữ; vận chuyển\", \"Nhật ký giao nhận; bàn giao; báo cáo\", \"Nhật ký nhân sự; đào tạo; kiểm tra\"], 0, \"Điều 11 (Phụ lục 05).\"],\n[\"Cơ sở có từ 2 công trình, thiết bị, hệ thống xử lý chất thải trở lên thì lập sổ nhật ký vận hành:\", [\"Mỗi công trình, thiết bị, hệ thống lập một sổ\", \"Một sổ chung cho toàn cơ sở\", \"Mỗi khoa lập một sổ\", \"Không phải lập sổ\"], 0, \"Điều 11 (Phụ lục 05, ghi chú).\"],\n[\"Sổ giao nhận chất thải y tế nguy hại (Phụ lục 06) được dùng thay chứng từ chất thải nguy hại đối với:\", [\"Cơ sở y tế xử lý chất thải theo mô hình cụm khi bàn giao chất thải\", \"Mọi cơ sở y tế\", \"Cơ sở tự xử lý chất thải\", \"Cơ sở chỉ có chất thải thông thường\"], 0, \"Điều 12 (Phụ lục 06, ghi chú).\"],\n[\"Báo cáo của cơ sở y tế (Phụ lục 07, Mục A) có phần nào sau đây?\", [\"Kế hoạch quản lý chất thải y tế trong năm tiếp theo\", \"Danh sách người bệnh điều trị\", \"Hợp đồng lao động của nhân viên\", \"Giá thành xử lý từng loại chất thải\"], 0, \"Điều 13 (Phụ lục 07).\"],\n[\"Trong báo cáo, ký hiệu “LĐ” chỉ phương pháp tự xử lý chất thải y tế nguy hại bằng:\", [\"Lò đốt 2 buồng\", \"Chôn lấp\", \"Hấp ướt, vi sóng\", \"Đốt thủ công hoặc đốt 1 buồng\"], 0, \"Điều 13 (Phụ lục 07, ghi chú).\"],\n[\"Vật liệu tráng chì dùng ngăn tia xạ thải bỏ thuộc:\",[\"Chất thải nguy hại không lây nhiễm\",\"Chất thải rắn thông thường\",\"Chất thải lây nhiễm không sắc nhọn\",\"Chất thải giải phẫu\"],0,\"Điều 4 khoản 3 điểm d.\"],\n[\"Nước thải từ thiết bị xét nghiệm, phân tích có yếu tố nguy hại vượt ngưỡng thuộc:\",[\"Chất thải nguy hại không lây nhiễm\",\"Chất thải rắn thông thường\",\"Chất thải lỏng không nguy hại\",\"Chất thải lây nhiễm dạng lỏng\"],0,\"Điều 4 khoản 3 điểm đ.\"],\n[\"Vỏ lọ vắc xin thải bỏ không thuộc loại bất hoạt hoặc giảm độc lực thuộc:\",[\"Chất thải rắn thông thường\",\"Chất thải lây nhiễm không sắc nhọn\",\"Chất thải nguy hại không lây nhiễm\",\"Chất thải lây nhiễm sắc nhọn\"],0,\"Điều 4 khoản 4 điểm d.\"],\n[\"Vỏ chai, lọ đựng thuốc không thuộc nhóm gây độc tế bào và không có cảnh báo nguy hại thuộc:\",[\"Chất thải rắn thông thường\",\"Chất thải nguy hại không lây nhiễm\",\"Chất thải lây nhiễm không sắc nhọn\",\"Chất thải lỏng không nguy hại\"],0,\"Điều 4 khoản 4 điểm c.\"],\n[\"Chất thải rắn sinh hoạt trong cơ sở y tế bao gồm cả:\",[\"Chất thải ngoại cảnh trong cơ sở y tế\",\"Chất thải từ khu cách ly bệnh truyền nhiễm nguy hiểm\",\"Chất thải giải phẫu\",\"Chất thải thấm, dính máu\"],0,\"Điều 4 khoản 4 điểm a.\"],\n[\"Hỗn hợp chất thải lây nhiễm lẫn chất thải khác, sau khi xử lý được:\",[\"Tiếp tục quản lý theo tính chất của chất thải sau xử lý\",\"Quản lý như chất thải lây nhiễm vĩnh viễn\",\"Coi như chất thải nguy hại không lây nhiễm\",\"Tái chế ngay\"],0,\"Điều 6 khoản 1 điểm c.\"],\n[\"Chất thải lỏng không nguy hại được chứa trong:\",[\"Dụng cụ đựng chất thải lỏng có nắp đậy kín, có tên loại chất thải lưu chứa\",\"Túi màu xanh\",\"Thùng màu trắng\",\"Thùng màu đen có lót túi\"],0,\"Điều 6 khoản 6.\"],\n[\"Dụng cụ thu gom chất thải lây nhiễm phải bảo đảm:\",[\"Kín, không rò rỉ dịch thải trong quá trình thu gom\",\"Có bánh xe và nắp mở tự động\",\"Làm bằng kim loại\",\"Có màu xanh\"],0,\"Điều 7 khoản 1 điểm b.\"],\n[\"Chất thải lỏng không nguy hại được thu gom vào:\",[\"Hệ thống thu gom nước thải của cơ sở y tế\",\"Thùng màu xanh\",\"Khu lưu giữ chất thải nguy hại\",\"Hố chôn lấp\"],0,\"Điều 7 khoản 4.\"],\n[\"Nền khu lưu giữ theo Mục A Phụ lục 03 phải:\",[\"Không bị ngập lụt, tránh nước mưa chảy tràn vào, không chảy tràn chất lỏng ra ngoài khi rò rỉ, đổ tràn\",\"Lát gạch men\",\"Cao hơn mặt đường 1 mét\",\"Không cần quy định riêng\"],0,\"Điều 8 (Phụ lục 03, Mục A).\"],\n[\"Vật liệu hấp thụ (cát khô, mùn cưa) và xẻng trong khu lưu giữ dùng khi:\",[\"Rò rỉ, đổ tràn chất thải y tế nguy hại dạng lỏng\",\"Vệ sinh sàn nhà hằng ngày\",\"Chôn lấp chất thải sắc nhọn\",\"Có cháy xảy ra\"],0,\"Điều 8 (Phụ lục 03, Mục A).\"],\n[\"Trong khu lưu giữ theo Mục A Phụ lục 03, các chất thải khác nhau nhưng cùng một phương pháp xử lý:\",[\"Được lưu giữ trong cùng một dụng cụ, thiết bị lưu chứa\",\"Bắt buộc lưu riêng từng loại\",\"Phải đặt ở hai khu khác nhau\",\"Phải lưu giữ dưới 8°C\"],0,\"Điều 8 (Phụ lục 03, Mục A).\"],\n[\"Giấy phép môi trường và hồ sơ môi trường liên quan được lưu giữ đối với:\",[\"Cơ sở y tế thuộc đối tượng phải xin cấp giấy phép môi trường\",\"Mọi cơ sở y tế\",\"Chỉ bệnh viện tuyến Trung ương\",\"Chỉ cơ sở tự xử lý chất thải\"],0,\"Điều 14 khoản 1.\"],\n[\"Sổ nhật ký vận hành công trình, thiết bị xử lý được lưu giữ đối với:\",[\"Cơ sở y tế tự xử lý chất thải\",\"Mọi cơ sở y tế\",\"Cơ sở chuyển giao toàn bộ chất thải\",\"Chỉ cơ sở thuộc Bộ Y tế\"],0,\"Điều 14 khoản 3.\"],\n[\"Cơ sở y tế tự xử lý chất thải bố trí việc vận hành công trình, thiết bị bằng:\",[\"Người của cơ sở hoặc phối hợp với đơn vị bên ngoài, phù hợp yêu cầu nhiệm vụ\",\"Chỉ người của cơ sở\",\"Chỉ đơn vị bên ngoài\",\"Chỉ nhân viên hộ lý\"],0,\"Điều 15 khoản 3 điểm b.\"],\n[\"Cơ sở y tế xác định các loại chất thải phát sinh nhằm:\",[\"Áp dụng biện pháp quản lý phù hợp theo quy định của Thông tư\",\"Tính phí xử lý chất thải\",\"Xin giấy phép hoạt động\",\"Lập danh sách nhân sự\"],0,\"Điều 15 khoản 3 điểm d.\"],\n[\"Sở Y tế chỉ đạo các cơ sở y tế trực thuộc:\",[\"Lập kế hoạch quản lý chất thải y tế\",\"Tự xây dựng mô hình cụm\",\"Cấp giấy phép môi trường\",\"Ký hợp đồng xử lý với mọi đơn vị\"],0,\"Điều 15 khoản 2 điểm c.\"],\n[\"Chai, lon nước giải khát và vật liệu kim loại sinh hoạt được thu gom tái chế nếu:\",[\"Không thải ra từ khu cách ly, điều trị bệnh truyền nhiễm nguy hiểm nhóm A, B\",\"Đã khử khuẩn bằng hóa chất\",\"Còn nguyên nhãn\",\"Chỉ từ khoa hành chính\"],0,\"Điều 10 (Phụ lục 01, mục III).\"],\n[\"Chai dịch truyền nhựa, dây truyền, bơm tiêm nhựa (không gồm đầu sắc nhọn) được thu gom tái chế khi:\",[\"Không thấm, dính, chứa máu, vi sinh vật gây bệnh và yếu tố nguy hại\",\"Còn nguyên bao bì\",\"Đã hết hạn sử dụng\",\"Không có điều kiện\"],0,\"Điều 10 (Phụ lục 01, mục II).\"],\n[\"Chai dịch truyền, dây truyền, bơm tiêm nhựa đã xử lý đạt quy chuẩn kỹ thuật quốc gia về môi trường chỉ cần đáp ứng yêu cầu:\",[\"Không chứa yếu tố nguy hại\",\"Không thấm, dính máu\",\"Phải đóng túi vàng\",\"Phải bỏ đầu sắc nhọn\"],0,\"Điều 10 (Phụ lục 01, mục II).\"],\n[\"Đơn vị tính trong sổ bàn giao chất thải tái chế (Phụ lục 04) là:\",[\"Túi, hộp, thùng hoặc kiện\",\"Chỉ kg\",\"Chỉ lít\",\"Chỉ mẻ\"],0,\"Điều 10 (Phụ lục 04).\"],\n[\"Nhật ký vận hành lò đốt phải ghi:\",[\"Thời điểm bắt đầu, kết thúc, nhiệt độ và bất thường khi đốt, lượng chất thải đốt (kg), nhận xét, người vận hành\",\"Chỉ lượng nước thải\",\"Chỉ tên người giao nhận\",\"Chỉ số lượng thùng\"],0,\"Điều 11 (Phụ lục 05, mục I).\"],\n[\"Nhật ký thiết bị xử lý chất thải rắn lây nhiễm công nghệ không đốt ghi:\",[\"Giờ, chế độ khử khuẩn (nhiệt độ, thời gian), số lượng chất thải mỗi mẻ, cán bộ vận hành\",\"Nhiệt độ lò đốt\",\"Lưu lượng nước thải\",\"Khối lượng tái chế\"],0,\"Điều 11 (Phụ lục 05, mục II).\"],\n[\"Trong nhật ký hệ thống xử lý nước thải, nếu khử trùng bằng hóa chất thì phải:\",[\"Ghi rõ loại và lượng hóa chất sử dụng\",\"Không cần ghi\",\"Chỉ ghi tên người vận hành\",\"Ghi số lượng người bệnh\"],0,\"Điều 11 (Phụ lục 05, mục III).\"],\n[\"Cơ sở thuê đơn vị có giấy phép xử lý chất thải nguy hại tập trung dùng sổ giao nhận để:\",[\"Theo dõi lượng chất thải bàn giao trong tháng, làm cơ sở xuất chứng từ CTNH hằng tháng\",\"Thay thế hoàn toàn chứng từ CTNH\",\"Nộp báo cáo năm\",\"Ghi nhật ký vận hành\"],0,\"Điều 12 (Phụ lục 06, ghi chú).\"],\n[\"Sổ giao nhận chất thải nguy hại chia chất thải lây nhiễm thành các cột:\",[\"Sắc nhọn, không sắc nhọn, nguy cơ lây nhiễm cao, giải phẫu\",\"Lỏng, rắn, khí\",\"Vàng, đen, xanh, trắng\",\"Tái chế, không tái chế\"],0,\"Điều 12 (Phụ lục 06).\"],\n[\"Nhóm nào KHÔNG nằm trong bảng đào tạo, tập huấn của báo cáo Mục A Phụ lục 07?\",[\"Người bệnh và người nhà người bệnh\",\"Cán bộ lãnh đạo, quản lý\",\"Cán bộ chuyên trách quản lý chất thải y tế\",\"Nhân viên vận hành hệ thống xử lý chất thải y tế\"],0,\"Điều 13 (Phụ lục 07, Mục A).\"],\n[\"Ký hiệu “KXL” trong báo cáo về nước thải có nghĩa là:\",[\"Không xử lý, thải thẳng ra môi trường\",\"Xử lý qua hệ thống xử lý nước thải\",\"Chỉ khử trùng trước khi xả\",\"Xử lý bằng hóa chất\"],0,\"Điều 13 (Phụ lục 07, ghi chú).\"],\n[\"Ký hiệu “KT” trong báo cáo về nước thải có nghĩa là:\",[\"Không xử lý bằng hệ thống, chỉ khử trùng nước thải trước khi xả ra môi trường\",\"Xử lý qua hệ thống xử lý nước thải\",\"Không xử lý, thải thẳng\",\"Kiểm tra định kỳ\"],0,\"Điều 13 (Phụ lục 07, ghi chú).\"],\n[\"Báo cáo theo Mục B Phụ lục 07 do ai ký, đóng dấu?\",[\"Giám đốc Sở Y tế\",\"Thủ trưởng cơ sở y tế\",\"Cục trưởng Cục Quản lý môi trường y tế\",\"Chủ tịch UBND tỉnh\"],0,\"Điều 13 (Phụ lục 07, Mục B).\"],\n[\"Phần 2 của báo cáo Mục B (Sở Y tế) nêu:\",[\"Kết quả hoạt động quản lý, chỉ đạo điều hành, liệt kê số hiệu, ngày ký, trích yếu văn bản\",\"Thống kê nhân lực từng cơ sở\",\"Kế hoạch năm tiếp theo\",\"Thông tin chung của một cơ sở\"],0,\"Điều 13 (Phụ lục 07, Mục B).\"],\n[\"Cơ sở y tế có từ 2 cơ sở trực thuộc trở lên, khi báo cáo Mục A phải:\",[\"Trình bày thông tin và thống kê chất thải riêng cho từng cơ sở trực thuộc\",\"Chỉ báo cáo tổng chung\",\"Mỗi cơ sở gửi báo cáo riêng lên Bộ Y tế\",\"Không phải thống kê\"],0,\"Điều 13 (Phụ lục 07, Mục A).\"]\n];\nvar ALL=Q.slice(),i=0,sc=0,AN=[],mode=\"p\",tl=0,tm=null,CFG={c:0,n:999,m:\"p\"};\nvar CN=[\"\", \"Điều 1–3 – Phạm vi, giải thích\", \"Điều 4 – Phân định chất thải\", \"Điều 5–6 – Bao bì, phân loại\", \"Điều 7 – Thu gom\", \"Điều 8 – Lưu giữ\", \"Điều 9–12 – Giảm thiểu, tái chế, vận hành, chuyển giao\", \"Điều 13–14 – Báo cáo, hồ sơ\", \"Điều 15–16 – Trách nhiệm, thi hành\"];\nfunction sh(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=a[k];a[k]=a[j];a[j]=t}return a}\nfunction prep(){Q=sh(ALL).map(function(q){var ix=sh(q[1].map(function(_,k){return k}));return [q[0],ix.map(function(k){return q[1][k]}),ix.indexOf(q[2]),q[3]]})}\nfunction chap(q){var m=/^Điều (\\d+)/.exec(q[3]),n=m?+m[1]:0;return n\u003c=3?1:n==4?2:n\u003c=6?3:n==7?4:n==8?5:n\u003c=12?6:n\u003c=14?7:8}\nvar $=function(id){return document.getElementById(id)};\nfunction tab(n){$(\"sum\").classList.toggle(\"hide\",n!=1);$(\"quiz\").classList.toggle(\"hide\",n!=2);$(\"t1\").classList.toggle(\"on\",n==1);$(\"t2\").classList.toggle(\"on\",n==2);window.scrollTo(0,0)}\n$(\"t1\").onclick=function(){tab(1)};$(\"t2\").onclick=function(){tab(2)};\nfunction tk(){var t=$(\"tk\");if(t){var m=Math.floor(tl/60),s=tl%60;t.textContent=m+\":\"+(s\u003c10?\"0\":\"\")+s}}\nfunction setup(){\n clearInterval(tm);\n var cnt={};ALL.forEach(function(q){var c=chap(q);cnt[c]=(cnt[c]||0)+1});\n var o='\u003coption value=\"0\">Tất cả chủ đề ('+ALL.length+' câu)\u003c/option>';\n CN.forEach(function(n,c){if(c&&cnt[c])o+='\u003coption value=\"'+c+'\">'+n+' ('+cnt[c]+' câu)\u003c/option>'});\n $(\"box\").classList.remove(\"hide\");$(\"res\").classList.add(\"hide\");\n $(\"pg\").textContent=\"Thiết lập bài làm\";$(\"pb\").style.width=\"0\"; y.prototype.forEach.call(bs,function(b,j){b.disabled=true;if(j==q[2])b.classList.add(\"ok\")});\n if(k!=q[2])bs[k].classList.add(\"no\");\n $(\"ex\").innerHTML='\u003cdiv class=\"ex\">'+(k==q[2]?\"✅ Chính xác. \":\"❌ Chưa đúng. \")+q[3]+'\u003c/div>\u003cbutton class=\"btn\" id=\"nx\">'+(i==Q.length-1?\"Xem kết quả\":\"Câu tiếp theo\")+'\u003c/button>';\n $(\"nx\").onclick=function(){i++;show()};\n}\nfunction fin(){\n clearInterval(tm);\n $(\"pb\").style.width=\"100%\";$(\"box\").classList.add(\"hide\");$(\"res\").classList.remove(\"hide\");\n var n=Q.length,p=n?Math.round(sc/n*100):0,L=\"ABCD\";\n $(\"pg\").textContent=\"Hoàn thành\";\n var h='\u003cdiv class=\"score\">'+sc+'/'+n+' ('+p+'%)\u003c/div>\u003cp>'+(p>=80?\"Rất tốt! Bạn nắm vững nội dung thông tư.\":p>=60?\"Khá ổn. Hãy xem lại bảng “Nhớ nhanh” để củng cố.\":\"Cần ôn thêm. Hãy đọc lại phần tóm tắt rồi làm lại.\")+'\u003c/p>';\n if(mode==\"t\"){\n  var w=\"\";\n  Q.forEach(function(q,j){if(AN[j]!==q[2]){w+='\u003cdiv class=\"card\">\u003cdiv class=\"q\">'+(j+1)+'. '+q[0]+'\u003c/div>\u003cdiv class=\"ex\">'+(AN[j]==null?\"⏱ Chưa trả lời. \":\"Bạn chọn: \"+L[AN[j]]+\". \")+\"Đáp án đúng: \"+L[q[2]]+\". \"+q[1][q[2]]+\"\u003cbr>\"+q[3]+\"\u003c/div>\u003c/div>\"}});\n  h+=w?\"\u003ch2>Các câu cần xem lại\u003c/h2>\"+w:\"\u003cp>🎉 Không có câu nào sai!\u003c/p>\";\n }\n h+='\u003cbutton class=\"btn\" id=\"rs\">Làm lại (xáo trộn mới)\u003c/button> \u003cbutton class=\"btn\" id=\"st\">Chọn lại chủ đề/chế độ\u003c/button>';\n $(\"res\").innerHTML=h;\n $(\"rs\").onclick=function(){start(CFG)};\n $(\"st\").onclick=setup;\n}\nsetup();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "tt31": "\u003c!DOCTYPE html>\n\u003chtml lang=\"vi\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Thông tư 31/2021/TT-BYT – Hoạt động điều dưỡng trong bệnh viện: Tóm tắt & Trắc nghiệm\u003c/title>\n\u003cstyle>\n:root{--bg:#f
